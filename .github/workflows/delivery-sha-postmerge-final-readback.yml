name: DELIVERY SHA Postmerge Final Readback

on:
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: read

jobs:
  readback:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      TARGET_SHA: 81a3e358b2271710bcb132dfd00990f34f3fbee3
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Read exact main, rulesets, and postmerge workflows
        shell: python
        run: |
          import json, os, urllib.request

          repo = os.environ['GITHUB_REPOSITORY']
          sha = os.environ['TARGET_SHA']
          headers = {
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          }

          def get(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)

          branch = get(f'https://api.github.com/repos/{repo}/branches/main')
          main_sha = str((branch.get('commit') or {}).get('sha') or '')
          print('MAIN_SHA=' + main_sha)
          if main_sha != sha:
              raise SystemExit('MAIN_SHA_DRIFT')

          rows = get(f'https://api.github.com/repos/{repo}/rulesets?per_page=100')
          details = []
          for row in rows:
              rid = row.get('id')
              if not isinstance(rid, int):
                  raise SystemExit('RULESET_ID_INVALID')
              item = get(f'https://api.github.com/repos/{repo}/rulesets/{rid}')
              details.append({
                  'id': item.get('id'),
                  'name': item.get('name'),
                  'target': item.get('target'),
                  'enforcement': item.get('enforcement'),
                  'bypass_actors': item.get('bypass_actors'),
                  'conditions': item.get('conditions'),
                  'rules': item.get('rules'),
              })
          details.sort(key=lambda item: item['id'])
          print('RULESET_READBACK=' + json.dumps(details, sort_keys=True, separators=(',', ':')))
          if not details:
              raise SystemExit('RULESETS_NOT_VERIFIED')

          payload = get(f'https://api.github.com/repos/{repo}/actions/runs?head_sha={sha}&per_page=100')
          selected = []
          for run in payload.get('workflow_runs', []):
              if run.get('head_sha') != sha or run.get('event') != 'push':
                  continue
              if run.get('name') not in {'ADWF Main', 'ADWF Platform Smoke'}:
                  continue
              selected.append({key: run.get(key) for key in (
                  'id','name','event','head_sha','head_branch','status','conclusion','run_attempt','created_at','updated_at'
              )})
          selected.sort(key=lambda item: (item['name'], item['id']))
          print('POSTMERGE_READBACK=' + json.dumps(selected, sort_keys=True, separators=(',', ':')))
          names = {item['name'] for item in selected if item['status'] == 'completed' and item['conclusion'] == 'success'}
          if names != {'ADWF Main', 'ADWF Platform Smoke'}:
              raise SystemExit('required exact-merge push workflows are not both successful')
