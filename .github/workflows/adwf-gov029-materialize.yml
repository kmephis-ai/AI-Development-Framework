name: ADWF GOV-029 Disposable Materializer

on:
  push:
    branches:
      - helper/gov029-materialize-20260820-c2

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: helper/gov029-materialize-20260820-c2
          fetch-depth: 0

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12.10'
          check-latest: false

      - name: Materialize canonical projections
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          rm .github/workflows/adwf-gov029-materialize.yml
          python .adwf/scripts/docs_freshness.py --write
          python .adwf/scripts/generate_manifest.py
          git diff --exit-code -- .adwf/scripts/publish_trusted_gate.py .adwf/tests/test_trusted_session_cert_provider_gate.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .github/workflows/adwf-gov029-materialize.yml .adwf/docs-registry.json MANIFEST.json SHA256SUMS.txt
          git diff --cached --name-only | sort > /tmp/actual-paths
          printf '%s\n' '.adwf/docs-registry.json' '.github/workflows/adwf-gov029-materialize.yml' 'MANIFEST.json' 'SHA256SUMS.txt' | sort > /tmp/expected-paths
          diff -u /tmp/expected-paths /tmp/actual-paths
          git commit -m "chore: materialize GOV-029 canonical projections [helper-output]"
          git push origin HEAD:${GITHUB_REF_NAME}
