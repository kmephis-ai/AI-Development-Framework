name: OPENHANDS-001 CI Lease Refresh a1

on:
  push:
    branches:
      - helper/OPENHANDS-001-ci-lease-refresh-a1

permissions:
  contents: write
  issues: read
  pull-requests: read

concurrency:
  group: adwf-control-${{ github.repository }}
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  refresh-source-lease:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact trusted main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 0c20ee50ac50e36422c93a32fca151b411bc8b95
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12.10"
      - name: Verify provider truth and refresh exact writer lease
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: python
        run: |
          from pathlib import Path
          import json, os, re, sys

          root = Path.cwd()
          sys.path.insert(0, str(root / '.adwf'))

          from lib.assurance_builder import build_assurance_snapshot
          from lib.cost_guard import evaluate_provider
          from lib.github_lease_store import GitHubLeaseStore
          from lib.github_provider import GitHubClient
          from lib.github_rulesets import verify_rulesets, verify_runtime_anchor_ruleset
          from lib.health import doctor
          from lib.lease_registry import _registry_lease_freshness_errors
          from lib.leases import utc_now
          from lib.policy_runtime import evaluate_with_effective_policy
          from lib.strict_json import loads as strict_loads
          from lib.trusted_context import compile_trusted_context

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GITHUB_TOKEN']
          expected_main = '0c20ee50ac50e36422c93a32fca151b411bc8b95'
          expected_source = '949f3a484a0c35953143690bd159c2a2a04fd160'
          source_branch = 'adwf/openhands-001-a1'
          issue_id = '268'
          roadmap_id = 'OPENHANDS-001'
          worker_id = 'adwf-runtime:openhands-001-source-a1'
          resources = [{'kind': 'provider', 'scope': 'global', 'shared': True, 'global': True}]

          cfg = strict_loads((root / '.adwf/config.json').read_text(encoding='utf-8'))
          policy = cfg.get('policy') or {}
          orch = cfg.get('orchestration') or {}
          cost_cfg = cfg.get('cost') or {}
          if policy.get('fail_mode') != 'CLOSED' or policy.get('active_autonomy') != 'A2' or policy.get('max_autonomous_risk') != 'R1':
              raise SystemExit('CI_REFRESH_POLICY_DRIFT')
          if orch.get('max_parallel_writers') != 1 or cost_cfg.get('mode') != 'FREE_ONLY' or cost_cfg.get('monetary_budget') != 0:
              raise SystemExit('CI_REFRESH_GOVERNANCE_DRIFT')
          ttl_minutes = int(orch.get('lease_ttl_minutes') or 120)
          if ttl_minutes != 120:
              raise SystemExit('CI_REFRESH_TTL_DRIFT')

          client = GitHubClient(repo, token)
          store = GitHubLeaseStore(client)

          def branch_sha(name):
              value = str((client.branch(name).get('commit') or {}).get('sha') or '')
              if re.fullmatch(r'[0-9a-f]{40}', value) is None:
                  raise SystemExit('CI_REFRESH_REF_INVALID:' + name)
              return value

          def verify_rules():
              rows = client.rulesets()
              if verify_rulesets(rows, expected_integration_id=15368).get('readback_verified') is not True:
                  raise SystemExit('CI_REFRESH_MAIN_RULESET_NOT_VERIFIED')
              if verify_runtime_anchor_ruleset(rows).get('readback_verified') is not True:
                  raise SystemExit('CI_REFRESH_ANCHOR_RULESET_NOT_VERIFIED')
              named = {str(item.get('name') or ''): item for item in rows}
              for name in ('ADWF protected main', 'ADWF immutable runtime anchors'):
                  ruleset = named.get(name) or {}
                  if ruleset.get('enforcement') != 'active' or (ruleset.get('bypass_actors') or []) != []:
                      raise SystemExit('CI_REFRESH_RULESET_DRIFT:' + name)
                  if ruleset.get('current_user_can_bypass') not in (None, 'never', False):
                      raise SystemExit('CI_REFRESH_BYPASS_DRIFT:' + name)

          def authorize_recovery():
              providers = strict_loads((root / '.adwf/providers.json').read_text(encoding='utf-8'))
              capability = str(cost_cfg.get('default_ci_capability') or '')
              cost_decision = evaluate_provider(
                  providers,
                  {
                      'provider': capability,
                      'mandatory_ci': True,
                      'automated': True,
                      'projected_cost': 0,
                      'projected_units': 0,
                      'repository_visibility': 'PUBLIC',
                      'runner_class': 'standard',
                  },
                  canonical_provider='github',
              )
              if cost_decision.get('result') != 'ALLOW' or float(cost_decision.get('projected_cost_usd') or 0) != 0:
                  raise SystemExit('CI_REFRESH_COST_NOT_ALLOWED')
              categories = doctor(root).get('categories') or {}
              assurance = build_assurance_snapshot(
                  root,
                  subject_sha=expected_main,
                  health={
                      'package_integrity': str((categories.get('package_integrity') or {}).get('status') or 'NOT_VERIFIED'),
                      'config_health': str((categories.get('config_health') or {}).get('status') or 'NOT_VERIFIED'),
                      'control_plane_health': 'HEALTHY',
                      'product_health': 'NOT_VERIFIED',
                  },
                  gates={}, required_gates=[], evidence_records=[], evidence_refs=[],
                  provider_readback={
                      'provider': 'github', 'subject_sha': expected_main,
                      'repository_visibility': 'PUBLIC', 'runner': 'NOT_VERIFIED',
                      'larger_runner': False, 'facts_readback_verified': True,
                      'readback_verified': True, 'purpose': 'OPENHANDS_CI_LEASE_REFRESH',
                  },
                  cost=cost_decision, ttl_minutes=5,
              )
              context = compile_trusted_context(
                  root, action='repair', risk='R1', work_type='recovery',
                  request={
                      'request_id': 'openhands-001:ci-lease-refresh:' + expected_source,
                      'subject_sha': expected_main,
                      'preview_digest': None,
                  },
                  assurance_snapshot=assurance,
                  provider_readback=assurance['provider'],
              )
              decision = evaluate_with_effective_policy(root, context)
              if decision.result != 'ALLOW':
                  raise SystemExit('CI_REFRESH_POLICY_NOT_ALLOW:' + decision.result + ':' + ','.join(decision.reason_codes))

          if branch_sha('main') != expected_main or branch_sha(source_branch) != expected_source:
              raise SystemExit('CI_REFRESH_PROVIDER_REF_DRIFT')
          verify_rules()
          issue = client.get(f'/repos/{repo}/issues/{issue_id}')
          if issue.get('state') != 'open' or roadmap_id not in str(issue.get('title') or ''):
              raise SystemExit('CI_REFRESH_ISSUE_DRIFT')
          pr = client.pull(270)
          if pr.get('state') != 'open' or pr.get('draft') is not False:
              raise SystemExit('CI_REFRESH_PR_STATE_DRIFT')
          if str((pr.get('base') or {}).get('sha') or '') != expected_main or str((pr.get('head') or {}).get('sha') or '') != expected_source:
              raise SystemExit('CI_REFRESH_PR_IDENTITY_DRIFT')
          open_prs = [item for item in client.pulls() if item.get('state') == 'open']
          if len(open_prs) != 1 or int(open_prs[0].get('number') or 0) != 270:
              raise SystemExit('CI_REFRESH_OPEN_PR_CONFLICT')

          registry, before_anchor = store.read(expected_main_sha=expected_main, policy_max_parallel_writers=1)
          active = [item for item in registry.get('leases') or [] if item.get('status') == 'ACTIVE']
          if len(active) != 1:
              raise SystemExit('CI_REFRESH_ACTIVE_WRITER_COUNT_MISMATCH')
          lease = active[0]
          expected_identity = {
              'issue_id': issue_id,
              'roadmap_id': roadmap_id,
              'worker_id': worker_id,
              'branch': source_branch,
              'base_sha': expected_main,
          }
          for key, value in expected_identity.items():
              if str(lease.get(key) or '') != value:
                  raise SystemExit('CI_REFRESH_LEASE_IDENTITY_DRIFT:' + key)
          if lease.get('resources') != resources:
              raise SystemExit('CI_REFRESH_RESOURCE_DRIFT')

          authorize_recovery()
          freshness = _registry_lease_freshness_errors(lease, utc_now())
          old_lease_id = str(lease.get('lease_id') or '')
          old_revision = int(registry.get('revision') or 0)
          action = 'HEARTBEAT'
          release_anchor = None
          if freshness:
              released, release_anchor = store.release(
                  expected_main_sha=expected_main,
                  policy_max_parallel_writers=1,
                  lease_id=old_lease_id,
                  worker_id=worker_id,
                  provider_reconciled=True,
                  provider_reconciliation_ref='pr/270@' + expected_source,
              )
              state, new_lease, final_anchor = store.acquire(
                  expected_main_sha=expected_main,
                  policy_max_parallel_writers=1,
                  issue_id=issue_id,
                  roadmap_id=roadmap_id,
                  worker_id=worker_id,
                  base_sha=expected_main,
                  branch=source_branch,
                  resources=resources,
                  ttl_minutes=ttl_minutes,
              )
              action = 'RECONCILE_REACQUIRE'
          else:
              state, final_anchor = store.heartbeat(
                  expected_main_sha=expected_main,
                  policy_max_parallel_writers=1,
                  lease_id=old_lease_id,
                  worker_id=worker_id,
                  ttl_minutes=ttl_minutes,
              )
              new_lease = next(item for item in state['leases'] if item.get('lease_id') == old_lease_id)

          final, read_anchor = store.read(expected_main_sha=expected_main, policy_max_parallel_writers=1)
          active = [item for item in final.get('leases') or [] if item.get('status') == 'ACTIVE']
          if read_anchor != final_anchor or len(active) != 1 or active[0].get('lease_id') != new_lease.get('lease_id'):
              raise SystemExit('CI_REFRESH_FINAL_READBACK_MISMATCH')
          if branch_sha('main') != expected_main or branch_sha(source_branch) != expected_source:
              raise SystemExit('CI_REFRESH_FINAL_REF_DRIFT')
          verify_rules()
          print('OPENHANDS_CI_LEASE_REFRESH=PASS')
          print('ACTION=' + action)
          print('OLD_REVISION=' + str(old_revision))
          print('ACTIVE_REVISION=' + str(final.get('revision')))
          print('OLD_LEASE_ID=' + old_lease_id)
          print('ACTIVE_LEASE_ID=' + str(active[0].get('lease_id') or ''))
          print('ACTIVE_HEARTBEAT_AT=' + str(active[0].get('heartbeat_at') or ''))
          print('ACTIVE_EXPIRES_AT=' + str(active[0].get('expires_at') or ''))
          print('ACTIVE_ANCHOR=' + read_anchor)
          print('OLD_FRESHNESS=' + json.dumps(freshness, sort_keys=True))
          print('RULESETS=VERIFIED_NO_BYPASS')
          print('POLICY=ALLOW')
          print('COST_USD=0')
