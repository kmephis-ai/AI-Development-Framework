name: GOV-004 deterministic repair

on:
  push:
    branches: ["gov/004-trusted-status-publication"]

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12.10"
      - name: Remove one-shot workflow before validation
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          rm .github/workflows/adwf-gov004-repair.yml
      - name: Rebuild deterministic projections
        run: |
          python .adwf/scripts/docs_freshness.py --write --reviewed-at "2026-08-15T11:13:00Z" --valid-until "2026-11-15T11:13:00Z"
          python .adwf/scripts/generate_manifest.py
      - name: Validate repaired working tree
        run: |
          python .adwf/scripts/validate_ci.py
          python .adwf/adwf.py provider-check --input .adwf/requests/github-public-standard.json
          python .adwf/scripts/validate_framework.py
          python .adwf/scripts/validate_pipeline_ir.py
          python .adwf/adwf.py doctor --scope package_integrity
          python .adwf/adwf.py doctor --scope config_health
          python .adwf/adwf.py self-test
          python .adwf/scripts/validate_docs.py
          python .adwf/scripts/generate_manifest.py --check
          git diff --check
      - name: Commit exact deterministic repair to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Complete GOV-004 deterministic projections"
          git push origin HEAD:gov/004-trusted-status-publication
