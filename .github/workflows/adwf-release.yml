name: ADWF Release

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Подтверждаю выпуск уже подготовленной внутренней версии"
        required: true
        type: boolean
permissions:
  contents: read
concurrency:
  group: adwf-release
  cancel-in-progress: false
jobs:
  release:
    if: inputs.confirm == true && vars.ADWF_RELEASE_ENABLED == 'true'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12.10"
      - name: Release internal exact version only
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .adwf/scripts/release.py --confirm --external --publish-github
