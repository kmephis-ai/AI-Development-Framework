name: ORCH_CLAIM_GATEWAY-001 Terminal Lease Release A3

on:
  pull_request:
    types: [reopened, synchronize]

permissions: {}

concurrency:
  group: orch-claim-gateway-001-terminal-lease-release-a3
  cancel-in-progress: false

jobs:
  release-lease:
    if: github.event.pull_request.number == 288 && github.event.pull_request.head.ref == 'helper/ORCH_CLAIM_GATEWAY-001-source-authority-a1'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    permissions:
      actions: read
      contents: write
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 3522578ef857f1aa4e0f18b700c050a0ecedeb58
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12.10"

      - name: Release exact terminal writer lease after verified merge
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_MAIN: 3522578ef857f1aa4e0f18b700c050a0ecedeb58
          EXPECTED_TREE: a8502135ce024279a503b5204ab831d86ef1b516
          EXPECTED_PARENT: 730cab912f779bec1f3208c66eda1889f69d6f4c
          EXPECTED_CANDIDATE: c1324b41345d28e3a32fca7df8105324a96bc8c2
          EXPECTED_POLICY_HASH: 8fb9e2baa6aae69f9d0e1a813ae6e63359cb3b57bfba9f5f2ecb06b8c2760379
          EXPECTED_REVISION: '59'
          EXPECTED_ANCHOR: 7fd1d1086ddd56779921180f8389e55033c447ce
          EXPECTED_LEASE: db7edabc-8f9c-4a27-9a2c-28700000a2c0
          ISSUE_ID: '287'
          PR_NUMBER: '289'
          ROADMAP_ID: ORCH_CLAIM_GATEWAY-001
          WORKER_ID: adwf-runtime:orch-claim-gateway-001-bootstrap-a1
          WORK_BRANCH: adwf/orch-claim-gateway-001-5ab023d85879
          ADWF_MAIN_RUN: '33090358387'
          ADWF_SMOKE_RUN: '33090358348'
          HELPER_PR: '288'
          HELPER_BRANCH: helper/ORCH_CLAIM_GATEWAY-001-source-authority-a1
          HELPER_PATH: .github/workflows/adwf-orch-claim-gateway-source-authority.yml
        shell: python
        run: |
          from pathlib import Path
          import json
          import os
          import sys

          root = Path.cwd()
          sys.path.insert(0, str(root / ".adwf"))

          from lib.action_executors import _stage1_resources
          from lib.github_lease_store import GitHubLeaseStore
          from lib.github_provider import GitHubClient
          from lib.github_rulesets import verify_rulesets, verify_runtime_anchor_ruleset
          from lib.strict_json import loads as strict_loads

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]
          expected_main = os.environ["EXPECTED_MAIN"]
          expected_tree = os.environ["EXPECTED_TREE"]
          expected_parent = os.environ["EXPECTED_PARENT"]
          expected_candidate = os.environ["EXPECTED_CANDIDATE"]
          expected_policy_hash = os.environ["EXPECTED_POLICY_HASH"]
          expected_revision = int(os.environ["EXPECTED_REVISION"])
          expected_anchor = os.environ["EXPECTED_ANCHOR"]
          expected_lease = os.environ["EXPECTED_LEASE"]
          issue_id = os.environ["ISSUE_ID"]
          pr_number = int(os.environ["PR_NUMBER"])
          roadmap_id = os.environ["ROADMAP_ID"]
          worker_id = os.environ["WORKER_ID"]
          work_branch = os.environ["WORK_BRANCH"]
          main_run_id = int(os.environ["ADWF_MAIN_RUN"])
          smoke_run_id = int(os.environ["ADWF_SMOKE_RUN"])
          helper_pr = int(os.environ["HELPER_PR"])
          helper_branch = os.environ["HELPER_BRANCH"]
          helper_path = os.environ["HELPER_PATH"]
          expected_paths = {
              ".adwf/lib/provider_claim_gateway.py",
              ".adwf/scripts/consume_agent_result.py",
              ".adwf/tests/test_provider_claim_gateway.py",
              ".adwf/docs-registry.json",
              "MANIFEST.json",
              "SHA256SUMS.txt",
          }

          event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text(encoding="utf-8"))
          event_pr = event.get("pull_request") or {}
          if int(event_pr.get("number") or 0) != helper_pr:
              raise SystemExit("A3C_HELPER_PR_MISMATCH")
          if str((event_pr.get("head") or {}).get("ref") or "") != helper_branch:
              raise SystemExit("A3C_HELPER_BRANCH_MISMATCH")
          if str((event_pr.get("head") or {}).get("repo", {}).get("full_name") or "") != repo:
              raise SystemExit("A3C_HELPER_CROSS_REPOSITORY_FORBIDDEN")
          if str((event_pr.get("base") or {}).get("ref") or "") != "main":
              raise SystemExit("A3C_HELPER_BASE_BRANCH_DRIFT")
          event_base_sha = str((event_pr.get("base") or {}).get("sha") or "")
          if event_base_sha not in {expected_parent, expected_main}:
              raise SystemExit("A3C_HELPER_BASE_SHA_DRIFT")

          client = GitHubClient(repo, token)
          helper_files = client.pull_files(helper_pr)
          if len(helper_files) != 1:
              raise SystemExit("A3C_HELPER_SCOPE_NOT_SINGLE_FILE")
          helper_file = helper_files[0]
          if str(helper_file.get("filename") or "") != helper_path or str(helper_file.get("status") or "") != "added":
              raise SystemExit("A3C_HELPER_SCOPE_PATH_MISMATCH")

          repo_info = client.repo_info()
          if str(repo_info.get("default_branch") or "") != "main":
              raise SystemExit("A3C_DEFAULT_BRANCH_DRIFT")
          main = client.branch("main")
          if str((main.get("commit") or {}).get("sha") or "") != expected_main:
              raise SystemExit("A3C_MAIN_SHA_DRIFT")
          commit = client.get(f"/repos/{repo}/git/commits/{expected_main}")
          if str((commit.get("tree") or {}).get("sha") or "") != expected_tree:
              raise SystemExit("A3C_MAIN_TREE_DRIFT")
          parents = [str(item.get("sha") or "") for item in commit.get("parents") or []]
          if parents != [expected_parent]:
              raise SystemExit("A3C_MAIN_PARENT_DRIFT")

          policy = strict_loads((root / ".adwf/effective-policy.json").read_text(encoding="utf-8"))
          if policy.get("policy_hash") != expected_policy_hash:
              raise SystemExit("A3C_EFFECTIVE_POLICY_HASH_DRIFT")
          if policy.get("active_autonomy") != "A2" or policy.get("max_autonomous_risk") != "R1":
              raise SystemExit("A3C_EFFECTIVE_POLICY_AUTONOMY_DRIFT")
          if policy.get("hard_budget_usd") != 0 or policy.get("mandatory_ai_api") is not False:
              raise SystemExit("A3C_EFFECTIVE_POLICY_FREE_ONLY_DRIFT")
          if policy.get("max_parallel_writers") != 1:
              raise SystemExit("A3C_EFFECTIVE_POLICY_WRITER_CEILING_DRIFT")
          if ((policy.get("rules") or {}).get("action_min_autonomy") or {}).get("cleanup") != "A2":
              raise SystemExit("A3C_CLEANUP_POLICY_DRIFT")

          rules = client.rulesets()
          main_rules = verify_rulesets(rules, expected_integration_id=15368)
          anchor_rules = verify_runtime_anchor_ruleset(rules)
          if main_rules.get("readback_verified") is not True:
              raise SystemExit("A3C_MAIN_RULESET_NOT_VERIFIED")
          if anchor_rules.get("readback_verified") is not True:
              raise SystemExit("A3C_ANCHOR_RULESET_NOT_VERIFIED")

          issue = client.get(f"/repos/{repo}/issues/{int(issue_id)}")
          if issue.get("state") != "open":
              raise SystemExit("A3C_WORK_ISSUE_NOT_OPEN")
          if f"[{roadmap_id}]" not in str(issue.get("title") or ""):
              raise SystemExit("A3C_WORK_ISSUE_IDENTITY_MISMATCH")

          pr = client.pull(pr_number)
          if pr.get("state") != "closed" or pr.get("merged") is not True:
              raise SystemExit("A3C_WORK_PR_NOT_MERGED")
          if str(pr.get("merge_commit_sha") or "") != expected_main:
              raise SystemExit("A3C_WORK_PR_MERGE_SHA_DRIFT")
          if str((pr.get("base") or {}).get("ref") or "") != "main":
              raise SystemExit("A3C_WORK_PR_BASE_BRANCH_DRIFT")
          if str((pr.get("base") or {}).get("sha") or "") != expected_parent:
              raise SystemExit("A3C_WORK_PR_BASE_SHA_DRIFT")
          if str((pr.get("head") or {}).get("ref") or "") != work_branch:
              raise SystemExit("A3C_WORK_PR_BRANCH_DRIFT")
          if str((pr.get("head") or {}).get("sha") or "") != expected_candidate:
              raise SystemExit("A3C_WORK_PR_HEAD_DRIFT")
          if str((pr.get("head") or {}).get("repo", {}).get("full_name") or "") != repo:
              raise SystemExit("A3C_WORK_PR_CROSS_REPOSITORY_FORBIDDEN")
          work_files = client.pull_files(pr_number)
          actual_paths = {str(item.get("filename") or "") for item in work_files}
          if actual_paths != expected_paths or len(work_files) != len(expected_paths):
              raise SystemExit("A3C_WORK_PR_SCOPE_DRIFT")

          def verified_run(run_id, expected_name):
              run = client.get(f"/repos/{repo}/actions/runs/{run_id}")
              if str(run.get("name") or "") != expected_name:
                  raise SystemExit("A3C_CI_NAME_DRIFT:" + expected_name)
              if str(run.get("head_sha") or "") != expected_main:
                  raise SystemExit("A3C_CI_SHA_DRIFT:" + expected_name)
              if run.get("status") != "completed" or run.get("conclusion") != "success":
                  raise SystemExit("A3C_CI_NOT_SUCCESS:" + expected_name)
              return client.get(f"/repos/{repo}/actions/runs/{run_id}/jobs?per_page=100")

          main_jobs = verified_run(main_run_id, "ADWF Main")
          main_rows = main_jobs.get("jobs") or []
          canonical = [item for item in main_rows if item.get("name") == "canonical-verification"]
          if len(canonical) != 1 or canonical[0].get("status") != "completed" or canonical[0].get("conclusion") != "success":
              raise SystemExit("A3C_MAIN_CANONICAL_JOB_NOT_SUCCESS")

          smoke_jobs = verified_run(smoke_run_id, "ADWF Platform Smoke")
          smoke_rows = smoke_jobs.get("jobs") or []
          smoke = {str(item.get("name") or ""): item for item in smoke_rows}
          if set(smoke) != {"smoke (ubuntu-24.04)", "smoke (windows-2022)"}:
              raise SystemExit("A3C_SMOKE_JOB_SET_DRIFT")
          for name in ("smoke (ubuntu-24.04)", "smoke (windows-2022)"):
              if smoke[name].get("status") != "completed" or smoke[name].get("conclusion") != "success":
                  raise SystemExit("A3C_SMOKE_JOB_NOT_SUCCESS:" + name)

          store = GitHubLeaseStore(client)
          registry, anchor = store.read(expected_main_sha=expected_main, policy_max_parallel_writers=1)
          if registry.get("revision") != expected_revision or anchor != expected_anchor:
              raise SystemExit("A3C_LEASE_STREAM_DRIFT")
          active = [item for item in registry.get("leases") or [] if item.get("status") == "ACTIVE"]
          if len(active) != 1:
              raise SystemExit("A3C_ACTIVE_WRITER_COUNT_DRIFT")
          lease = active[0]
          required = {
              "lease_id": expected_lease,
              "issue_id": issue_id,
              "roadmap_id": roadmap_id,
              "worker_id": worker_id,
              "base_sha": expected_parent,
              "branch": work_branch,
              "resources": _stage1_resources(),
          }
          for key, expected in required.items():
              if lease.get(key) != expected:
                  raise SystemExit("A3C_LEASE_IDENTITY_DRIFT:" + key)

          reconciliation_ref = "github:commit:" + expected_main
          released, release_anchor = store.release(
              expected_main_sha=expected_main,
              policy_max_parallel_writers=1,
              lease_id=expected_lease,
              worker_id=worker_id,
              provider_reconciled=True,
              provider_reconciliation_ref=reconciliation_ref,
          )
          if released.get("revision") != expected_revision + 1 or not release_anchor:
              raise SystemExit("A3C_RELEASE_READBACK_INVALID")
          if released.get("observed_main_sha") != expected_main:
              raise SystemExit("A3C_RELEASE_MAIN_BINDING_INVALID")
          active_after = [item for item in released.get("leases") or [] if item.get("status") == "ACTIVE"]
          if active_after:
              raise SystemExit("A3C_RELEASE_ACTIVE_WRITER_REMAINS")
          lease_after = [item for item in released.get("leases") or [] if item.get("lease_id") == expected_lease]
          if len(lease_after) != 1 or lease_after[0].get("status") != "RELEASED":
              raise SystemExit("A3C_RELEASED_LEASE_MISSING")
          if lease_after[0].get("provider_reconciliation_ref") != reconciliation_ref:
              raise SystemExit("A3C_RELEASE_RECONCILIATION_REF_MISMATCH")

          reread, reread_anchor = store.read(expected_main_sha=expected_main, policy_max_parallel_writers=1)
          if reread.get("revision") != expected_revision + 1 or reread_anchor != release_anchor:
              raise SystemExit("A3C_RELEASE_STREAM_READBACK_MISMATCH")
          if any(item.get("status") == "ACTIVE" for item in reread.get("leases") or []):
              raise SystemExit("A3C_RELEASE_REREAD_ACTIVE_WRITER_REMAINS")

          print("A3C_TERMINAL_LEASE_RELEASE=PASS")
          print("LEASE_ID=" + expected_lease)
          print("LEASE_REVISION=" + str(reread["revision"]))
          print("LEASE_ANCHOR=" + str(reread_anchor))
          print("PROVIDER_RECONCILIATION_REF=" + reconciliation_ref)
          print("ACTIVE_WRITERS=0")
          print("ISSUE_CLOSE_AUTHORITY=False")
          print("SOURCE_MUTATION=False")
          print("MONETARY_COST_USD=0")
