name: SESSION CERT Classifier Repair

on:
  pull_request:
    types: [opened, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  repair-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12.10'
          check-latest: false
      - name: Remove disposable helper from final tree
        run: |
          set -euo pipefail
          git config user.name 'adwf-session-cert-repair'
          git config user.email 'adwf-session-cert-repair@users.noreply.github.com'
          git rm .github/workflows/helper-session-cert-classifier-repair.yml
          git commit -m '[SESSION_CERT-001] Drop disposable classifier repair workflow'
      - name: Preserve upgrade schema path and add SESSION lane
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          schema_path = Path('.adwf/schemas/capability-live-evidence-certification.schema.json')
          schema = json.loads(schema_path.read_text(encoding='utf-8'))
          props = schema['properties']
          items = props['certifications']['items']
          assert set(items) == {'oneOf'}, items.keys()
          assert len(items['oneOf']) == 2
          upgrade, session = items['oneOf']
          assert upgrade['properties']['evidence_class']['const'] == 'REAL_EXTERNAL_CONSUMER_UPGRADE'
          assert session['properties']['evidence_class']['const'] == 'SESSION_CONTINUITY_HANDOVER'
          props['certifications']['items'] = upgrade
          assert 'session_certifications' not in props
          props['session_certifications'] = {
              'type': 'array',
              'minItems': 1,
              'items': session,
          }
          schema_path.write_text(json.dumps(schema, ensure_ascii=False, separators=(',', ':')) + '\n', encoding='utf-8')

          lib_path = Path('.adwf/lib/capability_live_evidence.py')
          text = lib_path.read_text(encoding='utf-8')
          old = '''    value["certifications"] = [seal_certification(item) for item in value.get("certifications", [])]\n    value["registry_sha256"] = _digest(_without(value, "registry_sha256"))\n'''
          new = '''    value["certifications"] = [seal_certification(item) for item in value.get("certifications", [])]\n    if "session_certifications" in value:\n        value["session_certifications"] = [seal_certification(item) for item in value.get("session_certifications", [])]\n    value["registry_sha256"] = _digest(_without(value, "registry_sha256"))\n'''
          assert text.count(old) == 1
          text = text.replace(old, new)
          old_loop = '    for cert in registry.get("certifications") or []:\n'
          assert text.count(old_loop) == 1
          text = text.replace(old_loop, '    for cert in [*(registry.get("certifications") or []), *(registry.get("session_certifications") or [])]:\n')
          pattern = re.compile(r'^(\s*)certs = \{str\(item\.get\("id"\) or ""\): item for item in registry\.get\("certifications"\) or \[\]\}\s*$', re.MULTILINE)
          matches = list(pattern.finditer(text))
          assert len(matches) == 1, len(matches)
          indent = matches[0].group(1)
          replacement = indent + 'cert_items = [*(registry.get("certifications") or []), *(registry.get("session_certifications") or [])]\n' + indent + 'certs = {str(item.get("id") or ""): item for item in cert_items}'
          text = pattern.sub(replacement, text, count=1)
          lib_path.write_text(text, encoding='utf-8')

          test_path = Path('.adwf/tests/test_capability_live_evidence.py')
          tests = test_path.read_text(encoding='utf-8')
          marker = '    def _session_registry_and_trace(self):\n'
          assert tests.count(marker) == 1
          before, after = tests.split(marker, 1)
          assert after.count('registry["certifications"].append(cert)') == 1
          after = after.replace('registry["certifications"].append(cert)', 'registry["session_certifications"] = [cert]', 1)
          assert after.count('registry["certifications"][-1]') >= 1
          after = after.replace('registry["certifications"][-1]', 'registry["session_certifications"][-1]')
          test_path.write_text(before + marker + after, encoding='utf-8')
          PY
          python -m py_compile .adwf/lib/capability_live_evidence.py .adwf/tests/test_capability_live_evidence.py
          python .adwf/tests/test_capability_live_evidence.py -v
      - name: Materialize canonical projections
        run: |
          set -euo pipefail
          python .adwf/scripts/docs_freshness.py --write
          python .adwf/scripts/generate_manifest.py
          python .adwf/scripts/generate_manifest.py --check
          git add .adwf/schemas/capability-live-evidence-certification.schema.json .adwf/lib/capability_live_evidence.py .adwf/tests/test_capability_live_evidence.py .adwf/docs-registry.json MANIFEST.json SHA256SUMS.txt
          git commit -m '[SESSION_CERT-001] Preserve upgrade schema path for standing authorization'
      - name: Validate exact final tree and BASE classification
        run: |
          set -euo pipefail
          python .adwf/tests/test_capability_live_evidence.py -v
          python .adwf/scripts/validate_capabilities.py
          python .adwf/scripts/validate_docs.py
          python .adwf/scripts/validate_framework.py
          python .adwf/adwf.py self-test
          python - <<'PY'
          import json
          import sys
          sys.path.insert(0, '.adwf')
          from lib.trust import classify_git_diff
          result = classify_git_diff('.', 'ac95b871e7f8796c9f9f61c917911cf1d40674c2', 'HEAD')
          print(json.dumps(result, ensure_ascii=False, sort_keys=True))
          assert result.get('result') == 'ALLOW', result
          assert result.get('authorization_mode') == 'STANDING_OWNER_POLICY', result
          assert result.get('human_required') is False, result
          PY
          git diff --check ac95b871e7f8796c9f9f61c917911cf1d40674c2...HEAD
          test -z "$(git status --porcelain)"
      - name: Publish validated helper tree
        run: |
          set -euo pipefail
          git push origin HEAD:helper/session-cert-001-classifier-repair-20260820-a1
