name: SESSION CERT Protective Marker Diagnostic

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

permissions:
  contents: read

jobs:
  marker-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12.10'
          check-latest: false
      - name: Apply candidate additive-lane transform in worktree
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          text_path = Path('.adwf/lib/capability_live_evidence.py')
          text = text_path.read_text(encoding='utf-8')
          old = '''    value["certifications"] = [seal_certification(item) for item in value.get("certifications", [])]\n    value["registry_sha256"] = _digest(_without(value, "registry_sha256"))\n'''
          new = '''    value["certifications"] = [seal_certification(item) for item in value.get("certifications", [])]\n    if "session_certifications" in value:\n        value["session_certifications"] = [seal_certification(item) for item in value.get("session_certifications", [])]\n    value["registry_sha256"] = _digest(_without(value, "registry_sha256"))\n'''
          assert text.count(old) == 1
          text = text.replace(old, new)
          old_validate = '    for cert in registry.get("certifications") or []:\n'
          assert text.count(old_validate) == 1
          text = text.replace(old_validate, '    for cert in [*(registry.get("certifications") or []), *(registry.get("session_certifications") or [])]:\n', 1)
          old_resolve = '''    certs: dict[str, dict[str, Any]] = {}\n    for item in registry.get("certifications") or []:\n'''
          assert text.count(old_resolve) == 1
          text = text.replace(old_resolve, '''    certs: dict[str, dict[str, Any]] = {}\n    for item in [*(registry.get("certifications") or []), *(registry.get("session_certifications") or [])]:\n''', 1)
          text_path.write_text(text, encoding='utf-8')
          PY
      - name: Print exact BASE protective marker delta
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import re
          import subprocess
          from pathlib import Path

          base = 'ac95b871e7f8796c9f9f61c917911cf1d40674c2'
          path = '.adwf/lib/capability_live_evidence.py'
          old_text = subprocess.check_output(['git', 'show', f'{base}:{path}'], text=True)
          new_text = Path(path).read_text(encoding='utf-8')
          protective = re.compile(
              r'(?:validate_[A-Za-z0-9_.-]+|self-test|unittest|'
              r'required_status[A-Za-z0-9_.-]*|human-gated|fail[_ -]?closed|'
              r'(?:contents|issues|checks|pull-requests):\s*read|'
              r'(?:required|enforce|protected|independent)[^,\n]{0,80}(?:true|yes))',
              re.IGNORECASE,
          )
          old_markers = {m.group(0).lower() for m in protective.finditer(old_text)}
          new_markers = {m.group(0).lower() for m in protective.finditer(new_text)}
          result = {
              'old_only': sorted(old_markers - new_markers),
              'new_only': sorted(new_markers - old_markers),
              'old_count': len(old_markers),
              'new_count': len(new_markers),
          }
          print('PROTECTIVE_MARKER_DELTA=' + json.dumps(result, ensure_ascii=False, sort_keys=True))
          assert not result['old_only'], result
          PY
