name: ADWF CODE_QUALITY Roadmap Projection Materializer

on:
  push:
    branches:
      - agent/CODE_QUALITY-001-roadmap

permissions:
  contents: write

env:
  BASE_SHA: 9ec018f292e7b8537e324e7db645f1176d8cd83f

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Verify bounded source and refresh projections
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base "${BASE_SHA}" HEAD)" = "${BASE_SHA}"
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('.adwf/roadmap.json').read_text(encoding='utf-8'))
          items=[t for g in data['goals'] for t in g['tasks'] if t.get('roadmap_id')=='CODE_QUALITY-001']
          expected={
            'roadmap_id':'CODE_QUALITY-001',
            'title_ru':'Evidence-backed Critical Code Quality & Mutation-Sensitive Verification',
            'dependencies':['ARCH_FITNESS-001','EVAL-001'],
            'product_impact':False,
          }
          if len(items)!=1 or items[0]!=expected:
              raise SystemExit('CODE_QUALITY_ROADMAP_CONTRACT_MISMATCH')
          PY
          python .adwf/scripts/docs_freshness.py --write --reviewed-at 2026-08-13T00:00:00Z --valid-until 2026-11-13T00:00:00Z
          python .adwf/scripts/generate_manifest.py
          git rm .github/workflows/adwf-code-quality-roadmap-materialize.yml

          mapfile -t changed < <(git diff --name-only "${BASE_SHA}" -- | sort)
          expected=(.adwf/docs-registry.json .adwf/roadmap.json MANIFEST.json SHA256SUMS.txt)
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          printf 'changed=%s\n' "${changed[*]}"
          test "${#changed[@]}" -eq "${#expected_sorted[@]}"
          for i in "${!expected_sorted[@]}"; do
            test "${changed[$i]}" = "${expected_sorted[$i]}"
          done

      - name: Publish generated candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "[CODE_QUALITY-001] Refresh canonical Roadmap projections"
          git push origin HEAD:agent/CODE_QUALITY-001-roadmap
