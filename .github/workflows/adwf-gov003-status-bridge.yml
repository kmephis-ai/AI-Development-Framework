name: GOV-003 provider status bridge

on:
  push:
    branches: ["adwf/gov003-status-bridge"]

permissions:
  contents: read
  actions: read
  checks: write
  pull-requests: read
  statuses: write

env:
  PYTHONDONTWRITEBYTECODE: "1"
  ADWF_TRUSTED_BASE_SHA: "ad0ae41d9e6e922167e84937728a33fd4d43aea1"
  ADWF_TARGET_SHA: "4fc95c436b26130f16bc9e06a6e9da838bdb9d0e"
  ADWF_PR_NUMBER: "16"

jobs:
  bridge:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.ADWORD_TRUSTED_BASE_SHA || env.ADWF_TRUSTED_BASE_SHA }}
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12.10"
      - name: Re-evaluate exact HEAD with canonical default-branch evaluator
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD)" = "$ADWF_TRUSTED_BASE_SHA"
          printf '{"pull_request":{"number":%s,"head":{"sha":"%s"}},"number":%s}\n' "$ADWF_PR_NUMBER" "$ADWF_TARGET_SHA" "$ADWF_PR_NUMBER" > /tmp/adwf-event.json
          python .adwf/scripts/publish_trusted_gate.py --event /tmp/adwf-event.json | tee /tmp/adwf-gate.json
          python - <<'PY'
          import json
          from pathlib import Path
          line = Path('/tmp/adwf-gate.json').read_text(encoding='utf-8').strip().splitlines()[-1]
          result = json.loads(line)
          assert result['status'] == 'PASS', result
          assert result['sha'] == '4fc95c436b26130f16bc9e06a6e9da838bdb9d0e', result
          assert result['pr_number'] == 16, result
          assert result['governance']['required'] is True, result
          assert result['governance']['verified'] is True, result
          PY
      - name: Mirror verified trusted result as provider commit statuses
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os, sys
          from pathlib import Path
          sys.path.insert(0, str(Path('.adwf').resolve()))
          from lib.github_provider import GitHubClient

          repo = os.environ['GITHUB_REPOSITORY']
          sha = os.environ['ADWF_TARGET_SHA']
          client = GitHubClient(repo, os.environ['GITHUB_TOKEN'])
          pr = client.pull(int(os.environ['ADWF_PR_NUMBER']))
          assert (pr.get('head') or {}).get('sha') == sha, 'PR_HEAD_MOVED'
          payloads = [
              ('adwf/governance-gate', 'PASS: exact-HEAD human authorization verified.'),
              ('adwf/trusted-gate', 'PASS: provider-attested exact SHA and trusted evaluator boundary.'),
          ]
          for context, description in payloads:
              client.post(f'/repos/{repo}/statuses/{sha}', {
                  'state': 'success',
                  'context': context,
                  'description': description,
                  'target_url': f'https://github.com/{repo}/pull/{os.environ["ADWF_PR_NUMBER"]}',
              })
          print('GOV-003 STATUS BRIDGE: PASS')
          PY
