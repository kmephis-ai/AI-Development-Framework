name: CI Plane Materializer

on:
  pull_request:
    types: [opened]

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/CI-PLANE-001-github-hosted-only-a1' && github.event.pull_request.base.sha == 'd980558d8ad7c78e1551db5b7e5ca1ec3f692500'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12.10"
      - name: Materialize and certify final candidate tree
        env:
          BASE_SHA: d980558d8ad7c78e1551db5b7e5ca1ec3f692500
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          git rm .github/workflows/materialize-ci-plane.yml
          python .adwf/tests/test_execution_plane.py
          python .adwf/scripts/validate_execution_plane.py
          python .adwf/scripts/docs_freshness.py --root . --write
          python .adwf/scripts/docs_freshness.py --root .
          python .adwf/scripts/generate_manifest.py --root .
          python .adwf/scripts/generate_manifest.py --root . --check
          python .adwf/scripts/validate_ci.py
          python .adwf/scripts/validate_docs.py
          python .adwf/scripts/validate_pipeline_ir.py
          python .adwf/scripts/validate_framework.py
          python .adwf/adwf.py doctor --scope package_integrity
          python .adwf/adwf.py doctor --scope config_health
          python .adwf/adwf.py self-test
          git diff --check
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "CI-PLANE-001: materialize canonical projections"
          python - <<'PY'
          import subprocess
          expected={
            ".adwf/docs-registry.json",
            ".adwf/execution-plane.json",
            ".adwf/lib/execution_plane.py",
            ".adwf/schemas/execution-plane.schema.json",
            ".adwf/scripts/validate_execution_plane.py",
            ".adwf/tests/test_execution_plane.py",
            "MANIFEST.json",
            "SHA256SUMS.txt",
            "docs/governance/EXECUTION_PLANE.md",
          }
          changed=set(subprocess.check_output(["git","diff","--name-only","d980558d8ad7c78e1551db5b7e5ca1ec3f692500..HEAD"], text=True).splitlines())
          if changed != expected:
              raise SystemExit("FINAL_CHANGE_SURFACE_MISMATCH expected="+",".join(sorted(expected))+" actual="+",".join(sorted(changed)))
          print("FINAL_CHANGE_SURFACE=PASS")
          PY
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          git push origin HEAD:agent/CI-PLANE-001-github-hosted-only-a1
