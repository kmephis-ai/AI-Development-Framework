name: ROADMAP FLEET 2026 Postmerge Readback

on:
  push:
    branches:
      - helper/roadmap-fleet-2026-postmerge-readback-20260821-a1
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/roadmap-fleet-2026-postmerge-readback.yml

permissions:
  contents: read
  actions: read

jobs:
  readback:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify exact main, postmerge runs, and live rulesets
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_MAIN: 51e586d51ed176c8826ee0c9d3189f48e190a166
          EXPECTED_TREE: 2a4ae6b814d6184dab9461c3d1338e8ce8d921bd
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          expected = os.environ['EXPECTED_MAIN']
          expected_tree = os.environ['EXPECTED_TREE']
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'adwf-roadmap-fleet-postmerge-readback',
          }

          def get(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)

          branch = get(f'https://api.github.com/repos/{repo}/branches/main')
          main_sha = str((branch.get('commit') or {}).get('sha') or '')
          tree_sha = str((((branch.get('commit') or {}).get('commit') or {}).get('tree') or {}).get('sha') or '')
          print('MAIN_SHA=' + main_sha)
          print('MAIN_TREE=' + tree_sha)
          if main_sha != expected:
              raise SystemExit('MAIN_SHA_DRIFT')
          if tree_sha != expected_tree:
              raise SystemExit('MAIN_TREE_MISMATCH')

          payload = get(f'https://api.github.com/repos/{repo}/actions/runs?head_sha={expected}&event=push&per_page=100')
          runs = payload.get('workflow_runs') or []
          required = ['ADWF Main', 'ADWF Platform Smoke']
          for name in required:
              candidates = [r for r in runs if r.get('name') == name and r.get('head_sha') == expected and r.get('event') == 'push']
              if not candidates:
                  raise SystemExit('POSTMERGE_RUN_MISSING:' + name)
              candidates.sort(key=lambda r: (int(r.get('run_attempt') or 0), int(r.get('id') or 0)), reverse=True)
              run = candidates[0]
              print('RUN=' + json.dumps({
                  'name': name,
                  'id': run.get('id'),
                  'status': run.get('status'),
                  'conclusion': run.get('conclusion'),
                  'event': run.get('event'),
                  'head_sha': run.get('head_sha'),
                  'run_attempt': run.get('run_attempt'),
                  'html_url': run.get('html_url'),
              }, sort_keys=True, separators=(',', ':')))
              if run.get('status') != 'completed' or run.get('conclusion') != 'success':
                  raise SystemExit('POSTMERGE_RUN_NOT_SUCCESS:' + name)

          rulesets = get(f'https://api.github.com/repos/{repo}/rulesets')
          by_name = {item.get('name'): item for item in rulesets}
          required_rulesets = {'ADWF protected main', 'ADWF immutable runtime anchors'}
          missing = required_rulesets - set(by_name)
          if missing:
              raise SystemExit('RULESET_MISSING:' + ','.join(sorted(missing)))
          for name in sorted(required_rulesets):
              item = by_name[name]
              print('RULESET=' + json.dumps({
                  'id': item.get('id'),
                  'name': name,
                  'enforcement': item.get('enforcement'),
                  'bypass_actors': item.get('bypass_actors'),
                  'current_user_can_bypass': item.get('current_user_can_bypass'),
              }, sort_keys=True, separators=(',', ':')))
              if item.get('enforcement') != 'active':
                  raise SystemExit('RULESET_NOT_ACTIVE:' + name)
              if item.get('bypass_actors'):
                  raise SystemExit('RULESET_BYPASS_ACTORS:' + name)
              if item.get('current_user_can_bypass') not in (None, 'never'):
                  raise SystemExit('RULESET_USER_BYPASS:' + name)

          protected = get(f"https://api.github.com/repos/{repo}/rulesets/{by_name['ADWF protected main']['id']}")
          req = [r for r in (protected.get('rules') or []) if r.get('type') == 'required_status_checks']
          if len(req) != 1:
              raise SystemExit('REQUIRED_STATUS_RULE_COUNT')
          params = req[0].get('parameters') or {}
          if params.get('strict_required_status_checks_policy') is not True:
              raise SystemExit('STRICT_REQUIRED_CHECKS_DISABLED')
          normalized = sorted((c.get('context'), c.get('integration_id')) for c in (params.get('required_status_checks') or []))
          expected_checks = sorted([
              ('fast-feedback', 15368),
              ('adwf/governance-gate', 15368),
              ('adwf/trusted-gate', 15368),
          ])
          print('REQUIRED_CHECKS=' + json.dumps(normalized, separators=(',', ':')))
          if normalized != expected_checks:
              raise SystemExit('REQUIRED_CHECKS_DRIFT')

          print('POSTMERGE_READBACK=PASS')
          PY
