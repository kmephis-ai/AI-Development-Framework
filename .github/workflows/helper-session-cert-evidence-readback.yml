name: SESSION CERT Evidence Readback

on:
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: read
  issues: read

jobs:
  readback:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Read immutable session evidence
        shell: python
        run: |
          import base64, hashlib, json, os, urllib.parse, urllib.request

          token = os.environ["GH_TOKEN"]
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          def get(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.load(r)
          def api(repo, path):
              return get(f"https://api.github.com/repos/{repo}{path}")
          def digest_bytes(raw):
              return hashlib.sha256(raw).hexdigest()
          def digest_text(text):
              return digest_bytes(str(text).encode("utf-8"))
          def run_fact(repo, run_id):
              run = api(repo, f"/actions/runs/{run_id}")
              jobs = api(repo, f"/actions/runs/{run_id}/jobs?per_page=100").get("jobs", [])
              return {
                  "id": run.get("id"), "name": run.get("name"), "event": run.get("event"),
                  "head_branch": run.get("head_branch"), "head_sha": run.get("head_sha"),
                  "status": run.get("status"), "conclusion": run.get("conclusion"),
                  "jobs": [{"id": j.get("id"), "name": j.get("name"), "status": j.get("status"),
                            "conclusion": j.get("conclusion"), "runner_name": j.get("runner_name"),
                            "runner_group_name": j.get("runner_group_name")} for j in jobs],
              }
          def comment_fact(repo, comment_id):
              c = api(repo, f"/issues/comments/{comment_id}")
              return {"id": c.get("id"), "issue_url": c.get("issue_url"),
                      "body_sha256": digest_text(c.get("body", "")), "user": (c.get("user") or {}).get("login")}
          def issue_fact(repo, issue_no):
              i = api(repo, f"/issues/{issue_no}")
              return {"number": i.get("number"), "state": i.get("state"), "state_reason": i.get("state_reason"),
                      "title": i.get("title"), "comments": i.get("comments"), "body_sha256": digest_text(i.get("body", ""))}
          def tag_fact(repo, tag):
              ref = api(repo, "/git/ref/tags/" + urllib.parse.quote(tag, safe=""))
              obj = ref.get("object") or {}
              out = {"tag": tag, "ref_object_type": obj.get("type"), "ref_object_sha": obj.get("sha")}
              if obj.get("type") == "tag":
                  t = api(repo, f"/git/tags/{obj.get('sha')}")
                  out.update({"tag_object_sha": t.get("sha"), "target_type": (t.get("object") or {}).get("type"),
                              "target_sha": (t.get("object") or {}).get("sha"), "message_sha256": digest_text(t.get("message", ""))})
              return out
          def commit_fact(repo, sha):
              c = api(repo, f"/git/commits/{sha}")
              return {"sha": c.get("sha"), "tree": (c.get("tree") or {}).get("sha")}
          def content_fact(repo, sha, path):
              qpath = "/".join(urllib.parse.quote(part, safe="") for part in path.split("/"))
              p = api(repo, f"/contents/{qpath}?ref={sha}")
              raw = base64.b64decode("".join(str(p.get("content") or "").split()), validate=True)
              data = json.loads(raw.decode("utf-8"))
              return {"path": path, "blob_sha": p.get("sha"), "sha256": digest_bytes(raw), "json": data}

          adwf = "kmephis-ai/AI-Development-Framework"
          consumer = "kmephis-ai/PrihRashOnline-v2"
          self_a = run_fact(adwf, 32098974683)
          self_b = run_fact(adwf, 32099048963)
          con_a = run_fact(consumer, 32302616125)
          con_b = run_fact(consumer, 32302924442)
          evidence = {
              "self_host": {
                  "issue": issue_fact(adwf, 149),
                  "terminal_comment": comment_fact(adwf, 5323590838),
                  "ledger_issue": issue_fact(adwf, 3),
                  "ledger_comment": comment_fact(adwf, 5323578406),
                  "event_anchor": tag_fact(adwf, "adwf-runtime-anchor-000001-611cbcec83b883b7"),
                  "session_a_run": self_a,
                  "session_b_run": self_b,
                  "session_a_evidence": content_fact(adwf, self_a["head_sha"], "session-a-evidence.json"),
                  "session_b_evidence": content_fact(adwf, self_b["head_sha"], "session-b-evidence.json"),
                  "subject_commit": commit_fact(adwf, "017042c1f2bcde8d89d4b344201e848d873ec5a9"),
              },
              "connected_consumer": {
                  "issue": issue_fact(consumer, 332),
                  "terminal_comment": comment_fact(consumer, 5348107956),
                  "ledger_issue": issue_fact(consumer, 329),
                  "legacy_duplicate": issue_fact(consumer, 330),
                  "ledger_comment": comment_fact(consumer, 5337377059),
                  "root_anchor": tag_fact(consumer, "adwf-runtime-anchor-ledger-root-v1"),
                  "event_anchor": tag_fact(consumer, "adwf-runtime-anchor-000001-e545573a2c2640f1"),
                  "session_a_run": con_a,
                  "session_b_run": con_b,
                  "session_a_evidence": content_fact(consumer, con_a["head_sha"], "session-root-a-evidence.json"),
                  "session_b_evidence": content_fact(consumer, con_b["head_sha"], "session-root-b-evidence.json"),
                  "consumer_commit": commit_fact(consumer, "91d91252cd7d08e33a3c004290d486024424a69e"),
                  "installed_framework_commit": commit_fact(adwf, "1f38866eeb242f8d1e56c54632b059cf8adde77d"),
                  "upstream_defect": issue_fact(adwf, 157),
              },
          }
          print("SESSION_CERT_EVIDENCE=" + json.dumps(evidence, sort_keys=True, separators=(",", ":")))

          assert self_a["id"] != self_b["id"]
          assert self_a["status"] == self_b["status"] == "completed"
          assert self_a["conclusion"] == self_b["conclusion"] == "success"
          assert con_a["id"] != con_b["id"]
          assert con_a["status"] == con_b["status"] == "completed"
          assert con_a["conclusion"] == con_b["conclusion"] == "success"
          assert con_a["jobs"][0]["runner_name"] != con_b["jobs"][0]["runner_name"]
          assert evidence["connected_consumer"]["issue"]["state"] == "closed"
          assert evidence["connected_consumer"]["legacy_duplicate"]["state"] == "closed"
          assert evidence["connected_consumer"]["upstream_defect"]["state"] == "closed"
