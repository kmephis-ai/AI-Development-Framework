name: DELIVERY SHA Identity Materializer v2

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

env:
  BASE_SHA: 5cb1307587dd2b9f5f1cc3a3abf7a062c875dfec
  TARGET_BRANCH: agent/DELIVERY_SHA_IDENTITY-001-exact-merge-revision
  HELPER_BRANCH: helper/materialize-DELIVERY_SHA_IDENTITY-001-20260820-a1

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.BASE_SHA }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact provider CAS
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$BASE_SHA"
          test "$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')" = "$BASE_SHA"

      - name: Apply repair and canonical projections
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${HELPER_BRANCH}:refs/remotes/origin/${HELPER_BRANCH}"
          git show "refs/remotes/origin/${HELPER_BRANCH}:.github/delivery-sha-identity.patch.b64" | base64 -d > /tmp/delivery-sha.patch
          git apply --check /tmp/delivery-sha.patch
          git apply /tmp/delivery-sha.patch
          python .adwf/scripts/docs_freshness.py --write --reviewed-at 2026-08-13T00:00:00Z --valid-until 2026-11-13T00:00:00Z
          python .adwf/scripts/generate_manifest.py
          git diff --check
          ACTUAL="$(git diff --name-only | sort)"
          EXPECTED="$(printf '%s\n' '.adwf/docs-registry.json' '.adwf/lib/durable_orchestrator.py' '.adwf/tests/test_durable_orchestrator.py' 'MANIFEST.json' 'SHA256SUMS.txt' | sort)"
          test "$ACTUAL" = "$EXPECTED"

      - name: Verify focused and canonical contours
        shell: bash
        run: |
          set -euo pipefail
          python .adwf/tests/test_durable_orchestrator.py
          python .adwf/tests/test_v16_remediation.py
          python .adwf/scripts/validate_ci.py
          python .adwf/scripts/validate_framework.py
          python .adwf/scripts/validate_pipeline_ir.py
          python .adwf/scripts/validate_docs.py
          python .adwf/scripts/generate_manifest.py --check
          python .adwf/adwf.py doctor --scope package_integrity
          python .adwf/adwf.py doctor --scope config_health
          python .adwf/adwf.py self-test
          git diff --check

      - name: Publish one clean writer commit with final CAS
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$BASE_SHA"
          test "$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')" = "$BASE_SHA"
          git config user.name 'kmephis-ai'
          git config user.email 'kmephis@gmail.com'
          git add .adwf/docs-registry.json .adwf/lib/durable_orchestrator.py .adwf/tests/test_durable_orchestrator.py MANIFEST.json SHA256SUMS.txt
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = '5'
          git commit -m '[DELIVERY_SHA_IDENTITY-001] Preserve exact merged delivery revision'
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
          echo "CANDIDATE_SHA=$(git rev-parse HEAD)"
          echo "CANDIDATE_TREE=$(git rev-parse HEAD^{tree})"
