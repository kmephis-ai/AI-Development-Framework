name: SESSION CERT Focused Validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12.10'
          check-latest: false
      - name: Compile and focused tests
        run: |
          set -euo pipefail
          python -m py_compile .adwf/lib/capability_live_evidence.py .adwf/tests/test_capability_live_evidence.py
          python .adwf/tests/test_capability_live_evidence.py -v
