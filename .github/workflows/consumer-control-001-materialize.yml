name: CONSUMER_CONTROL-001 Materialize
on:
  push:
    branches: [agent/consumer-control-001-materializer-20260817]
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: agent/consumer-control-001-native-control-routing
          fetch-depth: 0
          persist-credentials: true
      - name: Apply verified non-workflow patch
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git merge-base HEAD f17a49a22b9608297e96977e0af7f4cb0c573fc7)" == "f17a49a22b9608297e96977e0af7f4cb0c573fc7" ]]
          rm -f .adwf/work-in-progress/CONSUMER_CONTROL-001.md docs/governance/CONSUMER_CONTROL_ROUTING.md
          cat > /tmp/patch.b64 <<'B64'

B64
          base64 -d /tmp/patch.b64 | gzip -d > /tmp/consumer-control.patch
          git apply /tmp/consumer-control.patch
          git config user.name 'adwf-candidate-publisher'
          git config user.email 'adwf-candidate-publisher@users.noreply.github.com'
          git add -A
          git commit -m 'CONSUMER_CONTROL-001: route trusted control by consumer mode'
          git push origin HEAD:agent/consumer-control-001-native-control-routing
