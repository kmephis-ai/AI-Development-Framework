name: ADWF Code Quality Postmerge Readback

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  actions: read
  contents: read

jobs:
  readback:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      TARGET_SHA: cd1b0ddc1173d2917e86888bcaec9537686b8ea1
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify exact merge-SHA postmerge workflows
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${TARGET_SHA}&per_page=100"
          response="$(curl --fail --silent --show-error \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "${api}")"
          printf '%s\n' "${response}" | jq -r '.workflow_runs[] | [.id,.name,.event,.status,.conclusion,.head_sha] | @tsv'
          for name in 'ADWF Main' 'ADWF Platform Smoke'; do
            count="$(printf '%s\n' "${response}" | jq --arg n "${name}" --arg sha "${TARGET_SHA}" '[.workflow_runs[] | select(.name==$n and .head_sha==$sha and .status=="completed" and .conclusion=="success")] | length')"
            if [[ "${count}" -lt 1 ]]; then
              echo "MISSING_SUCCESS:${name}:${TARGET_SHA}" >&2
              exit 1
            fi
          done
          echo "POSTMERGE_EXACT_SHA_EVIDENCE:PASS:${TARGET_SHA}"
