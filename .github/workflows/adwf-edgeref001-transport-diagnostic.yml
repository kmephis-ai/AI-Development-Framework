name: ADWF EDGEREF-001 Transport Diagnostic

on:
  push:
    branches:
      - agent/materialize-edgeref001-81da2e96

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: agent/materialize-edgeref001-81da2e96
          persist-credentials: false
      - name: Exact chunk identities
        shell: bash
        run: |
          set -euo pipefail
          wc -c .transport/edgeref001/chunk.000 .transport/edgeref001/chunk.001
          sha256sum .transport/edgeref001/chunk.000 .transport/edgeref001/chunk.001
          cat .transport/edgeref001/chunk.000 .transport/edgeref001/chunk.001 > /tmp/combined
          wc -c /tmp/combined
          sha256sum /tmp/combined
