name: ADWF CODE_QUALITY Disposable Projection Runner

on:
  push:
    branches:
      - agent/local-mirror-CODE_QUALITY-001-20260820-fallback

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ !contains(github.event.head_commit.message, '[materialized-output]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Generate and validate candidate in disposable worktree
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin agent/CODE_QUALITY-001-roadmap:refs/remotes/origin/agent/CODE_QUALITY-001-roadmap
          rm -rf /tmp/code-quality-work
          git worktree add /tmp/code-quality-work refs/remotes/origin/agent/CODE_QUALITY-001-roadmap
          cd /tmp/code-quality-work
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('.adwf/roadmap.json').read_text(encoding='utf-8'))
          matches=[t for g in data['goals'] for t in g['tasks'] if t.get('roadmap_id')=='CODE_QUALITY-001']
          expected={
            'roadmap_id':'CODE_QUALITY-001',
            'title_ru':'Evidence-backed Critical Code Quality & Mutation-Sensitive Verification',
            'dependencies':['ARCH_FITNESS-001','EVAL-001'],
            'product_impact':False,
          }
          if len(matches)!=1 or matches[0]!=expected:
              raise SystemExit('CODE_QUALITY_ROADMAP_CONTRACT_MISMATCH')
          PY
          rm -f .github/workflows/adwf-code-quality-roadmap-materialize.yml
          python .adwf/scripts/docs_freshness.py --write --reviewed-at 2026-08-13T00:00:00Z --valid-until 2026-11-13T00:00:00Z
          python .adwf/scripts/generate_manifest.py

          set +e
          python .adwf/scripts/validate_ci.py; V_CI=$?
          python .adwf/scripts/validate_framework.py; V_FRAMEWORK=$?
          python .adwf/scripts/validate_pipeline_ir.py; V_PIPELINE=$?
          python .adwf/scripts/validate_docs.py; V_DOCS=$?
          python .adwf/scripts/generate_manifest.py --check; V_MANIFEST=$?
          python .adwf/adwf.py doctor --scope package_integrity; V_PACKAGE=$?
          python .adwf/adwf.py doctor --scope config_health; V_CONFIG=$?
          python .adwf/adwf.py self-test; V_SELFTEST=$?
          set -e

          rm -rf /tmp/code-quality-output
          mkdir -p /tmp/code-quality-output
          cp .adwf/roadmap.json /tmp/code-quality-output/roadmap.json
          cp .adwf/docs-registry.json /tmp/code-quality-output/docs-registry.json
          cp MANIFEST.json /tmp/code-quality-output/MANIFEST.json
          cp SHA256SUMS.txt /tmp/code-quality-output/SHA256SUMS.txt
          python - <<PY
          import json
          from pathlib import Path
          values={
            'validate_ci': int('${V_CI}'),
            'validate_framework': int('${V_FRAMEWORK}'),
            'validate_pipeline_ir': int('${V_PIPELINE}'),
            'validate_docs': int('${V_DOCS}'),
            'manifest_check': int('${V_MANIFEST}'),
            'package_integrity': int('${V_PACKAGE}'),
            'config_health': int('${V_CONFIG}'),
            'self_test': int('${V_SELFTEST}'),
          }
          Path('/tmp/code-quality-output/status.json').write_text(json.dumps({'status':'PASS' if all(v==0 for v in values.values()) else 'FAIL','checks':values},indent=2)+'\n',encoding='utf-8')
          PY
          sha256sum /tmp/code-quality-output/roadmap.json /tmp/code-quality-output/docs-registry.json /tmp/code-quality-output/MANIFEST.json /tmp/code-quality-output/SHA256SUMS.txt > /tmp/code-quality-output/output-sha256.txt

      - name: Publish disposable evidence/output
        shell: bash
        run: |
          set -euo pipefail
          rm -rf materialized
          mkdir materialized
          cp /tmp/code-quality-output/* materialized/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add materialized
          git commit -m "chore: publish CODE_QUALITY projection result [materialized-output]"
          git push origin HEAD:${GITHUB_REF_NAME}
