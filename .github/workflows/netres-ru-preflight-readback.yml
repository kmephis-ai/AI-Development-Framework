name: NETRES RU Preflight Readback

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  actions: read

jobs:
  readback:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read exact main and repository rulesets
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_MAIN: ccc96ebc7628bd82cec2a19a555b0bf9e48f9992
        shell: python
        run: |
          import json, os, urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def get(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)

          main = get(f"https://api.github.com/repos/{repo}/branches/main")
          main_sha = str((main.get("commit") or {}).get("sha") or "")
          print("MAIN_SHA=" + main_sha)
          if main_sha != os.environ["EXPECTED_MAIN"]:
              raise SystemExit("MAIN_SHA_DRIFT")

          rulesets = get(f"https://api.github.com/repos/{repo}/rulesets?includes_parents=true")
          details = []
          for item in rulesets:
              rid = item.get("id")
              detail = get(f"https://api.github.com/repos/{repo}/rulesets/{rid}")
              details.append({
                  "id": detail.get("id"),
                  "name": detail.get("name"),
                  "target": detail.get("target"),
                  "enforcement": detail.get("enforcement"),
                  "bypass_actors": detail.get("bypass_actors"),
                  "conditions": detail.get("conditions"),
                  "rules": detail.get("rules"),
                  "current_user_can_bypass": detail.get("current_user_can_bypass"),
              })
          details.sort(key=lambda x: x["id"] or 0)
          print("RULESETS=" + json.dumps(details, sort_keys=True, separators=(",", ":")))

          protected = [x for x in details if x.get("enforcement") == "active"]
          if not protected:
              raise SystemExit("NO_ACTIVE_RULESETS")

          main_rules = [x for x in protected if x.get("name") == "ADWF protected main"]
          if len(main_rules) != 1:
              raise SystemExit("PROTECTED_MAIN_RULESET_NOT_UNIQUE")
          rule = main_rules[0]
          if rule.get("bypass_actors"):
              raise SystemExit("PROTECTED_MAIN_BYPASS_NOT_EMPTY")
          required = set()
          for entry in rule.get("rules") or []:
              if entry.get("type") != "required_status_checks":
                  continue
              for check in (entry.get("parameters") or {}).get("required_status_checks") or []:
                  required.add(check.get("context"))
          expected = {"fast-feedback", "adwf/governance-gate", "adwf/trusted-gate"}
          if required != expected:
              raise SystemExit("REQUIRED_CHECKS_DRIFT:" + repr(sorted(required)))

          print("RULESET_PREFLIGHT=PASS")
