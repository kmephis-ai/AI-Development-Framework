name: ADWF AIWORK-001 Materializer

on:
  push:
    branches:
      - agent/local-mirror-aiwork001-20260815-a1

permissions:
  contents: write

env:
  BASE_SHA: fdbe95f7722bd0c11a7c1c6b1bd3d8ac7c7226aa
  TARGET_BRANCH: agent/aiwork-001-work-contracts
  EXPECTED_B64_SHA256: d618a7af7902c4dbee85f081d02a3bc316e12fc5024800e0eb2724513760f7b4
  EXPECTED_PATCH_SHA256: d9a5eabbd36c0428ccc44a1e3ea8a91806d5d86818e40b59662ca6e816b5041a
  EXPECTED_TREE: 44672b5129a5550c8745a89498d2d5780991fc49

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout transport branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Recover and verify staged payload
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum .adwf-transport/aiwork001.part1a | awk '{print $1}')" = "8e25bc69cdcb6be391d5ee515657a9840875616b46f225a3acfed262ccf076e6"
          test "$(sha256sum .adwf-transport/aiwork001.part1b | awk '{print $1}')" = "9315721b4fb629c89df08a8a8eda6c4d222688d89eb0ef3cb82188562b9e4dd9"
          test "$(sha256sum .adwf-transport/aiwork001.part1c | awk '{print $1}')" = "54a58489281df47ae0f001ba4ae1bb0d7a00eb8f0fc5f7eab046cf179eea7e94"
          test "$(sha256sum .adwf-transport/aiwork001.part2 | awk '{print $1}')" = "06cf831d7ba1c9e559ff32167e83e617f0c95254ba7f2284ecd7d91612388ff5"
          test "$(sha256sum .adwf-transport/aiwork001.part3 | awk '{print $1}')" = "c5c8e0078ec34a9f3c826b5a2cef9bfa24c6ac0028c7b66b99efda02f6240020"
          test "$(sha256sum .adwf-transport/aiwork001.part4 | awk '{print $1}')" = "e68f6a2ed3ef9eb38af5218a7e6fa9da673e2e94f2778b2b253913bf05a3c3cf"
          cat .adwf-transport/aiwork001.part1a .adwf-transport/aiwork001.part1b .adwf-transport/aiwork001.part1c .adwf-transport/aiwork001.part2 .adwf-transport/aiwork001.part3 .adwf-transport/aiwork001.part4 | tr -d '\r\n' > /tmp/aiwork001.clean.b64
          test "$(sha256sum /tmp/aiwork001.clean.b64 | awk '{print $1}')" = "${EXPECTED_B64_SHA256}"
          base64 -d /tmp/aiwork001.clean.b64 | gunzip > /tmp/aiwork001.patch
          test "$(sha256sum /tmp/aiwork001.patch | awk '{print $1}')" = "${EXPECTED_PATCH_SHA256}"

      - name: Checkout exact target branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          path: target

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'

      - name: Apply exact payload
        shell: bash
        working-directory: target
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${BASE_SHA}"
          git apply --check /tmp/aiwork001.patch
          git apply /tmp/aiwork001.patch
          git diff --check

      - name: Verify AIWORK-001 implementation
        shell: bash
        working-directory: target
        run: |
          set -euo pipefail
          python .adwf/tests/test_ai_work_contracts.py
          python .adwf/tests/test_v15_executive.py
          python .adwf/tests/test_v16_remediation.py
          python .adwf/tests/test_durable_orchestrator.py
          python .adwf/tests/test_reconciliation.py
          python .adwf/tests/test_adversarial.py
          python .adwf/scripts/docs_freshness.py
          python .adwf/scripts/generate_skill_registry.py --check
          python .adwf/scripts/generate_manifest.py --check
          python .adwf/scripts/validate_framework.py
          python .adwf/scripts/validate_docs.py
          python .adwf/scripts/validate_ci.py
          python .adwf/scripts/validate_capabilities.py
          python .adwf/scripts/validate_skills.py
          python .adwf/adwf.py self-test

      - name: Verify exact tree, commit, and push target branch
        shell: bash
        working-directory: target
        run: |
          set -euo pipefail
          git add -A
          ACTUAL_TREE="$(git write-tree)"
          echo "actual_tree=${ACTUAL_TREE}"
          test "${ACTUAL_TREE}" = "${EXPECTED_TREE}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "AIWORK-001: add first-class AI work contracts"
          git push origin "HEAD:${TARGET_BRANCH}"
