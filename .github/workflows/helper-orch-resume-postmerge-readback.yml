name: ADWF ORCH_RESUME-001 Postmerge Readback

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  actions: read

jobs:
  readback:
    runs-on: ubuntu-24.04
    steps:
      - name: Verify exact merge SHA postmerge evidence
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TARGET_SHA: 5348021bc540ab33f4c42dc58d3ad629ea5abf1c
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, time, urllib.parse, urllib.request

          repo = os.environ['REPOSITORY']
          target = os.environ['TARGET_SHA']
          headers = {
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          }

          def get(path):
              req = urllib.request.Request('https://api.github.com' + path, headers=headers)
              with urllib.request.urlopen(req, timeout=20) as response:
                  return json.load(response)

          main = get(f'/repos/{repo}/commits/main')
          if main.get('sha') != target:
              raise SystemExit(f'MAIN_SHA_MISMATCH:{main.get("sha")}:{target}')

          commit = get(f'/repos/{repo}/commits/{target}')
          verification = ((commit.get('commit') or {}).get('verification') or {})
          if verification.get('verified') is not True:
              raise SystemExit('MERGE_COMMIT_NOT_VERIFIED:' + json.dumps(verification, sort_keys=True))
          tree_sha = (((commit.get('commit') or {}).get('tree') or {}).get('sha'))
          if not tree_sha:
              raise SystemExit('MERGE_TREE_MISSING')

          required = {'ADWF Main', 'ADWF Platform Smoke'}
          latest = {}
          for attempt in range(24):
              query = urllib.parse.urlencode({'head_sha': target, 'per_page': 100})
              payload = get(f'/repos/{repo}/actions/runs?{query}')
              rows = [r for r in payload.get('workflow_runs', []) if r.get('event') == 'push' and r.get('name') in required]
              latest = {}
              for row in rows:
                  name = row.get('name')
                  if name not in latest or row.get('run_number', 0) > latest[name].get('run_number', 0):
                      latest[name] = row
              if required.issubset(latest) and all(latest[n].get('status') == 'completed' for n in required):
                  break
              if attempt == 23:
                  raise SystemExit('POSTMERGE_RUNS_NOT_COMPLETED:' + json.dumps({n: {k: v for k, v in (latest.get(n) or {}).items() if k in {'id','status','conclusion','head_sha','event','run_number'}} for n in sorted(required)}, sort_keys=True))
              time.sleep(5)

          summary = {}
          for name in sorted(required):
              row = latest[name]
              summary[name] = {
                  'id': row.get('id'),
                  'run_number': row.get('run_number'),
                  'event': row.get('event'),
                  'head_sha': row.get('head_sha'),
                  'status': row.get('status'),
                  'conclusion': row.get('conclusion'),
              }
              if row.get('head_sha') != target or row.get('conclusion') != 'success':
                  raise SystemExit('POSTMERGE_RUN_FAILED:' + name + ':' + json.dumps(summary[name], sort_keys=True))

          print('CANONICAL_MAIN=' + target)
          print('MERGE_TREE=' + tree_sha)
          print('MERGE_VERIFIED=true')
          print('POSTMERGE_RUNS=' + json.dumps(summary, sort_keys=True))
          print('POSTMERGE_READBACK=PASS')
          PY
