name: ROADMAP REALIGN Provider Readback

on:
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: read

jobs:
  readback:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      TARGET_SHA: 94d9d5fff5b749f2a8d1d8d6ed611193435c2601
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Read exact helper workflow runs and repository rulesets
        shell: python
        run: |
          import json, os, urllib.request
          repo = os.environ['GITHUB_REPOSITORY']
          sha = os.environ['TARGET_SHA']
          headers = {
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          }
          def get(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)

          payload = get(f'https://api.github.com/repos/{repo}/actions/runs?head_sha={sha}&per_page=100')
          rows = [{k: run.get(k) for k in ('id','name','event','head_sha','status','conclusion','run_attempt','created_at','updated_at')} for run in payload.get('workflow_runs', []) if run.get('head_sha') == sha]
          rows.sort(key=lambda r: r['id'])
          print('HELPER_RUN_READBACK=' + json.dumps(rows, sort_keys=True, separators=(',', ':')))
          if not rows:
              raise SystemExit('NO_RUNS_FOR_EXACT_HELPER_SHA')

          rulesets = get(f'https://api.github.com/repos/{repo}/rulesets?per_page=100')
          details = []
          for row in rulesets:
              rid = row.get('id')
              if not isinstance(rid, int):
                  raise SystemExit('RULESET_ID_INVALID')
              item = get(f'https://api.github.com/repos/{repo}/rulesets/{rid}')
              details.append({
                  'id': item.get('id'),
                  'name': item.get('name'),
                  'target': item.get('target'),
                  'enforcement': item.get('enforcement'),
                  'bypass_actors': item.get('bypass_actors'),
                  'conditions': item.get('conditions'),
                  'rules': item.get('rules'),
              })
          details.sort(key=lambda x: x['id'])
          print('RULESET_READBACK=' + json.dumps(details, sort_keys=True, separators=(',', ':')))
          if not details:
              raise SystemExit('RULESETS_NOT_VERIFIED')
