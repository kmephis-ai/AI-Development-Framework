name: ADWF Control

on:
  workflow_run:
    workflows: ["ADWF PR"]
    types: [completed]
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  workflow_dispatch:
    inputs:
      run_id:
        required: false
        type: string
      reason:
        required: false
        type: string
      request_id:
        required: false
        type: string
permissions:
  contents: read
env:
  PYTHONDONTWRITEBYTECODE: "1"
concurrency:
  group: adwf-control-${{ github.repository }}
  cancel-in-progress: false
jobs:
  control-route:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.control-mode.outputs.mode }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12.10"
      - name: Resolve trusted control mode
        id: control-mode
        run: python .adwf/scripts/consumer_ci.py classify-current --repository "${{ github.repository }}" --github-output "$GITHUB_OUTPUT"
  trusted-controller:
    needs: control-route
    if: needs.control-route.outputs.mode == 'SELF_HOST_CANONICAL'
    permissions:
      contents: write
      actions: read
      checks: write
      statuses: write
      issues: write
      pull-requests: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12.10"
      - name: Trusted controller integrity
        run: |
          python .adwf/adwf.py provider-check --input .adwf/requests/github-public-standard.json
          python .adwf/scripts/validate_pipeline_ir.py
          python .adwf/adwf.py doctor --scope package_integrity
          python .adwf/adwf.py doctor --scope trust_boot_integrity
      - name: Restore public-safe durable checkpoint
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python .adwf/scripts/github_runtime_sync.py --restore
      - name: Publish trusted exact-HEAD and governance gates
        if: github.event_name == 'workflow_run' || github.event_name == 'pull_request_review'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python .adwf/scripts/publish_trusted_gate.py --event "$GITHUB_EVENT_PATH"
      - name: Compile provider facts/evidence/AssuranceSnapshot
        if: github.event_name == 'workflow_run'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ADWF_SUBJECT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: python .adwf/scripts/github_reconcile.py --apply --subject-sha "$ADWF_SUBJECT_SHA"
      - name: Read back exact-revision preview attestation from provider evidence
        if: github.event_name == 'workflow_run'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python .adwf/scripts/collect_preview_attestation.py --event "$GITHUB_EVENT_PATH"
      - name: Complete staged GitHub bootstrap after trusted seed checks
        if: github.event_name == 'workflow_run'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python .adwf/scripts/github_bootstrap.py --apply
      - name: Convert failed CI provider event into durable result
        if: github.event_name == 'workflow_run'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python .adwf/scripts/runtime_event_adapter.py --event "$GITHUB_EVENT_PATH"
      - name: Consume bounded Agent Inbox result
        if: github.event_name == 'issue_comment'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python .adwf/scripts/consume_agent_result.py
      - name: Execute safe Runtime Supervisor phases
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python .adwf/scripts/run_active_supervisor.py
      - name: Publish bounded Creative Agent handoff
        if: always()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python .adwf/scripts/publish_agent_request.py
      - name: Persist public-safe checkpoint
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python .adwf/scripts/github_runtime_sync.py --persist
      - name: Collect trusted CI performance evidence
        if: always()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python .adwf/scripts/github_metrics_collector.py --apply
      - name: Refresh owner projection
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python .adwf/scripts/sync_dashboard_issue.py --apply
  consumer-observer:
    needs: control-route
    if: needs.control-route.outputs.mode == 'CONSUMER_NATIVE'
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12.10"
      - name: Revalidate installed consumer control boundary
        run: python .adwf/scripts/consumer_ci.py classify-current --repository "${{ github.repository }}"
