name: ADWF EDGEREF-001 Tail Diagnostic

on:
  push:
    branches:
      - agent/materialize-edgeref001-81da2e96

permissions:
  contents: read

jobs:
  tail:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: agent/materialize-edgeref001-81da2e96
          persist-credentials: false
      - shell: bash
        run: |
          printf 'CHUNK000_LAST120='
          tail -c 120 .transport/edgeref001/chunk.000
          printf '\nCHUNK001_FIRST40='
          head -c 40 .transport/edgeref001/chunk.001
          printf '\n'
