name: ADWF ORCH_LEASE-001 Premerge Ruleset Readback

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  EXPECTED_MAIN: 51e586d51ed176c8826ee0c9d3189f48e190a166
  EXPECTED_HEAD: 34405b5ac6728ab9593d0891166a90c4cac653cd

jobs:
  readback:
    if: github.event.pull_request.head.ref == 'helper/ORCH_LEASE-001-premerge-ruleset-20260821-b1'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read and verify live rulesets
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request

          repo = os.environ['REPOSITORY']
          token = os.environ['GH_TOKEN']
          expected_main = os.environ['EXPECTED_MAIN']
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          }

          def get(path):
              req = urllib.request.Request('https://api.github.com' + path, headers=headers)
              with urllib.request.urlopen(req, timeout=20) as response:
                  return json.load(response)

          branch = get(f'/repos/{repo}/branches/main')
          observed_main = ((branch.get('commit') or {}).get('sha') or '')
          if observed_main != expected_main:
              raise SystemExit(f'MAIN_DRIFT:{observed_main}')

          rows = get(f'/repos/{repo}/rulesets?includes_parents=true&per_page=100')
          print('RULESET_LIST=' + json.dumps([
              {'id': r.get('id'), 'name': r.get('name'), 'target': r.get('target'), 'enforcement': r.get('enforcement')}
              for r in rows
          ], sort_keys=True))

          by_name = {r.get('name'): r for r in rows}
          protected_stub = by_name.get('ADWF protected main')
          anchor_stub = by_name.get('ADWF immutable runtime anchors')
          if protected_stub is None:
              raise SystemExit('PROTECTED_MAIN_RULESET_MISSING')
          if anchor_stub is None:
              raise SystemExit('RUNTIME_ANCHOR_RULESET_MISSING')

          protected = get(f"/repos/{repo}/rulesets/{protected_stub['id']}")
          anchors = get(f"/repos/{repo}/rulesets/{anchor_stub['id']}")

          for label, rule in [('protected', protected), ('anchors', anchors)]:
              if rule.get('enforcement') != 'active':
                  raise SystemExit(f'{label.upper()}_RULESET_NOT_ACTIVE')
              if rule.get('bypass_actors') not in ([], None):
                  raise SystemExit(f'{label.upper()}_RULESET_HAS_BYPASS')

          if protected.get('target') != 'branch':
              raise SystemExit('PROTECTED_MAIN_TARGET_INVALID')
          status_rules = [r for r in protected.get('rules', []) if r.get('type') == 'required_status_checks']
          if len(status_rules) != 1:
              raise SystemExit('REQUIRED_STATUS_RULE_AMBIGUOUS')
          params = status_rules[0].get('parameters') or {}
          if params.get('strict_required_status_checks_policy') is not True:
              raise SystemExit('REQUIRED_STATUS_STRICT_FALSE')
          checks = params.get('required_status_checks') or []
          actual = {c.get('context'): c.get('integration_id') for c in checks}
          expected = {
              'fast-feedback': 15368,
              'adwf/governance-gate': 15368,
              'adwf/trusted-gate': 15368,
          }
          if actual != expected:
              raise SystemExit('REQUIRED_STATUS_CHECKS_MISMATCH:' + json.dumps(actual, sort_keys=True))

          if anchors.get('target') != 'tag':
              raise SystemExit('RUNTIME_ANCHOR_TARGET_INVALID')

          print('PROTECTED_MAIN=' + json.dumps(protected, sort_keys=True))
          print('RUNTIME_ANCHORS=' + json.dumps(anchors, sort_keys=True))
          print('RULESET_READBACK=PASS')
          print('OBSERVED_MAIN=' + observed_main)
          print('EXPECTED_CANDIDATE=' + os.environ['EXPECTED_HEAD'])
          PY
