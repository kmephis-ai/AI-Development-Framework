name: ADWF ORCH_RESUME-001 Materializer

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

env:
  SOURCE_MAIN: fba872d828bc3a6fe5cc404db596393577cd2672
  TARGET_OLD_HEAD: fba872d828bc3a6fe5cc404db596393577cd2672
  TARGET_BRANCH: agent/ORCH_RESUME-001-acquire-resume-yield

jobs:
  verify-publish:
    if: github.event.pull_request.head.ref == 'helper/ORCH_RESUME-001-materializer-20260821-a1'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact BASE
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_MAIN }}
          fetch-depth: 0

      - name: Exact provider CAS before implementation
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main "$TARGET_BRANCH"
          test "$(git rev-parse refs/remotes/origin/main)" = "$SOURCE_MAIN"
          test "$(git rev-parse refs/remotes/origin/$TARGET_BRANCH)" = "$TARGET_OLD_HEAD"
          test "$(git rev-parse HEAD)" = "$SOURCE_MAIN"

      - name: Materialize bounded resume coordinator
        shell: bash
        run: |
          set -euo pipefail
          cat > .adwf/lib/orch_resume.py <<'PYFILE'
          """Pure executor-neutral acquire/resume/yield decision coordination.

          ORCH_RESUME-001 composes fresh provider facts with existing durable
          execution, session-continuity, and provider-lease projections.  It never
          mutates provider state and never grants write authority by itself.
          """
          from __future__ import annotations

          from datetime import datetime, timezone
          from typing import Any
          import re

          from .autonomous_execution_state import reconcile_provider_observation, validate_state
          from .lease_registry import _registry_lease_freshness_errors, validate_lease_registry
          from .leases import utc_now
          from .session_continuity import reconcile_checkpoint, validate_checkpoint

          DECISIONS = {"RESUME_EXISTING", "RECONCILE", "ACQUIRE_NEW", "YIELD", "BLOCK"}
          _SHA_RE = re.compile(r"^[0-9a-f]{40}$")
          _ROADMAP_RE = re.compile(r"^[A-Z][A-Z0-9_]*-[0-9]+$")
          _ISSUE_RE = re.compile(r"^[0-9]+$")
          _REPOSITORY_RE = re.compile(r"^[^/\s]+/[^/\s]+$")
          _PENDING_EXTERNAL = {"queued", "in_progress", "pending", "waiting", "requested"}
          _BLOCKING_BOUNDARIES = {"UNAVAILABLE_CAPABILITY", "AUTHORITY_EXHAUSTED", "ROADMAP_END"}


          def _result(decision: str, reason: str, *, lease_id: str | None = None, findings: list[str] | None = None) -> dict[str, Any]:
              if decision not in DECISIONS:
                  raise ValueError("ORCH_RESUME_DECISION_INVALID")
              value: dict[str, Any] = {
                  "decision": decision,
                  "reason": reason,
                  "lease_id": lease_id,
                  # Authority remains in the provider-backed lease/store path.
                  "provider_write_authorized": False,
              }
              if findings:
                  value["findings"] = sorted(set(str(item) for item in findings))
              return value


          def _valid_provider_facts(
              *, repository: Any, main_sha: Any, head_sha: Any, pr_number: Any,
              branch: Any, roadmap_id: Any, issue_id: Any, expected_base_sha: Any,
              current_worker_id: Any, policy_max_parallel_writers: Any,
              work_terminal: Any, next_work_authorized: Any, human_boundary_active: Any,
          ) -> list[str]:
              findings: list[str] = []
              if not isinstance(repository, str) or _REPOSITORY_RE.fullmatch(repository) is None:
                  findings.append("PROVIDER_REPOSITORY_INVALID")
              if not isinstance(main_sha, str) or _SHA_RE.fullmatch(main_sha) is None:
                  findings.append("PROVIDER_MAIN_SHA_INVALID")
              if head_sha is not None and (not isinstance(head_sha, str) or _SHA_RE.fullmatch(head_sha) is None):
                  findings.append("PROVIDER_HEAD_SHA_INVALID")
              if pr_number is not None and (isinstance(pr_number, bool) or not isinstance(pr_number, int) or pr_number < 1):
                  findings.append("PROVIDER_PR_NUMBER_INVALID")
              if not isinstance(branch, str) or not branch.strip():
                  findings.append("PROVIDER_BRANCH_INVALID")
              if not isinstance(roadmap_id, str) or _ROADMAP_RE.fullmatch(roadmap_id) is None:
                  findings.append("PROVIDER_ROADMAP_ID_INVALID")
              if not isinstance(issue_id, str) or _ISSUE_RE.fullmatch(issue_id) is None:
                  findings.append("PROVIDER_ISSUE_ID_INVALID")
              if not isinstance(expected_base_sha, str) or _SHA_RE.fullmatch(expected_base_sha) is None:
                  findings.append("PROVIDER_BASE_SHA_INVALID")
              if not isinstance(current_worker_id, str) or not current_worker_id.strip():
                  findings.append("PROVIDER_WORKER_ID_INVALID")
              if isinstance(policy_max_parallel_writers, bool) or not isinstance(policy_max_parallel_writers, int):
                  findings.append("POLICY_WRITER_CEILING_INVALID")
              if not isinstance(work_terminal, bool):
                  findings.append("PROVIDER_WORK_TERMINAL_INVALID")
              if not isinstance(next_work_authorized, bool):
                  findings.append("NEXT_WORK_AUTHORIZATION_INVALID")
              if not isinstance(human_boundary_active, bool):
                  findings.append("HUMAN_BOUNDARY_FACT_INVALID")
              return findings


          def decide_resume(
              *,
              repository: str,
              main_sha: str,
              head_sha: str | None,
              pr_number: int | None,
              branch: str,
              roadmap_id: str,
              issue_id: str,
              expected_base_sha: str,
              current_worker_id: str,
              policy_max_parallel_writers: int,
              lease_registry: dict[str, Any],
              execution_state: dict[str, Any] | None = None,
              checkpoint: dict[str, Any] | None = None,
              work_terminal: bool = False,
              next_work_authorized: bool = False,
              external_status: str | None = None,
              human_boundary_active: bool = False,
              session_accelerator_present: bool = False,
              now: datetime | None = None,
          ) -> dict[str, Any]:
              """Return a side-effect-free resume decision.

              `session_accelerator_present` is accepted only to make its non-authority
              explicit.  It intentionally has no effect on the decision.
              """
              del session_accelerator_present
              findings = _valid_provider_facts(
                  repository=repository, main_sha=main_sha, head_sha=head_sha,
                  pr_number=pr_number, branch=branch, roadmap_id=roadmap_id,
                  issue_id=issue_id, expected_base_sha=expected_base_sha,
                  current_worker_id=current_worker_id,
                  policy_max_parallel_writers=policy_max_parallel_writers,
                  work_terminal=work_terminal, next_work_authorized=next_work_authorized,
                  human_boundary_active=human_boundary_active,
              )
              if findings:
                  return _result("BLOCK", "PROVIDER_FACTS_INVALID", findings=findings)
              if policy_max_parallel_writers != 1:
                  return _result("BLOCK", "STAGE1_REQUIRES_SINGLETON_WRITER_CEILING")

              registry_findings = validate_lease_registry(lease_registry)
              if registry_findings:
                  return _result("BLOCK", "LEASE_REGISTRY_INVALID", findings=registry_findings)
              if lease_registry["repository"] != repository:
                  return _result("BLOCK", "LEASE_REGISTRY_REPOSITORY_MISMATCH")
              if lease_registry["max_parallel_writers"] != policy_max_parallel_writers:
                  return _result("BLOCK", "LEASE_REGISTRY_POLICY_CEILING_MISMATCH")

              if execution_state is not None:
                  state_findings = validate_state(execution_state)
                  if state_findings:
                      return _result("BLOCK", "EXECUTION_STATE_INVALID", findings=state_findings)
              if checkpoint is not None:
                  checkpoint_findings = validate_checkpoint(checkpoint)
                  if checkpoint_findings:
                      return _result("BLOCK", "SESSION_CHECKPOINT_INVALID", findings=checkpoint_findings)

              active = [item for item in lease_registry["leases"] if item["status"] == "ACTIVE"]
              if len(active) > 1:
                  return _result("BLOCK", "MULTIPLE_ACTIVE_LEASES_UNSUPPORTED_STAGE1")

              if work_terminal:
                  return _result("RECONCILE", "WORK_TERMINAL_RECONCILE_NEXT")

              if not active:
                  if execution_state is not None or checkpoint is not None:
                      return _result("RECONCILE", "RESUME_CONTEXT_WITHOUT_ACTIVE_LEASE")
                  if not next_work_authorized:
                      return _result("BLOCK", "NEXT_WORK_NOT_AUTHORIZED")
                  return _result("ACQUIRE_NEW", "NO_ACTIVE_LEASE_AND_NEXT_WORK_AUTHORIZED")

              lease = active[0]
              lease_id = lease["lease_id"]
              current_time = (now or utc_now()).astimezone(timezone.utc)
              if lease_registry["observed_main_sha"] != main_sha:
                  return _result("RECONCILE", "ACTIVE_LEASE_REGISTRY_MAIN_STALE", lease_id=lease_id)
              freshness = _registry_lease_freshness_errors(lease, current_time)
              if freshness:
                  return _result("RECONCILE", "ACTIVE_LEASE_STALE_OR_EXPIRED", lease_id=lease_id, findings=freshness)

              identity_mismatch = []
              if lease["roadmap_id"] != roadmap_id:
                  identity_mismatch.append("ROADMAP_ID")
              if lease["issue_id"] != issue_id:
                  identity_mismatch.append("ISSUE_ID")
              if lease["branch"] != branch:
                  identity_mismatch.append("BRANCH")
              if lease["base_sha"] != expected_base_sha:
                  identity_mismatch.append("BASE_SHA")
              if identity_mismatch:
                  return _result("BLOCK", "LEASE_WORK_IDENTITY_MISMATCH", lease_id=lease_id, findings=identity_mismatch)
              if lease["worker_id"] != current_worker_id:
                  return _result("RECONCILE", "LEASE_OWNER_HANDOFF_REQUIRED", lease_id=lease_id)

              if execution_state is None:
                  return _result("RECONCILE", "ACTIVE_LEASE_WITHOUT_EXECUTION_STATE", lease_id=lease_id)
              state_work = execution_state["work_identity"]
              if execution_state["project_identity"]["repository"] != repository:
                  return _result("BLOCK", "EXECUTION_PROJECT_IDENTITY_MISMATCH", lease_id=lease_id)
              if state_work["roadmap_id"] != roadmap_id or state_work["issue_id"] != issue_id:
                  return _result("BLOCK", "EXECUTION_WORK_IDENTITY_MISMATCH", lease_id=lease_id)
              state_writer = execution_state["writer"]
              if state_writer.get("lease_id") != lease_id:
                  return _result("BLOCK", "EXECUTION_LEASE_IDENTITY_MISMATCH", lease_id=lease_id)
              if state_writer.get("lease_state") not in {"ACTIVE", "SUSPENDED"}:
                  return _result("RECONCILE", "EXECUTION_LEASE_STATE_NOT_RESUMABLE", lease_id=lease_id)

              state_reconcile = reconcile_provider_observation(
                  execution_state, main_sha=main_sha, head_sha=head_sha,
                  pr_number=pr_number, branch=branch,
              )
              if state_reconcile["stale"]:
                  return _result("RECONCILE", "EXECUTION_PROVIDER_OBSERVATION_STALE", lease_id=lease_id)

              if checkpoint is not None:
                  if checkpoint["project_identity"] != repository:
                      return _result("BLOCK", "CHECKPOINT_PROJECT_IDENTITY_MISMATCH", lease_id=lease_id)
                  checkpoint_work = checkpoint["work_identity"]
                  if checkpoint_work.get("roadmap_id") != roadmap_id or str(checkpoint_work.get("issue_id")) != issue_id:
                      return _result("BLOCK", "CHECKPOINT_WORK_IDENTITY_MISMATCH", lease_id=lease_id)
                  checkpoint_lease = checkpoint.get("lease_identity")
                  if checkpoint_lease is not None and checkpoint_lease != lease_id:
                      return _result("BLOCK", "CHECKPOINT_LEASE_IDENTITY_MISMATCH", lease_id=lease_id)
                  checkpoint_observed = checkpoint["observed_provider_state"]
                  if checkpoint_observed.get("pr_number") != pr_number or checkpoint_observed.get("branch") != branch:
                      return _result("RECONCILE", "CHECKPOINT_PROVIDER_OBSERVATION_STALE", lease_id=lease_id)
                  checkpoint_reconcile = reconcile_checkpoint(
                      checkpoint, actual_main_sha=main_sha, actual_head_sha=head_sha,
                  )
                  if checkpoint_reconcile["stale"]:
                      return _result("RECONCILE", "CHECKPOINT_PROVIDER_OBSERVATION_STALE", lease_id=lease_id)

              if execution_state["execution_state"] == "COMPLETE":
                  return _result("RECONCILE", "EXECUTION_COMPLETE_RECONCILE_NEXT", lease_id=lease_id)
              if execution_state["execution_state"] == "RECOVERY":
                  return _result("RECONCILE", "EXECUTION_RECOVERY_REQUIRED", lease_id=lease_id)
              if human_boundary_active or execution_state["execution_state"] == "HUMAN_REQUIRED":
                  return _result("BLOCK", "HUMAN_BOUNDARY_ACTIVE", lease_id=lease_id)

              boundary = execution_state["boundary_type"]
              if execution_state["execution_state"] == "SUSPENDED" and boundary in _BLOCKING_BOUNDARIES:
                  return _result("BLOCK", "SUSPENDED_BOUNDARY_BLOCKS_RESUME", lease_id=lease_id, findings=[boundary])
              if execution_state["execution_state"] == "SUSPENDED" and boundary == "NONE":
                  return _result("RECONCILE", "SUSPENDED_BOUNDARY_AMBIGUOUS", lease_id=lease_id)

              waiting_declared = (
                  execution_state["execution_state"] == "WAITING_CI"
                  or boundary == "WAITING_EXTERNAL"
                  or (checkpoint is not None and checkpoint.get("boundary_type") == "EXTERNAL_WAIT")
              )
              if waiting_declared:
                  if external_status is None:
                      return _result("RECONCILE", "EXTERNAL_WAIT_STATUS_REQUIRED", lease_id=lease_id)
                  if str(external_status).strip().lower() in _PENDING_EXTERNAL:
                      return _result("YIELD", "EXTERNAL_WAIT_IN_PROGRESS", lease_id=lease_id)

              return _result("RESUME_EXISTING", "ACTIVE_LEASE_AND_PROVIDER_FACTS_MATCH", lease_id=lease_id)
          PYFILE

          cat > .adwf/tests/test_orch_resume.py <<'PYFILE'
          import copy
          import sys
          import unittest
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[2]
          sys.path.insert(0, str(ROOT / '.adwf'))

          from lib.autonomous_execution_state import build_state, cas_update
          from lib.lease_registry import acquire_registry_lease, empty_lease_registry
          from lib.orch_resume import decide_resume
          from lib.session_continuity import build_checkpoint, checkpoint_digest

          REPO = 'kmephis-ai/AI-Development-Framework'
          MAIN = 'a' * 40
          ALT_MAIN = 'c' * 40
          HEAD = 'b' * 40
          ALT_HEAD = 'd' * 40
          BASE = MAIN
          ROADMAP = 'ORCH_RESUME-001'
          ISSUE = '245'
          BRANCH = 'agent/ORCH_RESUME-001-acquire-resume-yield'
          WORKER = 'chatgpt-gpt5.6-sol'
          LEASE = '11111111-1111-4111-8111-111111111111'
          NOW = datetime(2026, 8, 21, 9, 40, tzinfo=timezone.utc)


          def resources():
              return [{'kind': 'source', 'scope': 'repo/orch-resume', 'shared': False, 'global': False}]


          def registry(*, main_sha=MAIN, worker=WORKER, branch=BRANCH, now=NOW, ttl=120, ceiling=1):
              value = empty_lease_registry(REPO, main_sha, max_parallel_writers=ceiling)
              value, lease = acquire_registry_lease(
                  value,
                  expected_revision=0,
                  observed_main_sha=main_sha,
                  policy_max_parallel_writers=ceiling,
                  issue_id=ISSUE,
                  roadmap_id=ROADMAP,
                  worker_id=worker,
                  base_sha=BASE,
                  branch=branch,
                  resources=resources(),
                  now=now,
                  ttl_minutes=ttl,
                  lease_id=LEASE,
              )
              return value, lease


          def execution(*, main_sha=MAIN, head_sha=HEAD, branch=BRANCH, state='RUNNING', boundary='NONE', lease_id=LEASE, lease_state='ACTIVE'):
              return build_state(
                  repository=REPO,
                  roadmap_id=ROADMAP,
                  issue_id=ISSUE,
                  lease_id=lease_id,
                  lease_state=lease_state,
                  conflict_domains=['source:repo/orch-resume'],
                  main_sha=main_sha,
                  head_sha=head_sha,
                  pr_number=246,
                  branch=branch,
                  execution_state=state,
                  boundary_type=boundary,
                  next_permitted_action='CONTINUE',
              )


          def checkpoint(*, main_sha=MAIN, head_sha=HEAD, branch=BRANCH, lease_id=LEASE, boundary='EXECUTOR_LIMIT'):
              return build_checkpoint(
                  checkpoint_id='ORCH_RESUME-001:0001',
                  checkpoint_revision=1,
                  project_identity=REPO,
                  roadmap_id=ROADMAP,
                  issue_id=ISSUE,
                  lease_identity=lease_id,
                  conflict_domains=['source:repo/orch-resume'],
                  main_sha=main_sha,
                  pr_number=246,
                  head_sha=head_sha,
                  branch=branch,
                  boundary_type=boundary,
                  next_permitted_action='Fresh-read provider facts and resume if authority matches.',
                  safe_handover_summary='Bounded public-safe resume context.',
                  created_at='2026-08-21T09:39:00Z',
                  updated_at='2026-08-21T09:39:00Z',
              )


          def decide(registry_value, **overrides):
              args = dict(
                  repository=REPO,
                  main_sha=MAIN,
                  head_sha=HEAD,
                  pr_number=246,
                  branch=BRANCH,
                  roadmap_id=ROADMAP,
                  issue_id=ISSUE,
                  expected_base_sha=BASE,
                  current_worker_id=WORKER,
                  policy_max_parallel_writers=1,
                  lease_registry=registry_value,
                  execution_state=execution(),
                  checkpoint=checkpoint(),
                  now=NOW,
              )
              args.update(overrides)
              return decide_resume(**args)


          class OrchResumeTests(unittest.TestCase):
              def test_exact_matching_active_authority_returns_resume_existing_without_granting_write(self):
                  value, _ = registry()
                  result = decide(value)
                  self.assertEqual(result['decision'], 'RESUME_EXISTING')
                  self.assertEqual(result['lease_id'], LEASE)
                  self.assertFalse(result['provider_write_authorized'])

              def test_session_accelerator_never_changes_authority_decision(self):
                  value, _ = registry()
                  baseline = decide(value, session_accelerator_present=False)
                  accelerated = decide(value, session_accelerator_present=True)
                  self.assertEqual(baseline, accelerated)

              def test_checkpoint_without_provider_lease_cannot_resume(self):
                  value = empty_lease_registry(REPO, MAIN, max_parallel_writers=1)
                  result = decide(
                      value,
                      execution_state=None,
                      checkpoint=checkpoint(),
                      next_work_authorized=True,
                  )
                  self.assertEqual(result['decision'], 'RECONCILE')
                  self.assertEqual(result['reason'], 'RESUME_CONTEXT_WITHOUT_ACTIVE_LEASE')

              def test_stale_execution_observation_requires_reconcile(self):
                  value, _ = registry()
                  result = decide(value, execution_state=execution(main_sha=ALT_MAIN))
                  self.assertEqual(result['decision'], 'RECONCILE')
                  self.assertEqual(result['reason'], 'EXECUTION_PROVIDER_OBSERVATION_STALE')

              def test_stale_checkpoint_head_requires_reconcile(self):
                  value, _ = registry()
                  result = decide(value, checkpoint=checkpoint(head_sha=ALT_HEAD))
                  self.assertEqual(result['decision'], 'RECONCILE')
                  self.assertEqual(result['reason'], 'CHECKPOINT_PROVIDER_OBSERVATION_STALE')

              def test_expired_active_lease_requires_reconcile_not_replacement(self):
                  value, _ = registry(now=NOW - timedelta(hours=3), ttl=120)
                  result = decide(value)
                  self.assertEqual(result['decision'], 'RECONCILE')
                  self.assertEqual(result['reason'], 'ACTIVE_LEASE_STALE_OR_EXPIRED')

              def test_lease_work_identity_mismatch_blocks(self):
                  value, _ = registry(branch='agent/other-authority')
                  result = decide(value)
                  self.assertEqual(result['decision'], 'BLOCK')
                  self.assertEqual(result['reason'], 'LEASE_WORK_IDENTITY_MISMATCH')

              def test_different_worker_requires_explicit_handoff(self):
                  value, _ = registry(worker='scheduled-executor')
                  result = decide(value)
                  self.assertEqual(result['decision'], 'RECONCILE')
                  self.assertEqual(result['reason'], 'LEASE_OWNER_HANDOFF_REQUIRED')

              def test_waiting_ci_with_fresh_in_progress_status_yields(self):
                  value, _ = registry()
                  state = execution(state='WAITING_CI', boundary='WAITING_EXTERNAL', lease_state='SUSPENDED')
                  cp = checkpoint(boundary='EXTERNAL_WAIT')
                  result = decide(value, execution_state=state, checkpoint=cp, external_status='in_progress')
                  self.assertEqual(result['decision'], 'YIELD')
                  self.assertEqual(result['reason'], 'EXTERNAL_WAIT_IN_PROGRESS')

              def test_completed_external_wait_can_resume_existing(self):
                  value, _ = registry()
                  state = execution(state='WAITING_CI', boundary='WAITING_EXTERNAL', lease_state='SUSPENDED')
                  cp = checkpoint(boundary='EXTERNAL_WAIT')
                  result = decide(value, execution_state=state, checkpoint=cp, external_status='success')
                  self.assertEqual(result['decision'], 'RESUME_EXISTING')

              def test_human_required_blocks(self):
                  value, _ = registry()
                  state = execution(state='HUMAN_REQUIRED', boundary='HUMAN_REQUIRED', lease_state='SUSPENDED')
                  result = decide(value, execution_state=state, human_boundary_active=True)
                  self.assertEqual(result['decision'], 'BLOCK')
                  self.assertEqual(result['reason'], 'HUMAN_BOUNDARY_ACTIVE')

              def test_clean_no_lease_can_only_request_acquisition_when_next_work_authorized(self):
                  value = empty_lease_registry(REPO, MAIN, max_parallel_writers=1)
                  result = decide(
                      value,
                      execution_state=None,
                      checkpoint=None,
                      next_work_authorized=True,
                  )
                  self.assertEqual(result['decision'], 'ACQUIRE_NEW')
                  self.assertFalse(result['provider_write_authorized'])

              def test_terminal_work_reconciles_next_never_resumes_old_writer(self):
                  value, _ = registry()
                  result = decide(value, work_terminal=True)
                  self.assertEqual(result['decision'], 'RECONCILE')
                  self.assertEqual(result['reason'], 'WORK_TERMINAL_RECONCILE_NEXT')

              def test_tampered_execution_state_blocks_before_resume(self):
                  value, _ = registry()
                  state = execution()
                  state['next_permitted_action'] = 'TAMPERED'
                  result = decide(value, execution_state=state)
                  self.assertEqual(result['decision'], 'BLOCK')
                  self.assertEqual(result['reason'], 'EXECUTION_STATE_INVALID')

              def test_tampered_checkpoint_blocks_before_resume(self):
                  value, _ = registry()
                  cp = checkpoint()
                  cp['safe_handover_summary'] = 'tampered after digest'
                  result = decide(value, checkpoint=cp)
                  self.assertEqual(result['decision'], 'BLOCK')
                  self.assertEqual(result['reason'], 'SESSION_CHECKPOINT_INVALID')

              def test_tampered_registry_blocks_before_resume(self):
                  value, _ = registry()
                  value['observed_main_sha'] = ALT_MAIN
                  result = decide(value)
                  self.assertEqual(result['decision'], 'BLOCK')
                  self.assertEqual(result['reason'], 'LEASE_REGISTRY_INVALID')

              def test_valid_active_registry_bound_to_old_main_requires_reconcile(self):
                  value, _ = registry(main_sha=ALT_MAIN)
                  result = decide(value)
                  self.assertEqual(result['decision'], 'RECONCILE')
                  self.assertEqual(result['reason'], 'ACTIVE_LEASE_REGISTRY_MAIN_STALE')

              def test_stage1_rejects_writer_ceiling_above_one(self):
                  value = empty_lease_registry(REPO, MAIN, max_parallel_writers=2)
                  result = decide(
                      value,
                      policy_max_parallel_writers=2,
                      execution_state=None,
                      checkpoint=None,
                      next_work_authorized=True,
                  )
                  self.assertEqual(result['decision'], 'BLOCK')
                  self.assertEqual(result['reason'], 'STAGE1_REQUIRES_SINGLETON_WRITER_CEILING')

              def test_execution_lease_identity_mismatch_blocks(self):
                  value, _ = registry()
                  state = execution(lease_id='22222222-2222-4222-8222-222222222222')
                  result = decide(value, execution_state=state)
                  self.assertEqual(result['decision'], 'BLOCK')
                  self.assertEqual(result['reason'], 'EXECUTION_LEASE_IDENTITY_MISMATCH')

              def test_checkpoint_lease_identity_mismatch_blocks(self):
                  value, _ = registry()
                  cp = checkpoint(lease_id='22222222-2222-4222-8222-222222222222')
                  result = decide(value, checkpoint=cp)
                  self.assertEqual(result['decision'], 'BLOCK')
                  self.assertEqual(result['reason'], 'CHECKPOINT_LEASE_IDENTITY_MISMATCH')


          if __name__ == '__main__':
              unittest.main()
          PYFILE

          git diff --check
          python -m py_compile .adwf/lib/orch_resume.py .adwf/tests/test_orch_resume.py
          python .adwf/tests/test_orch_resume.py -v

      - name: Existing resume substrate regressions
        shell: bash
        run: |
          set -euo pipefail
          python .adwf/tests/test_autonomous_execution_state.py -v
          python .adwf/tests/test_session_continuity_persistence.py -v
          python .adwf/tests/test_orch_provider_leases.py -v
          python .adwf/tests/test_leases.py -v
          python .adwf/tests/test_orchestration.py -v
          python .adwf/tests/test_durable_orchestrator.py -v
          python .adwf/tests/test_v16_remediation.py -v

      - name: Regenerate deterministic projections
        shell: bash
        run: |
          set -euo pipefail
          python .adwf/scripts/docs_freshness.py --write --reviewed-at 2026-08-13T00:00:00Z --valid-until 2026-11-13T00:00:00Z
          python .adwf/scripts/generate_manifest.py

      - name: Structural and integrity verification
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile .adwf/lib/orch_resume.py .adwf/tests/test_orch_resume.py
          python .adwf/scripts/validate_ci.py
          python .adwf/scripts/validate_framework.py
          python .adwf/scripts/validate_pipeline_ir.py
          python .adwf/scripts/docs_freshness.py
          python .adwf/scripts/generate_manifest.py --check
          python .adwf/scripts/validate_docs.py
          python .adwf/scripts/validate_managed_surface.py
          python .adwf/adwf.py doctor --scope package_integrity
          python .adwf/adwf.py doctor --scope config_health

      - name: Full ADWF self-test
        shell: bash
        run: |
          set -euo pipefail
          python .adwf/adwf.py self-test

      - name: Final bounded diff and exact CAS
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --name-only "$SOURCE_MAIN" | sort > /tmp/actual-final
          python - <<'PY'
          from pathlib import Path
          actual = set(Path('/tmp/actual-final').read_text(encoding='utf-8').splitlines())
          allowed = {
              '.adwf/docs-registry.json',
              '.adwf/lib/orch_resume.py',
              '.adwf/tests/test_orch_resume.py',
              'MANIFEST.json',
              'SHA256SUMS.txt',
          }
          required = {'.adwf/lib/orch_resume.py', '.adwf/tests/test_orch_resume.py'}
          unexpected = sorted(actual - allowed)
          missing = sorted(required - actual)
          if unexpected:
              raise SystemExit('UNEXPECTED_FINAL_PATHS:' + ','.join(unexpected))
          if missing:
              raise SystemExit('REQUIRED_FINAL_PATHS_MISSING:' + ','.join(missing))
          print('FINAL_PATHS=' + ','.join(sorted(actual)))
          PY
          git fetch origin main "$TARGET_BRANCH"
          test "$(git rev-parse refs/remotes/origin/main)" = "$SOURCE_MAIN"
          test "$(git rev-parse refs/remotes/origin/$TARGET_BRANCH)" = "$TARGET_OLD_HEAD"

      - name: Publish one clean candidate commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ADWF Provider Materializer'
          git config user.email 'adwf-materializer@users.noreply.github.com'
          git add -- .adwf/lib/orch_resume.py .adwf/tests/test_orch_resume.py .adwf/docs-registry.json MANIFEST.json SHA256SUMS.txt
          git diff --cached --name-only | sort > /tmp/staged
          python - <<'PY'
          from pathlib import Path
          staged = set(Path('/tmp/staged').read_text(encoding='utf-8').splitlines())
          allowed = {
              '.adwf/docs-registry.json',
              '.adwf/lib/orch_resume.py',
              '.adwf/tests/test_orch_resume.py',
              'MANIFEST.json',
              'SHA256SUMS.txt',
          }
          required = {'.adwf/lib/orch_resume.py', '.adwf/tests/test_orch_resume.py'}
          if staged - allowed or required - staged:
              raise SystemExit('STAGED_PATH_CONTRACT_VIOLATION:' + ','.join(sorted(staged)))
          PY
          git commit -m '[ORCH_RESUME-001] Coordinate executor-neutral resume decisions'
          NEW_HEAD="$(git rev-parse HEAD)"
          NEW_TREE="$(git rev-parse HEAD^{tree})"
          echo "NEW_HEAD=$NEW_HEAD"
          echo "NEW_TREE=$NEW_TREE"
          git fetch origin main "$TARGET_BRANCH"
          test "$(git rev-parse refs/remotes/origin/main)" = "$SOURCE_MAIN"
          test "$(git rev-parse refs/remotes/origin/$TARGET_BRANCH)" = "$TARGET_OLD_HEAD"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          REMOTE="$(git ls-remote origin refs/heads/$TARGET_BRANCH | awk '{print $1}')"
          test "$REMOTE" = "$NEW_HEAD"
          echo "PUBLISHED_HEAD=$REMOTE"
