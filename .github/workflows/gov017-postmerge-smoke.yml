name: GOV-017 exact post-merge smoke

on:
  push:
    branches:
      - agent/cert-gov017-postmerge-smoke-20260816-a1

permissions:
  contents: read

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - name: Checkout exact certified main revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: a485a8e8e2984ff8c28274795977b1d3eff881a0
          persist-credentials: false
          fetch-depth: 1
      - name: Setup canonical Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12.10'
      - name: Verify exact revision and run canonical smoke script
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "a485a8e8e2984ff8c28274795977b1d3eff881a0"
          python .adwf/scripts/platform_smoke.py
