name: GOV-004 status permission repair

on:
  push:
    branches: ["gov/004-trusted-status-publication"]

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12.10"
      - name: Build final tree in worktree
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          rm .github/workflows/adwf-gov004-permission-repair.yml
          python - <<'PY'
          from pathlib import Path
          path = Path('.adwf/scripts/generate_pipeline.py')
          text = path.read_text(encoding='utf-8')
          needle = r'      checks: write\n      issues: write\n      pull-requests: write\n'
          replacement = r'      checks: write\n      statuses: write\n      issues: write\n      pull-requests: write\n'
          if text.count(needle) != 1:
              raise SystemExit('GENERATOR_PERMISSION_ANCHOR_NOT_UNIQUE')
          path.write_text(text.replace(needle, replacement), encoding='utf-8', newline='\n')
          PY
          python .adwf/scripts/generate_pipeline.py
          python .adwf/scripts/docs_freshness.py --write --reviewed-at "2026-08-15T11:20:00Z" --valid-until "2026-11-15T11:20:00Z"
          python .adwf/scripts/generate_manifest.py
      - name: Validate intended final tree
        run: |
          python .adwf/scripts/validate_ci.py
          python .adwf/adwf.py provider-check --input .adwf/requests/github-public-standard.json
          python .adwf/scripts/validate_framework.py
          python .adwf/scripts/validate_pipeline_ir.py
          python .adwf/adwf.py doctor --scope package_integrity
          python .adwf/adwf.py doctor --scope config_health
          python .adwf/adwf.py self-test
          python .adwf/scripts/validate_docs.py
          python .adwf/scripts/generate_manifest.py --check
          git diff --check
      - name: Commit non-workflow deterministic artifacts
        run: |
          git restore --source="$GITHUB_SHA" -- .github/workflows/adwf-control.yml .github/workflows/adwf-gov004-permission-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .adwf/scripts/generate_pipeline.py .adwf/docs-registry.json MANIFEST.json SHA256SUMS.txt
          git diff --cached --quiet && exit 0
          git commit -m "Complete GOV-004 status generator projections"
          git push origin HEAD:gov/004-trusted-status-publication
