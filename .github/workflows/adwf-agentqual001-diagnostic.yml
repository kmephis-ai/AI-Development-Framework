name: ADWF AGENTQUAL-001 Materialization Diagnostic

on:
  push:
    branches:
      - agent/materialize-agentqual001-6483a41b

permissions:
  contents: read

env:
  BASE_SHA: 6483a41b20cedcc17721800b164e8bce1d20ec33
  BASE_TREE: d1f8e37fd16530f872093f3a348cf5ec3a14a83e
  APPLY_BLOB_SHA: bf9ccdd893a61fecbe778d0c0a21f2dbf98ebcba

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: agent/materialize-agentqual001-6483a41b
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12.10"
      - name: Support blob identity
        run: |
          set -euo pipefail
          test "$(git hash-object .transport/agentqual001/apply.py)" = "$APPLY_BLOB_SHA"
          test "$(git rev-parse "$BASE_SHA^{tree}")" = "$BASE_TREE"
      - name: Exact BASE worktree
        run: |
          set -euo pipefail
          rm -rf /tmp/agentqual-diag
          git worktree add --detach /tmp/agentqual-diag "$BASE_SHA"
          test "$(git -C /tmp/agentqual-diag rev-parse HEAD)" = "$BASE_SHA"
          test -z "$(git -C /tmp/agentqual-diag status --porcelain=v1 --untracked-files=all)"
      - name: Apply deterministic candidate payload
        run: |
          set -euo pipefail
          python .transport/agentqual001/apply.py /tmp/agentqual-diag
      - name: Repair reference authority self-check
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/agentqual-diag/.adwf/scripts/reference_agent_adapter.py')
          text=p.read_text(encoding='utf-8')
          old="    for name in os.environ:\n        if any(marker in name.upper() for marker in SECRET_MARKERS):\n            return fail(\"REFERENCE_AGENT_SECRET_ENVIRONMENT_LEAK\")"
          new="    for name in os.environ:\n        if name == \"ADWF_AGENT_SECRETS_AUTHORITY\":\n            continue\n        if any(marker in name.upper() for marker in SECRET_MARKERS):\n            return fail(\"REFERENCE_AGENT_SECRET_ENVIRONMENT_LEAK\")"
          if old in text:
              p.write_text(text.replace(old,new,1),encoding='utf-8',newline='\n')
          elif new not in text:
              raise SystemExit('REFERENCE_AGENT_SECRET_GUARD_BASE_MISMATCH')
          PY
      - name: Documentation digest generation
        working-directory: /tmp/agentqual-diag
        run: |
          set -euo pipefail
          python .adwf/scripts/docs_freshness.py --write --reviewed-at 2026-08-16T20:30:00Z --valid-until 2026-11-16T20:30:00Z
      - name: Manifest generation
        working-directory: /tmp/agentqual-diag
        run: |
          set -euo pipefail
          python .adwf/scripts/generate_manifest.py
          git diff --check
      - name: Candidate commit construction
        working-directory: /tmp/agentqual-diag
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "AGENTQUAL-001: diagnostic candidate"
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
