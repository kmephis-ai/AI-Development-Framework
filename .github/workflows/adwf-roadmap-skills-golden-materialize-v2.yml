name: ADWF Roadmap Skills Golden Materializer v2

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  issues: read

env:
  BASE_SHA: cd1b0ddc1173d2917e86888bcaec9537686b8ea1
  EXPECTED_TREE: 01ba3bd56c726fbb0a4913375b1889c3f9bf4cb2
  TARGET_BRANCH: agent/ROADMAP_SKILLS_2026-001-skill-golden-paths
  ISSUE_NUMBER: '214'
  ROADMAP_ID: ROADMAP_SKILLS_2026-001
  WRITER_LEASE: 32388d86-c3ec-44a9-8dc8-364c1b5e0b36
  GH_TOKEN: ${{ github.token }}
  PATCH_B64: 

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.BASE_SHA }}
          fetch-depth: 0
          persist-credentials: true
      - name: Verify live writer authority
        shell: bash
        run: |
          set -euo pipefail
          live_main="$(curl --fail --silent --show-error -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer ${GH_TOKEN}" -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/branches/main" | jq -r '.commit.sha')"
          test "${live_main}" = "${BASE_SHA}"
          issue_body="$(curl --fail --silent --show-error -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer ${GH_TOKEN}" -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}" | jq -r '.body')"
          grep -Fq "${ROADMAP_ID}" <<<"${issue_body}"
          grep -Fq "${WRITER_LEASE}" <<<"${issue_body}"
          grep -Fq 'State: IN_PROGRESS' <<<"${issue_body}"
          if git ls-remote --exit-code --heads origin "refs/heads/${TARGET_BRANCH}" >/dev/null 2>&1; then
            echo "TARGET_BRANCH_ALREADY_EXISTS:${TARGET_BRANCH}" >&2
            exit 1
          fi
      - name: Apply exact Roadmap patch
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "${PATCH_B64}" | base64 -d > /tmp/roadmap.diff
          git apply --check /tmp/roadmap.diff
          git apply --index /tmp/roadmap.diff
          test "$(git diff --cached --name-only | sort | tr '\n' ' ')" = ".adwf/docs-registry.json .adwf/roadmap.json MANIFEST.json SHA256SUMS.txt "
      - name: Verify generators and contracts
        shell: bash
        run: |
          set -euo pipefail
          python .adwf/scripts/docs_freshness.py --write
          python .adwf/scripts/generate_manifest.py
          git diff --exit-code
          python .adwf/scripts/generate_manifest.py --check
          python .adwf/scripts/docs_freshness.py
          python .adwf/scripts/validate_ci.py
          python .adwf/scripts/validate_framework.py
          python .adwf/scripts/validate_pipeline_ir.py
          python .adwf/scripts/validate_docs.py
          python .adwf/adwf.py doctor --scope package_integrity
          python .adwf/adwf.py doctor --scope config_health
          python .adwf/adwf.py self-test
          git diff --check --cached
      - name: Publish exact candidate after PASS
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ADWF Provider Materializer'
          git config user.email 'noreply@github.com'
          git commit -m '[ROADMAP_SKILLS_2026-001] Materialize Skill Intelligence and Golden Paths'
          tree="$(git rev-parse HEAD^{tree})"
          test "${tree}" = "${EXPECTED_TREE}"
          live_main="$(curl --fail --silent --show-error -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer ${GH_TOKEN}" -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/branches/main" | jq -r '.commit.sha')"
          test "${live_main}" = "${BASE_SHA}"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
          echo "CANDIDATE_SHA=$(git rev-parse HEAD)"
          echo "CANDIDATE_TREE=${tree}"
