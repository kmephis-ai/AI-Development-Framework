name: ADWF Exact Candidate Publisher

on:
  push:
    branches:
      - agent/publish-CONSUMER_INSTR-001-20260817-d1

permissions:
  contents: write

env:
  BASE_SHA: 4285ab53714841a2646e6d658e0b8d8a25b4d264
  PARENT_SHA: 3a407e6fde74a112815c17fef13e7d8feab52499
  EXPECTED_TREE: b17a261a0353c373148b16032394415b8ee56cad
  WRITER_BRANCH: agent/CONSUMER_INSTR-001-layered-instructions

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: agent/CONSUMER_INSTR-001-layered-instructions
          fetch-depth: 0
          persist-credentials: false

      - name: Preserve review chronology and publish exact correction
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          base_sha = '4285ab53714841a2646e6d658e0b8d8a25b4d264'
          path = Path('.adwf/docs-registry.json')
          current = json.loads(path.read_text(encoding='utf-8'))
          base = json.loads(subprocess.check_output(['git', 'show', f'{base_sha}:.adwf/docs-registry.json'], text=True))
          base_by = {item['path']: item for item in base['documents']}
          for item in current['documents']:
              old = base_by.get(item['path'])
              if old:
                  item['reviewed_at'] = old['reviewed_at']
                  item['valid_until'] = old['valid_until']
          path.write_text(json.dumps(current, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

          python .adwf/scripts/generate_manifest.py
          python .adwf/tests/test_consumer_instructions.py
          python .adwf/tests/test_consumer_upgrade_core.py
          python .adwf/tests/test_consumer_instruction_upgrade_transaction.py
          python .adwf/scripts/validate_framework.py
          python .adwf/scripts/validate_managed_surface.py
          git diff --check

          git add -A
          TREE="$(git write-tree)"
          printf 'candidate_tree=%s\n' "$TREE"
          test "$TREE" = "$EXPECTED_TREE"

          AUTH="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $AUTH"
          CURRENT="$(git ls-remote origin "refs/heads/${WRITER_BRANCH}" | awk '{print $1}')"
          printf 'writer_before=%s\n' "$CURRENT"
          test "$CURRENT" = "$PARENT_SHA"

          export GIT_AUTHOR_NAME='github-actions[bot]'
          export GIT_AUTHOR_EMAIL='41898282+github-actions[bot]@users.noreply.github.com'
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          COMMIT="$(printf '%s\n' 'CONSUMER_INSTR-001: preserve docs review chronology' | git commit-tree "$TREE" -p "$PARENT_SHA")"
          printf 'candidate_commit=%s\n' "$COMMIT"
          git push origin "$COMMIT:refs/heads/$WRITER_BRANCH"
          AFTER="$(git ls-remote origin "refs/heads/${WRITER_BRANCH}" | awk '{print $1}')"
          test "$AFTER" = "$COMMIT"
          printf 'writer_after=%s\n' "$AFTER"
