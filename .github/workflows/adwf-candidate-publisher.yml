name: ADWF Candidate Refresh CONSUMER_ROUTE-001

on:
  push:
    branches:
      - agent/local-mirror-consumer-route-001-20260817-a1

permissions:
  contents: write

jobs:
  refresh-exact-tree:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TARGET_SHA: c32d001e919461c83b0917ad0c6638de646ec197
      TARGET_BRANCH: agent/consumer-route-001-native-gate-routing
      EXPECTED_TREE: c1dc5fffb6854a63b413fedc204d1c1ac2d52a57
      AGENTS_SOURCE_DIGEST: 92623d71694c708481056dc705757d2feb3f97eb7a5aff67513e826e66aea0a8
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Verify target exact HEAD
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse refs/remotes/origin/${TARGET_BRANCH})" = "${TARGET_SHA}"
          git reset --hard "${TARGET_SHA}"
          git clean -fdx

      - name: Refresh canonical docs freshness binding
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('.adwf/docs-registry.json')
          value = json.loads(path.read_text(encoding='utf-8'))
          matches = [item for item in value['documents'] if item.get('path') == 'AGENTS.md']
          if len(matches) != 1:
              raise SystemExit('AGENTS_DOC_REGISTRY_BINDING_AMBIGUOUS')
          matches[0]['source_digest'] = '92623d71694c708481056dc705757d2feb3f97eb7a5aff67513e826e66aea0a8'
          path.write_text(json.dumps(value, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          python .adwf/scripts/generate_manifest.py
          python .adwf/scripts/docs_freshness.py
          python .adwf/scripts/generate_manifest.py --check
          python .adwf/scripts/validate_framework.py
          git add .adwf/docs-registry.json SHA256SUMS.txt
          git diff --cached --check

      - name: Verify exact refreshed tree
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_TREE="$(git write-tree)"
          echo "candidate_tree=${ACTUAL_TREE}"
          test "${ACTUAL_TREE}" = "${EXPECTED_TREE}"

      - name: Commit and publish refresh
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "adwf-candidate-publisher"
          git config user.email "adwf-candidate-publisher@users.noreply.github.com"
          git commit -m "CONSUMER_ROUTE-001: refresh docs freshness binding"
          test "$(git rev-parse HEAD^{tree})" = "${EXPECTED_TREE}"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
