name: SESSION CERT Trusted Diagnostic

on:
  pull_request:
    types: [opened, reopened]
    branches: [main]

permissions:
  contents: read
  actions: read
  checks: read
  issues: read
  pull-requests: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ac95b871e7f8796c9f9f61c917911cf1d40674c2
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12.10'
          check-latest: false
      - name: Evaluate exact trusted gate read-only
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import importlib.util
          import json
          import os
          from pathlib import Path
          import sys
          sys.path.insert(0, '.adwf')
          from lib.github_provider import GitHubClient
          path = Path('.adwf/scripts/publish_trusted_gate.py')
          spec = importlib.util.spec_from_file_location('publish_trusted_gate_diag', path)
          module = importlib.util.module_from_spec(spec)
          assert spec and spec.loader
          spec.loader.exec_module(module)
          repo = os.environ['GITHUB_REPOSITORY']
          client = GitHubClient(repo, os.environ['GITHUB_TOKEN'])
          live = client.get(f'/repos/{repo}/actions/runs/32342823128')
          result = module.evaluate_trusted_gate(client, repo, live)
          print('TRUSTED_GATE_DIAGNOSTIC=' + json.dumps(result, ensure_ascii=False, sort_keys=True))
          PY
