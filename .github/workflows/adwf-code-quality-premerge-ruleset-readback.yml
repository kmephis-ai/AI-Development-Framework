name: CODE_QUALITY Premerge Ruleset Readback

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  actions: read
  contents: read

jobs:
  readback:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read exact main and live rulesets
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_MAIN: 9ec018f292e7b8537e324e7db645f1176d8cd83f
        shell: python
        run: |
          import json, os, urllib.request
          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          }
          def get(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)
          branch = get(f'https://api.github.com/repos/{repo}/branches/main')
          main_sha = str((branch.get('commit') or {}).get('sha') or '')
          print('MAIN_SHA=' + main_sha)
          if main_sha != os.environ['EXPECTED_MAIN']:
              raise SystemExit('MAIN_SHA_DRIFT')
          summaries = get(f'https://api.github.com/repos/{repo}/rulesets?includes_parents=true')
          details=[]
          for item in summaries:
              rid=item.get('id')
              detail=get(f'https://api.github.com/repos/{repo}/rulesets/{rid}')
              details.append({
                  'id': detail.get('id'),
                  'name': detail.get('name'),
                  'target': detail.get('target'),
                  'enforcement': detail.get('enforcement'),
                  'bypass_actors': detail.get('bypass_actors'),
                  'conditions': detail.get('conditions'),
                  'rules': detail.get('rules'),
                  'current_user_can_bypass': detail.get('current_user_can_bypass'),
              })
          details.sort(key=lambda x: x['id'] or 0)
          print('RULESETS=' + json.dumps(details, sort_keys=True, separators=(',', ':')))
          active=[x for x in details if x.get('enforcement')=='active']
          main_rules=[x for x in active if x.get('name')=='ADWF protected main']
          anchors=[x for x in active if x.get('name')=='ADWF immutable runtime anchors']
          if len(main_rules)!=1 or len(anchors)!=1:
              raise SystemExit('REQUIRED_RULESETS_NOT_UNIQUE')
          rule=main_rules[0]
          anchor=anchors[0]
          if rule.get('bypass_actors') or rule.get('current_user_can_bypass') not in (None,'never'):
              raise SystemExit('PROTECTED_MAIN_BYPASS_PRESENT')
          if anchor.get('bypass_actors') or anchor.get('current_user_can_bypass') not in (None,'never'):
              raise SystemExit('RUNTIME_ANCHOR_BYPASS_PRESENT')
          required=[]
          strict=None
          for entry in rule.get('rules') or []:
              if entry.get('type')=='required_status_checks':
                  params=entry.get('parameters') or {}
                  strict=params.get('strict_required_status_checks_policy')
                  required=[(x.get('context'),x.get('integration_id')) for x in params.get('required_status_checks') or []]
          expected={'fast-feedback','adwf/governance-gate','adwf/trusted-gate'}
          if {x[0] for x in required} != expected or strict is not True:
              raise SystemExit('PROTECTED_MAIN_REQUIRED_CHECKS_DRIFT')
          if len({x[1] for x in required}) != 1 or next(iter({x[1] for x in required})) != 15368:
              raise SystemExit('PROTECTED_MAIN_CHECK_SOURCE_DRIFT')
          anchor_types={x.get('type') for x in anchor.get('rules') or []}
          if not {'deletion','update'}.issubset(anchor_types):
              raise SystemExit('RUNTIME_ANCHOR_IMMUTABILITY_DRIFT')
          print('RULESET_PREFLIGHT=PASS')
