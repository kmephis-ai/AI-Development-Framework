name: ADWF UPGRADE-003 v4 Provider Certification

on:
  push:
    branches:
      - agent/materialize-upgrade003-v4-91056fc9

permissions:
  contents: write
  checks: write

env:
  EXPECTED_BASE: 91056fc9153b3b3275a99c64adaf245122073bca
  EXPECTED_BASE_TREE: 1d62da5aa55e8fb66402394b0eca85fcaa357e57
  EXPECTED_CANDIDATE_TREE: c43c973f16b9cabc0115c1fa4830761f4d51a098
  EXPECTED_PATCH_SHA256: 0acf7c400820f80c08889882ce51b4e960bd27ada0b311b12a95c673ee903fa5
  TARGET_BRANCH: agent/upgrade-003-external-consumer-proof-v4
  CONSUMER_SHA: 00659d0e423e4baf222b056e732b576887200891
  CONSUMER_TREE: c47ddccf2b13f50fc171f005ef3197fce20b25c5

jobs:
  certify-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13'
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: kmephis-ai/PrihRashOnline-v2
          ref: 00659d0e423e4baf222b056e732b576887200891
          path: external-consumer
          fetch-depth: 1
          persist-credentials: false

      - name: Reconstruct immutable candidate in exact BASE worktree
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main "${TARGET_BRANCH}"
          test "$(git rev-parse origin/main)" = "${EXPECTED_BASE}"
          test "$(git rev-parse origin/${TARGET_BRANCH})" = "${EXPECTED_BASE}"
          test "$(git rev-parse ${EXPECTED_BASE}^{tree})" = "${EXPECTED_BASE_TREE}"
          cat .transport/upgrade003-v4/patch.b64.* > /tmp/upgrade003.patch.xz.b64
          test "$(wc -c < /tmp/upgrade003.patch.xz.b64 | tr -d ' ')" = "21928"
          base64 -d /tmp/upgrade003.patch.xz.b64 > /tmp/upgrade003.patch.xz
          test "$(wc -c < /tmp/upgrade003.patch.xz | tr -d ' ')" = "16444"
          xz -dc /tmp/upgrade003.patch.xz > /tmp/upgrade003.patch
          test "$(wc -c < /tmp/upgrade003.patch | tr -d ' ')" = "64624"
          test "$(sha256sum /tmp/upgrade003.patch | awk '{print $1}')" = "${EXPECTED_PATCH_SHA256}"
          git worktree add --detach /tmp/adwf-candidate "${EXPECTED_BASE}"
          cd /tmp/adwf-candidate
          git apply --check /tmp/upgrade003.patch
          git apply /tmp/upgrade003.patch
          git add -A
          git diff --cached --name-only | sort > /tmp/actual-files.txt
          cat > /tmp/expected-files.txt <<'FILES'
          .adwf/capability-traceability.json
          .adwf/decision-requirement-traceability.json
          .adwf/docs-registry.json
          .adwf/lib/external_consumer_upgrade_proof.py
          .adwf/roadmap.json
          .adwf/schemas/external-consumer-upgrade-proof.schema.json
          .adwf/scripts/run_external_consumer_upgrade_proof.py
          .adwf/tests/test_external_consumer_upgrade_proof.py
          MANIFEST.json
          SHA256SUMS.txt
          docs/governance/CONSUMER_FRAMEWORK_UPGRADE_TRANSACTION.md
          docs/governance/EXTERNAL_CONSUMER_UPGRADE_PROOF.md
          FILES
          diff -u /tmp/expected-files.txt /tmp/actual-files.txt
          test "$(git write-tree)" = "${EXPECTED_CANDIDATE_TREE}"
          git diff --cached --check
          git config user.email 'adwf-provider@example.invalid'
          git config user.name 'ADWF Provider Certification'
          git commit -m 'UPGRADE-003: real external consumer upgrade proof v1'
          echo "CANDIDATE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          test "$(git rev-parse HEAD^{tree})" = "${EXPECTED_CANDIDATE_TREE}"

      - name: Focused and lifecycle regression suites
        shell: bash
        working-directory: /tmp/adwf-candidate
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=.adwf python -m unittest discover -s .adwf/tests -p 'test_external_consumer_upgrade_proof.py' -v
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=.adwf python -m unittest discover -s .adwf/tests -p 'test_consumer_upgrade*.py' -v
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=.adwf python -m unittest discover -s .adwf/tests -p 'test_managed_surface*.py' -v
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=.adwf python -m unittest discover -s .adwf/tests -p 'test_consumer_profile.py' -v
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=.adwf python -m unittest discover -s .adwf/tests -p 'test_project_pack_sdk.py' -v
          test -z "$(git status --porcelain)"

      - name: Canonical validators and full self-test
        shell: bash
        working-directory: /tmp/adwf-candidate
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python .adwf/scripts/validate_capabilities.py
          PYTHONDONTWRITEBYTECODE=1 python .adwf/scripts/validate_traceability.py
          PYTHONDONTWRITEBYTECODE=1 python .adwf/scripts/docs_freshness.py
          timeout 900 python .adwf/scripts/validate_docs.py
          PYTHONDONTWRITEBYTECODE=1 python .adwf/scripts/validate_managed_surface.py
          PYTHONDONTWRITEBYTECODE=1 python .adwf/scripts/generate_manifest.py --check
          timeout 900 python .adwf/scripts/validate_framework.py
          timeout 900 python .adwf/adwf.py self-test
          test -z "$(git status --porcelain)"

      - name: Verify exact read-only PrihRash canary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C external-consumer rev-parse HEAD)" = "${CONSUMER_SHA}"
          test "$(git -C external-consumer rev-parse HEAD^{tree})" = "${CONSUMER_TREE}"
          test -z "$(git -C external-consumer status --porcelain=v1 --untracked-files=all)"
          test ! -e external-consumer/.adwf

      - name: Real external consumer A to B to A to B proof
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/adwf-source "${EXPECTED_BASE}"
          test "$(git -C /tmp/adwf-source rev-parse HEAD)" = "${EXPECTED_BASE}"
          test "$(git -C /tmp/adwf-source rev-parse HEAD^{tree})" = "${EXPECTED_BASE_TREE}"
          PYTHONDONTWRITEBYTECODE=1 python /tmp/adwf-candidate/.adwf/scripts/run_external_consumer_upgrade_proof.py \
            --consumer-root "$GITHUB_WORKSPACE/external-consumer" \
            --consumer-repository kmephis-ai/PrihRashOnline-v2 \
            --consumer-sha "${CONSUMER_SHA}" \
            --consumer-tree "${CONSUMER_TREE}" \
            --source-root /tmp/adwf-source \
            --source-sha "${EXPECTED_BASE}" \
            --source-tree "${EXPECTED_BASE_TREE}" \
            --target-root /tmp/adwf-candidate \
            --target-sha "${CANDIDATE_SHA}" \
            --target-tree "${EXPECTED_CANDIDATE_TREE}" \
            --product-name PrihRashOnline-v2 \
            --default-branch main \
            --repository-visibility PUBLIC \
            --provider-run-id "${GITHUB_RUN_ID}" > /tmp/external-proof.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/external-proof.json',encoding='utf-8'))
          assert p['status']=='PASS'
          assert p['consumer']['sha']=='00659d0e423e4baf222b056e732b576887200891'
          assert p['consumer']['tree']=='c47ddccf2b13f50fc171f005ef3197fce20b25c5'
          assert p['framework']['source_sha']=='91056fc9153b3b3275a99c64adaf245122073bca'
          assert p['framework']['target_tree']=='c43c973f16b9cabc0115c1fa4830761f4d51a098'
          assert p['transitions']=={'adoption':'COMMITTED','upgrade_b':'COMMITTED','rollback_a':'ROLLED_BACK','retry_b':'COMMITTED'}
          assert p['external_source_unchanged'] is True
          assert p['write_back_performed'] is False
          print('EXTERNAL_PROOF_REPORT_SHA256='+p['report_sha256'])
          PY
          test "$(git -C external-consumer rev-parse HEAD)" = "${CONSUMER_SHA}"
          test "$(git -C external-consumer rev-parse HEAD^{tree})" = "${CONSUMER_TREE}"
          test -z "$(git -C external-consumer status --porcelain=v1 --untracked-files=all)"
          test ! -e external-consumer/.adwf

      - name: Exact BASE trust classification
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=/tmp/adwf-source/.adwf python - <<'PY'
          import json, os, sys
          sys.path.insert(0,'/tmp/adwf-source/.adwf')
          from lib.trust import classify_git_diff
          result=classify_git_diff('/tmp/adwf-candidate',os.environ['EXPECTED_BASE'],os.environ['CANDIDATE_SHA'])
          print('TRUST_CLASSIFICATION='+json.dumps(result,sort_keys=True))
          assert result['result'] in {'ALLOW','HUMAN_REQUIRED'}
          assert result.get('weakening',[]) == []
          PY

      - name: Final CAS and publish writer plus exact proof check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin main "${TARGET_BRANCH}"
          test "$(git rev-parse origin/main)" = "${EXPECTED_BASE}"
          test "$(git rev-parse origin/${TARGET_BRANCH})" = "${EXPECTED_BASE}"
          test "$(git -C /tmp/adwf-candidate rev-parse HEAD^{tree})" = "${EXPECTED_CANDIDATE_TREE}"
          git -C /tmp/adwf-candidate push origin "HEAD:refs/heads/${TARGET_BRANCH}"
          python - <<'PY'
          import json, os, urllib.request
          proof=json.load(open('/tmp/external-proof.json',encoding='utf-8'))
          payload={
            'name':'adwf/external-consumer-upgrade-proof',
            'head_sha':os.environ['CANDIDATE_SHA'],
            'status':'completed','conclusion':'success',
            'output':{
              'title':'ADWF external consumer upgrade proof',
              'summary':'PASS: exact read-only PrihRash snapshot completed disposable A→B→A→B with byte-preservation.',
              'text':('consumer='+proof['consumer']['sha']+' tree='+proof['consumer']['tree']+'\n'
                      'source='+proof['framework']['source_sha']+' target='+proof['framework']['target_sha']+'\n'
                      'report_sha256='+proof['report_sha256'])
            }
          }
          req=urllib.request.Request(
            'https://api.github.com/repos/kmephis-ai/AI-Development-Framework/check-runs',
            data=json.dumps(payload).encode(),method='POST',
            headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'})
          with urllib.request.urlopen(req,timeout=30) as r:
            body=json.load(r)
          assert body['head_sha']==os.environ['CANDIDATE_SHA']
          assert body['conclusion']=='success'
          print('PROOF_CHECK_ID='+str(body['id']))
          PY
