name: ADWF AGENTQUAL-001 V3 Exact Candidate Materializer

on:
  push:
    branches:
      - agent/materialize-agentqual001-v2-6483a41b

permissions:
  contents: write
  checks: write

env:
  BASE_SHA: 6483a41b20cedcc17721800b164e8bce1d20ec33
  BASE_TREE: d1f8e37fd16530f872093f3a348cf5ec3a14a83e
  APPLY_BLOB_SHA: c9954c5417795287a97c42ccab7495cb94e4f386
  HARDEN_BLOB_SHA: 3eaf43efb5e75e99755c6bf74605264a0db13bd0
  TESTFIX_BLOB_SHA: 3c6dc8e1a2bd2da3ded3f0f97f6f4f5566f9d2d4
  FEATURE_BRANCH: agent/agentqual-001-creative-agent-qualification

jobs:
  materialize-and-certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: agent/materialize-agentqual001-v2-6483a41b
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12.10"
      - name: Verify support blobs and exact BASE
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object .transport/agentqual001-v2/apply.py)" = "$APPLY_BLOB_SHA"
          test "$(git hash-object .transport/agentqual001-v2/harden.py)" = "$HARDEN_BLOB_SHA"
          test "$(git hash-object .transport/agentqual001-v2/testfix.py)" = "$TESTFIX_BLOB_SHA"
          test "$(git rev-parse "$BASE_SHA^{tree}")" = "$BASE_TREE"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE_SHA"
          test "$(git ls-remote origin "refs/heads/$FEATURE_BRANCH" | cut -f1)" = "$BASE_SHA"
      - name: Materialize deterministic candidate from exact BASE
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/agentqual-candidate-v3 /tmp/agentqual-base-v3
          git worktree add --detach /tmp/agentqual-candidate-v3 "$BASE_SHA"
          test "$(git -C /tmp/agentqual-candidate-v3 rev-parse HEAD)" = "$BASE_SHA"
          test -z "$(git -C /tmp/agentqual-candidate-v3 status --porcelain=v1 --untracked-files=all)"
          python .transport/agentqual001-v2/apply.py /tmp/agentqual-candidate-v3
          python .transport/agentqual001-v2/harden.py /tmp/agentqual-candidate-v3
          python .transport/agentqual001-v2/testfix.py /tmp/agentqual-candidate-v3
          cd /tmp/agentqual-candidate-v3
          python .adwf/scripts/docs_freshness.py --write --reviewed-at 2026-08-16T20:30:00Z --valid-until 2026-11-16T20:30:00Z
          python .adwf/scripts/generate_manifest.py
          git diff --check
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "AGENTQUAL-001: qualify replaceable creative agent adapters"
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          echo "CANDIDATE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "CANDIDATE_TREE=$(git rev-parse HEAD^{tree})" >> "$GITHUB_ENV"
          git diff --binary "$BASE_SHA..HEAD" > /tmp/agentqual-v3.patch
          echo "PATCH_SHA256=$(sha256sum /tmp/agentqual-v3.patch | cut -d' ' -f1)" >> "$GITHUB_ENV"
      - name: Focused and regression suites
        shell: bash
        working-directory: /tmp/agentqual-candidate-v3
        run: |
          set -euo pipefail
          python -m compileall -q .adwf/lib .adwf/scripts .adwf/tests/test_creative_agent_qualification.py
          python .adwf/tests/test_creative_agent_qualification.py -q
          python .adwf/tests/test_ai_work_contracts.py -q
          python .adwf/tests/test_v15_executive.py -q
          python .adwf/tests/test_v16_remediation.py -q
      - name: Dynamic offline Creative Agent qualification
        shell: bash
        working-directory: /tmp/agentqual-candidate-v3
        run: |
          set -euo pipefail
          python .adwf/scripts/qualify_creative_agent.py --output /tmp/agentqual-v3-proof.json
          python - <<'PY'
          import json
          from pathlib import Path
          proof=json.loads(Path('/tmp/agentqual-v3-proof.json').read_text(encoding='utf-8'))
          assert proof['status']=='PASS', proof
          assert proof['adapter_id']=='reference-local', proof
          assert proof['network']=='NONE', proof
          assert proof['secrets']=='FORBIDDEN', proof
          assert proof['filesystem']=='PACKAGE_SCOPED', proof
          assert proof['monetary_budget_usd']==0, proof
          assert proof['low_trust_result'] is True, proof
          assert proof['real_external_agent_verified'] is False, proof
          print(json.dumps(proof, sort_keys=True))
          PY
      - name: Canonical validators and package integrity
        shell: bash
        working-directory: /tmp/agentqual-candidate-v3
        run: |
          set -euo pipefail
          python .adwf/scripts/validate_capabilities.py
          python .adwf/scripts/validate_traceability.py
          python .adwf/scripts/docs_freshness.py
          python .adwf/scripts/validate_ci.py
          python .adwf/scripts/generate_manifest.py --check
          python .adwf/adwf.py doctor --scope package_integrity
      - name: Full framework validator
        shell: bash
        working-directory: /tmp/agentqual-candidate-v3
        run: |
          set -euo pipefail
          python .adwf/scripts/validate_framework.py
      - name: Exact BASE trust classification
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/agentqual-base-v3 "$BASE_SHA"
          BASE_SHA="$BASE_SHA" CANDIDATE_SHA="$CANDIDATE_SHA" python - <<'PY'
          import json, os, sys
          sys.path.insert(0, '/tmp/agentqual-base-v3/.adwf')
          from lib.trust import classify_git_diff
          result=classify_git_diff('/tmp/agentqual-candidate-v3', os.environ['BASE_SHA'], os.environ['CANDIDATE_SHA'])
          print(json.dumps(result, ensure_ascii=False, sort_keys=True))
          assert result.get('result')=='ALLOW', result
          assert result.get('authorization_mode')=='STANDING_OWNER_POLICY', result
          assert result.get('human_required') is False, result
          assert (result.get('manual_required_files') or [])==[], result
          assert (result.get('inspection_unverified_files') or [])==[], result
          assert (result.get('weakening') or [])==[], result
          assert (result.get('reason_codes') or [])==[], result
          PY
      - name: CAS guard and publish exact feature candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE_SHA"
          test "$(git ls-remote origin "refs/heads/$FEATURE_BRANCH" | cut -f1)" = "$BASE_SHA"
          test "$(git -C /tmp/agentqual-candidate-v3 rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git -C /tmp/agentqual-candidate-v3 rev-parse HEAD^{tree})" = "$CANDIDATE_TREE"
          git -C /tmp/agentqual-candidate-v3 push origin "$CANDIDATE_SHA:refs/heads/$FEATURE_BRANCH"
      - name: Publish exact-head synthetic qualification provider proof
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CANDIDATE_SHA="$CANDIDATE_SHA" CANDIDATE_TREE="$CANDIDATE_TREE" PATCH_SHA256="$PATCH_SHA256" python - <<'PY'
          import json, os, urllib.request
          from pathlib import Path
          proof=json.loads(Path('/tmp/agentqual-v3-proof.json').read_text(encoding='utf-8'))
          registry=json.loads(Path('/tmp/agentqual-candidate-v3/.adwf/creative-agent-adapters.json').read_text(encoding='utf-8'))
          repo=os.environ['GITHUB_REPOSITORY']; token=os.environ['GITHUB_TOKEN']; sha=os.environ['CANDIDATE_SHA']
          payload={'name':'adwf/creative-agent-qualification-proof','head_sha':sha,'status':'completed','conclusion':'success','output':{
            'title':'AGENTQUAL-001 synthetic Creative Agent qualification — PASS',
            'summary':'PASS: exact candidate passed provider-neutral offline qualification; no real external AI/agent provider is claimed.',
            'text':f"candidate_sha={sha} tree={os.environ['CANDIDATE_TREE']} patch_sha256={os.environ['PATCH_SHA256']}\nadapter_id={proof['adapter_id']} adapter_digest={proof['adapter_digest']} registry_sha256={registry['registry_sha256']} report_sha256={proof['report_sha256']}\nnetwork=NONE secrets=FORBIDDEN filesystem=PACKAGE_SCOPED monetary_budget_usd=0\nlow_trust_result=true real_external_agent_verified=false capability_status=LIVE_NOT_VERIFIED\nauthorization=STANDING_OWNER_POLICY weakening=[]"}}
          req=urllib.request.Request(f'https://api.github.com/repos/{repo}/check-runs',data=json.dumps(payload).encode('utf-8'),method='POST',headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'})
          with urllib.request.urlopen(req,timeout=30) as response: created=json.load(response)
          print(json.dumps({'status':'PASS','candidate_sha':sha,'tree':os.environ['CANDIDATE_TREE'],'patch_sha256':os.environ['PATCH_SHA256'],'check_run_id':created.get('id'),'report_sha256':proof['report_sha256'],'registry_sha256':registry['registry_sha256']},sort_keys=True))
          PY
