name: ADWF AGENTQUAL-001 V4 Exact Candidate Materializer

on:
  push:
    branches:
      - agent/materialize-agentqual001-v2-6483a41b

permissions:
  contents: write
  checks: write

env:
  BASE_SHA: 6483a41b20cedcc17721800b164e8bce1d20ec33
  BASE_TREE: d1f8e37fd16530f872093f3a348cf5ec3a14a83e
  OLD_HEAD: 087ed559594070c4e44e1f4ad2916c3b46e6a45b
  APPLY_BLOB_SHA: c9954c5417795287a97c42ccab7495cb94e4f386
  HARDEN_BLOB_SHA: 3eaf43efb5e75e99755c6bf74605264a0db13bd0
  TESTFIX_BLOB_SHA: 3c6dc8e1a2bd2da3ded3f0f97f6f4f5566f9d2d4
  TRACEFIX_BLOB_SHA: 6d15930306d4b4f0008b2816323c7f4ef6b2f69f
  FEATURE_BRANCH: agent/agentqual-001-creative-agent-qualification

jobs:
  materialize-and-certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: agent/materialize-agentqual001-v2-6483a41b
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12.10"
      - name: Verify support blobs and CAS baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object .transport/agentqual001-v2/apply.py)" = "$APPLY_BLOB_SHA"
          test "$(git hash-object .transport/agentqual001-v2/harden.py)" = "$HARDEN_BLOB_SHA"
          test "$(git hash-object .transport/agentqual001-v2/testfix.py)" = "$TESTFIX_BLOB_SHA"
          test "$(git hash-object .transport/agentqual001-v2/tracefix.py)" = "$TRACEFIX_BLOB_SHA"
          test "$(git rev-parse "$BASE_SHA^{tree}")" = "$BASE_TREE"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE_SHA"
          test "$(git ls-remote origin "refs/heads/$FEATURE_BRANCH" | cut -f1)" = "$OLD_HEAD"
      - name: Build corrected exact candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/agentqual-v4 /tmp/agentqual-base-v4
          git worktree add --detach /tmp/agentqual-v4 "$BASE_SHA"
          python .transport/agentqual001-v2/apply.py /tmp/agentqual-v4
          python .transport/agentqual001-v2/harden.py /tmp/agentqual-v4
          python .transport/agentqual001-v2/testfix.py /tmp/agentqual-v4
          python .transport/agentqual001-v2/tracefix.py /tmp/agentqual-v4
          cd /tmp/agentqual-v4
          python .adwf/scripts/docs_freshness.py --write --reviewed-at 2026-08-16T20:30:00Z --valid-until 2026-11-16T20:30:00Z
          python .adwf/scripts/generate_manifest.py
          git diff --check
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "AGENTQUAL-001: qualify replaceable creative agent adapters"
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          echo "CANDIDATE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "CANDIDATE_TREE=$(git rev-parse HEAD^{tree})" >> "$GITHUB_ENV"
          git diff --binary "$BASE_SHA..HEAD" > /tmp/agentqual-v4.patch
          echo "PATCH_SHA256=$(sha256sum /tmp/agentqual-v4.patch | cut -d' ' -f1)" >> "$GITHUB_ENV"
      - name: Qualification focused suites
        shell: bash
        working-directory: /tmp/agentqual-v4
        run: |
          set -euo pipefail
          python -m compileall -q .adwf/lib .adwf/scripts .adwf/tests/test_creative_agent_qualification.py
          python .adwf/tests/test_creative_agent_qualification.py -q
          python .adwf/tests/test_ai_work_contracts.py -q
          python .adwf/tests/test_decision_traceability.py -q
      - name: Dynamic offline qualification
        shell: bash
        working-directory: /tmp/agentqual-v4
        run: |
          set -euo pipefail
          python .adwf/scripts/qualify_creative_agent.py --output /tmp/agentqual-v4-proof.json
          python - <<'PY'
          import json
          proof=json.load(open('/tmp/agentqual-v4-proof.json',encoding='utf-8'))
          assert proof['status']=='PASS', proof
          assert proof['network']=='NONE' and proof['secrets']=='FORBIDDEN', proof
          assert proof['filesystem']=='PACKAGE_SCOPED' and proof['monetary_budget_usd']==0, proof
          assert proof['low_trust_result'] is True and proof['real_external_agent_verified'] is False, proof
          PY
      - name: Exact PR structural command set
        shell: bash
        working-directory: /tmp/agentqual-v4
        run: |
          set -euo pipefail
          python .adwf/scripts/validate_framework.py
          python .adwf/scripts/validate_pipeline_ir.py
          python .adwf/adwf.py doctor --scope package_integrity
          python .adwf/adwf.py doctor --scope config_health
          python .adwf/adwf.py self-test
      - name: Exact BASE trust classification
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/agentqual-base-v4 "$BASE_SHA"
          BASE_SHA="$BASE_SHA" CANDIDATE_SHA="$CANDIDATE_SHA" python - <<'PY'
          import json, os, sys
          sys.path.insert(0, '/tmp/agentqual-base-v4/.adwf')
          from lib.trust import classify_git_diff
          result=classify_git_diff('/tmp/agentqual-v4', os.environ['BASE_SHA'], os.environ['CANDIDATE_SHA'])
          print(json.dumps(result,ensure_ascii=False,sort_keys=True))
          assert result.get('result')=='ALLOW', result
          assert result.get('authorization_mode')=='STANDING_OWNER_POLICY', result
          assert result.get('human_required') is False, result
          assert (result.get('manual_required_files') or [])==[], result
          assert (result.get('inspection_unverified_files') or [])==[], result
          assert (result.get('weakening') or [])==[], result
          assert (result.get('reason_codes') or [])==[], result
          PY
      - name: CAS replace feature candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE_SHA"
          test "$(git ls-remote origin "refs/heads/$FEATURE_BRANCH" | cut -f1)" = "$OLD_HEAD"
          git -C /tmp/agentqual-v4 push --force-with-lease="refs/heads/$FEATURE_BRANCH:$OLD_HEAD" origin "$CANDIDATE_SHA:refs/heads/$FEATURE_BRANCH"
      - name: Publish corrected exact-head qualification proof
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CANDIDATE_SHA="$CANDIDATE_SHA" CANDIDATE_TREE="$CANDIDATE_TREE" PATCH_SHA256="$PATCH_SHA256" python - <<'PY'
          import json, os, urllib.request
          proof=json.load(open('/tmp/agentqual-v4-proof.json',encoding='utf-8'))
          registry=json.load(open('/tmp/agentqual-v4/.adwf/creative-agent-adapters.json',encoding='utf-8'))
          payload={'name':'adwf/creative-agent-qualification-proof','head_sha':os.environ['CANDIDATE_SHA'],'status':'completed','conclusion':'success','output':{
            'title':'AGENTQUAL-001 corrected synthetic Creative Agent qualification — PASS',
            'summary':'PASS: exact corrected candidate passed offline qualification + full PR structural command set; no real external AI/agent provider is claimed.',
            'text':f"candidate_sha={os.environ['CANDIDATE_SHA']} tree={os.environ['CANDIDATE_TREE']} patch_sha256={os.environ['PATCH_SHA256']}\nadapter_id={proof['adapter_id']} adapter_digest={proof['adapter_digest']} registry_sha256={registry['registry_sha256']} report_sha256={proof['report_sha256']}\nnetwork=NONE secrets=FORBIDDEN filesystem=PACKAGE_SCOPED monetary_budget_usd=0\nlow_trust_result=true real_external_agent_verified=false capability_status=LIVE_NOT_VERIFIED\ntrace_owner_intent_binding=true authorization=STANDING_OWNER_POLICY weakening=[]"}}
          req=urllib.request.Request(f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/check-runs",data=json.dumps(payload).encode(),method='POST',headers={'Authorization':f"Bearer {os.environ['GITHUB_TOKEN']}",'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'})
          with urllib.request.urlopen(req,timeout=30) as response: created=json.load(response)
          print(json.dumps({'check_run_id':created.get('id'),'candidate_sha':os.environ['CANDIDATE_SHA'],'tree':os.environ['CANDIDATE_TREE'],'patch_sha256':os.environ['PATCH_SHA256']},sort_keys=True))
          PY
