name: MEGA_AUDIT_ADOPTION-001 Lease Release

on:
  push:
    branches:
      - helper/MEGA_AUDIT_ADOPTION-001-release-a2

permissions:
  contents: write
  actions: read
  checks: read
  pull-requests: read
  statuses: read

concurrency:
  group: adwf-control-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release-source-lease:
    if: github.ref == 'refs/heads/helper/MEGA_AUDIT_ADOPTION-001-release-a2'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 2

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12.10"

      - name: Release exact merged Mega Audit writer lease
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_MAIN: d61d5f83ec5afdfedfe628c7d385907a5ec90203
          EXPECTED_MAIN_TREE: 020793b53d4f0b91217035a59120692f979e97cc
          EXPECTED_MAIN_PARENT: 4cd9e6eaa8b36ddc1ec4476c51b77671a6fc5275
          EXPECTED_LEASE_REVISION: "15"
          SOURCE_ISSUE_ID: "20"
          SOURCE_ROADMAP_ID: MEGA_AUDIT_ADOPTION-001
          SOURCE_RUN_ID: mega-audit-adoption-001-release-a2
          SOURCE_LEASE_ID: 894b72a4-eba5-43bf-9713-ffcf602cdf82
          SOURCE_WORKER_ID: adwf-runtime:mega-audit-adoption-001-source-a4
          SOURCE_BRANCH: adwf/mega-audit-adoption-001-4829e3d594e9
          SOURCE_PR_NUMBER: "264"
          SOURCE_BASE_SHA: 4cd9e6eaa8b36ddc1ec4476c51b77671a6fc5275
          SOURCE_HEAD_SHA: d873d878788c7c4c28ab4b3fb8c57932b186a780
          EXPECTED_CANDIDATE_TREE: 020793b53d4f0b91217035a59120692f979e97cc
        shell: python
        run: |
          from pathlib import Path
          import json
          import os
          import re
          import sys

          root = Path.cwd()
          sys.path.insert(0, str(root / ".adwf"))

          from lib.assurance_builder import build_assurance_snapshot
          from lib.cost_guard import evaluate_provider
          from lib.github_lease_store import GitHubLeaseStore
          from lib.github_provider import GitHubClient
          from lib.github_rulesets import (
              verify_rulesets as verify_protected_rulesets,
              verify_runtime_anchor_ruleset,
          )
          from lib.health import doctor
          from lib.policy_runtime import evaluate_with_effective_policy
          from lib.strict_json import loads as strict_loads
          from lib.trusted_context import compile_trusted_context

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]
          expected_main = os.environ["EXPECTED_MAIN"]
          expected_main_tree = os.environ["EXPECTED_MAIN_TREE"]
          expected_main_parent = os.environ["EXPECTED_MAIN_PARENT"]
          expected_revision = int(os.environ["EXPECTED_LEASE_REVISION"])
          issue_id = os.environ["SOURCE_ISSUE_ID"]
          roadmap_id = os.environ["SOURCE_ROADMAP_ID"]
          run_id = os.environ["SOURCE_RUN_ID"]
          lease_id = os.environ["SOURCE_LEASE_ID"]
          worker_id = os.environ["SOURCE_WORKER_ID"]
          source_branch = os.environ["SOURCE_BRANCH"]
          source_pr_number = int(os.environ["SOURCE_PR_NUMBER"])
          source_base_sha = os.environ["SOURCE_BASE_SHA"]
          source_head_sha = os.environ["SOURCE_HEAD_SHA"]
          candidate_tree = os.environ["EXPECTED_CANDIDATE_TREE"]
          resources = [{"kind": "provider", "scope": "global", "shared": True, "global": True}]

          for value in (
              expected_main,
              expected_main_tree,
              expected_main_parent,
              source_base_sha,
              source_head_sha,
              candidate_tree,
          ):
              if not re.fullmatch(r"[0-9a-f]{40}", value):
                  raise SystemExit("LEASE_RELEASE_IDENTITY_CONFIGURATION_INVALID")

          cfg = strict_loads((root / ".adwf/config.json").read_text(encoding="utf-8"))
          policy = cfg.get("policy") or {}
          orch = cfg.get("orchestration") or {}
          cost = cfg.get("cost") or {}
          if (
              policy.get("fail_mode") != "CLOSED"
              or policy.get("active_autonomy") != "A2"
              or policy.get("max_autonomous_risk") != "R1"
          ):
              raise SystemExit("LEASE_RELEASE_POLICY_DRIFT")
          if orch.get("max_parallel_writers") != 1:
              raise SystemExit("LEASE_RELEASE_WRITER_CEILING_DRIFT")
          if cost.get("mode") != "FREE_ONLY" or cost.get("monetary_budget") != 0:
              raise SystemExit("LEASE_RELEASE_COST_POLICY_DRIFT")

          client = GitHubClient(repo, token)
          lease_store = GitHubLeaseStore(client)

          def current_main():
              value = str((client.branch("main").get("commit") or {}).get("sha") or "")
              if not re.fullmatch(r"[0-9a-f]{40}", value):
                  raise SystemExit("LEASE_RELEASE_MAIN_SHA_INVALID")
              return value

          def verify_live_rulesets():
              rows = client.rulesets()
              protected = verify_protected_rulesets(rows, expected_integration_id=15368)
              anchors = verify_runtime_anchor_ruleset(rows)
              if protected.get("readback_verified") is not True:
                  raise SystemExit(
                      "LEASE_RELEASE_PROTECTED_MAIN_RULESET_NOT_VERIFIED:"
                      + ",".join(protected.get("reason_codes") or [])
                  )
              if anchors.get("readback_verified") is not True:
                  raise SystemExit(
                      "LEASE_RELEASE_RUNTIME_ANCHOR_RULESET_NOT_VERIFIED:"
                      + ",".join(anchors.get("reason_codes") or [])
                  )
              named = {str(x.get("name") or ""): x for x in rows}
              for name in ("ADWF protected main", "ADWF immutable runtime anchors"):
                  rs = named.get(name) or {}
                  if rs.get("enforcement") != "active" or (rs.get("bypass_actors") or []) != []:
                      raise SystemExit("LEASE_RELEASE_RULESET_GOVERNANCE_DRIFT:" + name)
                  if rs.get("current_user_can_bypass") not in (None, "never", False):
                      raise SystemExit("LEASE_RELEASE_RULESET_BYPASS_DRIFT:" + name)
              protected_named = named.get("ADWF protected main") or {}
              required = []
              strict = False
              for rule in protected_named.get("rules") or []:
                  if rule.get("type") == "required_status_checks":
                      params = rule.get("parameters") or {}
                      strict = params.get("strict_required_status_checks_policy") is True
                      required = params.get("required_status_checks") or []
              normalized = sorted(
                  (x.get("context"), x.get("integration_id")) for x in required
              )
              expected = sorted(
                  [
                      ("fast-feedback", 15368),
                      ("adwf/governance-gate", 15368),
                      ("adwf/trusted-gate", 15368),
                  ]
              )
              if not strict or normalized != expected:
                  raise SystemExit(
                      "LEASE_RELEASE_REQUIRED_CHECK_RULESET_DRIFT:"
                      + json.dumps(normalized)
                  )

          def authorize_cleanup(subject_sha):
              if current_main() != subject_sha:
                  raise SystemExit("LEASE_RELEASE_AUTH_SUBJECT_MAIN_DRIFT")
              repository = client.repo_info()
              if (
                  repository.get("private") is not False
                  or str(repository.get("default_branch") or "") != "main"
              ):
                  raise SystemExit("LEASE_RELEASE_REPOSITORY_PROFILE_DRIFT")
              verify_live_rulesets()
              if current_main() != subject_sha:
                  raise SystemExit("LEASE_RELEASE_AUTH_POST_RULESET_MAIN_DRIFT")

              provider_registry = strict_loads(
                  (root / ".adwf/providers.json").read_text(encoding="utf-8")
              )
              capability = str(cost.get("default_ci_capability") or "")
              cost_decision = evaluate_provider(
                  provider_registry,
                  {
                      "provider": capability,
                      "mandatory_ci": True,
                      "automated": True,
                      "projected_cost": 0,
                      "projected_units": 0,
                      "repository_visibility": "PUBLIC",
                      "runner_class": "standard",
                  },
                  canonical_provider="github",
              )
              if (
                  cost_decision.get("result") != "ALLOW"
                  or float(cost_decision.get("projected_cost_usd") or 0) != 0
              ):
                  raise SystemExit(
                      "LEASE_RELEASE_PROVIDER_COST_NOT_VERIFIED:"
                      + ",".join(cost_decision.get("reason_codes") or [])
                  )

              health_now = doctor(root)
              categories = health_now.get("categories") or {}
              health_map = {
                  "package_integrity": str(
                      (categories.get("package_integrity") or {}).get("status")
                      or "NOT_VERIFIED"
                  ),
                  "config_health": str(
                      (categories.get("config_health") or {}).get("status")
                      or "NOT_VERIFIED"
                  ),
                  "control_plane_health": "HEALTHY",
                  "product_health": "NOT_VERIFIED",
              }
              provider_readback = {
                  "provider": "github",
                  "subject_sha": subject_sha,
                  "repository_visibility": "PUBLIC",
                  "runner": "NOT_VERIFIED",
                  "larger_runner": False,
                  "facts_readback_verified": True,
                  "readback_verified": True,
                  "purpose": "MEGA_AUDIT_SOURCE_LEASE_RELEASE",
              }
              assurance = build_assurance_snapshot(
                  root,
                  subject_sha=subject_sha,
                  health=health_map,
                  gates={},
                  required_gates=[],
                  evidence_records=[],
                  evidence_refs=[],
                  provider_readback=provider_readback,
                  cost=cost_decision,
                  ttl_minutes=5,
              )
              context = compile_trusted_context(
                  root,
                  action="cleanup",
                  risk="R1",
                  work_type="recovery",
                  request={
                      "request_id": f"{run_id}:cleanup:{subject_sha}",
                      "subject_sha": subject_sha,
                      "preview_digest": None,
                  },
                  assurance_snapshot=assurance,
                  provider_readback=provider_readback,
              )
              decision = evaluate_with_effective_policy(root, context)
              if decision.result != "ALLOW":
                  raise SystemExit(
                      "LEASE_RELEASE_POLICY_NOT_ALLOW:"
                      + decision.result
                      + ":"
                      + ",".join(decision.reason_codes)
                  )
              if current_main() != subject_sha:
                  raise SystemExit("LEASE_RELEASE_AUTH_FINAL_MAIN_DRIFT")
              print("POLICY_CLEANUP=ALLOW")

          if current_main() != expected_main:
              raise SystemExit("LEASE_RELEASE_MAIN_DRIFT")

          main_commit = client.get(f"/repos/{repo}/git/commits/{expected_main}")
          if str((main_commit.get("tree") or {}).get("sha") or "") != expected_main_tree:
              raise SystemExit("LEASE_RELEASE_MAIN_TREE_DRIFT")
          main_parents = [
              str((x or {}).get("sha") or "") for x in (main_commit.get("parents") or [])
          ]
          if main_parents != [expected_main_parent]:
              raise SystemExit("LEASE_RELEASE_MAIN_PARENT_DRIFT")

          verify_live_rulesets()

          registry, registry_anchor = lease_store.read(
              expected_main_sha=expected_main,
              policy_max_parallel_writers=1,
          )
          if registry.get("revision") != expected_revision:
              raise SystemExit(
                  "LEASE_RELEASE_REGISTRY_REVISION_DRIFT:"
                  + str(registry.get("revision"))
              )
          active = [
              x for x in registry.get("leases") or [] if x.get("status") == "ACTIVE"
          ]
          exact = [x for x in active if x.get("lease_id") == lease_id]
          if len(active) != 1 or len(exact) != 1:
              raise SystemExit("LEASE_RELEASE_ACTIVE_LEASE_CONFLICT")
          lease = exact[0]
          expected_binding = {
              "issue_id": issue_id,
              "roadmap_id": roadmap_id,
              "worker_id": worker_id,
              "base_sha": source_base_sha,
              "branch": source_branch,
              "resources": resources,
          }
          for key, value in expected_binding.items():
              if lease.get(key) != value:
                  raise SystemExit("LEASE_RELEASE_BINDING_DRIFT:" + key)

          pr = client.get(f"/repos/{repo}/pulls/{source_pr_number}")
          base = pr.get("base") or {}
          head = pr.get("head") or {}
          if (
              pr.get("state") != "closed"
              or not pr.get("merged_at")
              or base.get("ref") != "main"
              or str(base.get("sha") or "") != source_base_sha
              or str(head.get("ref") or "") != source_branch
              or str(head.get("sha") or "") != source_head_sha
              or str(pr.get("merge_commit_sha") or "") != expected_main
          ):
              raise SystemExit("LEASE_RELEASE_PR_IDENTITY_DRIFT")

          expected_paths = sorted(
              [
                  "AUDITS/ADWF_MEGA_AUDIT_2026-08-22.md",
                  "AUDITS/README.md",
                  "AUDITS/audit-history.json",
              ]
          )
          actual_paths = sorted(
              str(x.get("filename") or "")
              for x in client.pull_files(source_pr_number)
          )
          if actual_paths != expected_paths:
              raise SystemExit(
                  "LEASE_RELEASE_PR_SCOPE_DRIFT:" + json.dumps(actual_paths)
              )

          head_commit = client.get(f"/repos/{repo}/git/commits/{source_head_sha}")
          if str((head_commit.get("tree") or {}).get("sha") or "") != candidate_tree:
              raise SystemExit("LEASE_RELEASE_CANDIDATE_TREE_DRIFT")
          if str((main_commit.get("tree") or {}).get("sha") or "") != candidate_tree:
              raise SystemExit("LEASE_RELEASE_DELIVERY_TREE_DRIFT")

          postmerge = {}
          for run in client.recent_runs(limit=100):
              if (
                  run.get("head_sha") != expected_main
                  or run.get("status") != "completed"
                  or run.get("conclusion") != "success"
              ):
                  continue
              name = str(run.get("name") or "")
              if name in {"ADWF Main", "ADWF Platform Smoke"}:
                  postmerge.setdefault(name, run)
          if "ADWF Main" not in postmerge:
              raise SystemExit("LEASE_RELEASE_POSTMERGE_MAIN_EVIDENCE_MISSING")
          if "ADWF Platform Smoke" not in postmerge:
              smoke_workflow = client.get(
                  f"/repos/{repo}/contents/.github/workflows/adwf-platform-smoke.yml"
                  f"?ref={expected_main}"
              )
              if str(smoke_workflow.get("sha") or "") != "d80c060f3833cd92ac645b99216129889b0fb787":
                  raise SystemExit("LEASE_RELEASE_PLATFORM_SMOKE_TRIGGER_IDENTITY_DRIFT")
              if actual_paths != expected_paths:
                  raise SystemExit("LEASE_RELEASE_PLATFORM_SMOKE_NA_SCOPE_DRIFT")
              print("PLATFORM_SMOKE=NOT_APPLICABLE_BY_CANONICAL_PATH_FILTER")
          else:
              print("PLATFORM_SMOKE=SUCCESS")

          authorize_cleanup(expected_main)

          reconciliation_ref = "github:commit:" + expected_main
          released, release_anchor = lease_store.release(
              expected_main_sha=expected_main,
              policy_max_parallel_writers=1,
              lease_id=lease_id,
              worker_id=worker_id,
              provider_reconciled=True,
              provider_reconciliation_ref=reconciliation_ref,
          )
          final_registry, final_anchor = lease_store.read(
              expected_main_sha=expected_main,
              policy_max_parallel_writers=1,
          )
          if (
              released.get("revision") != expected_revision + 1
              or final_registry.get("revision") != expected_revision + 1
              or final_anchor != release_anchor
          ):
              raise SystemExit("LEASE_RELEASE_REVISION_READBACK_MISMATCH")
          if any(
              x.get("status") == "ACTIVE"
              for x in final_registry.get("leases") or []
          ):
              raise SystemExit("LEASE_RELEASE_ACTIVE_WRITER_REMAINS")
          target = [
              x
              for x in final_registry.get("leases") or []
              if x.get("lease_id") == lease_id
          ]
          if (
              len(target) != 1
              or target[0].get("status") != "RELEASED"
              or target[0].get("provider_reconciliation_ref") != reconciliation_ref
          ):
              raise SystemExit("LEASE_RELEASE_TARGET_READBACK_MISMATCH")
          if current_main() != expected_main:
              raise SystemExit("LEASE_RELEASE_FINAL_MAIN_DRIFT")

          print("MEGA_AUDIT_SOURCE_LEASE_RELEASE=PASS")
          print("LEASE_REGISTRY_REVISION=" + str(final_registry["revision"]))
          print("LEASE_ANCHOR=" + str(final_anchor))
          print("MAIN_SHA=" + expected_main)
