name: SESSION_TRUTH Materializer

on:
  push:
    branches:
      - helper/session-truth-001-materialize

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: "1"
  ADWF_EXACT_BASE: "43d0774325d4f2f37ec5e71add1d1acacd82a23f"

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 2
          ref: helper/session-truth-001-materialize
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12.10"
      - name: Fail closed on helper provenance
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$ADWF_EXACT_BASE"
          test "$(git diff --name-only "$ADWF_EXACT_BASE" HEAD)" = ".github/workflows/session-truth-materialize.yml"
          rm .github/workflows/session-truth-materialize.yml
      - name: Reconcile canonical Roadmap and Capability Truth
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json

          root = Path('.')
          roadmap_path = root / '.adwf/roadmap.json'
          capability_path = root / '.adwf/capability-traceability.json'

          roadmap = json.loads(roadmap_path.read_text(encoding='utf-8'))
          all_tasks = [task for goal in roadmap['goals'] for task in goal['tasks']]
          ids = [task['roadmap_id'] for task in all_tasks]
          if len(ids) != len(set(ids)):
              raise SystemExit('DUPLICATE_ROADMAP_ID_BEFORE_RECONCILIATION')
          if 'SESSION_CONTINUITY-001' in ids:
              raise SystemExit('SESSION_CONTINUITY_ALREADY_MATERIALIZED')
          foundation = next(goal for goal in roadmap['goals'] if goal['id'] == 'FOUNDATION-ENGINEERING-OS')
          if foundation['tasks'][-1]['roadmap_id'] != 'CONSUMER_INSTR-001':
              raise SystemExit('UNEXPECTED_ROADMAP_TAIL')
          foundation['tasks'].append({
              'roadmap_id': 'SESSION_CONTINUITY-001',
              'title_ru': 'Generic Durable AI Session Handover & Resume — live proof completion',
              'dependencies': ['CONSUMER_INSTR-001'],
              'product_impact': False,
          })
          roadmap_path.write_text(json.dumps(roadmap, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          truth = json.loads(capability_path.read_text(encoding='utf-8'))
          existing = {item['id'] for item in truth['capabilities']}
          wanted = {
              'CONSUMER_TRUSTED_CONTROL_ROUTING',
              'CONSUMER_INSTRUCTION_CONTRACT',
              'SESSION_CONTINUITY',
          }
          collision = sorted(existing & wanted)
          if collision:
              raise SystemExit('CAPABILITY_ALREADY_PRESENT:' + ','.join(collision))

          entries = [
              {
                  'id': 'CONSUMER_TRUSTED_CONTROL_ROUTING',
                  'status': 'LIVE_NOT_VERIFIED',
                  'execution_mode': 'CORE',
                  'owner_claim_ru': 'ADWF trusted controller различает self-host и connected-consumer control path: consumer получает только read-only observer/control routing, а privileged self-host mutation stages не наследуются автоматически.',
                  'entrypoints': ['.github/workflows/adwf-control.yml'],
                  'production_paths': [
                      '.adwf/lib/consumer_ci.py',
                      '.adwf/scripts/consumer_ci.py',
                      '.adwf/scripts/generate_pipeline.py',
                      '.github/workflows/adwf-control.yml',
                  ],
                  'verification': ['.adwf/tests/test_consumer_ci.py'],
                  'live_boundary': 'LIVE_VERIFIED требует downstream installed-consumer provider proof на exact consumer SHA: control route должен разрешиться в read-only consumer observer, privileged self-host stages должны быть skipped, а provider readback обязан подтвердить отсутствие mutation authority. Self-host CI и deterministic fixtures доказывают implementation, но не live consumer truth.',
                  'live_evidence': [],
              },
              {
                  'id': 'CONSUMER_INSTRUCTION_CONTRACT',
                  'status': 'LIVE_NOT_VERIFIED',
                  'execution_mode': 'CORE',
                  'owner_claim_ru': 'ADWF доставляет connected consumer layered instruction contract как FRAMEWORK_CORE + consumer-owned invariants + fresh provider/runtime state, не записывая volatile writer/task/SHA в root router и не создавая второй Roadmap authority.',
                  'entrypoints': ['.adwf/lib/consumer_instructions.py'],
                  'production_paths': [
                      '.adwf/lib/consumer_instructions.py',
                      '.adwf/consumer-instruction-policy.json',
                      '.adwf/schemas/consumer-instruction-policy.schema.json',
                      '.adwf/instructions/CORE.md',
                  ],
                  'verification': [
                      '.adwf/tests/test_consumer_instructions.py',
                      '.adwf/tests/test_consumer_instruction_upgrade_transaction.py',
                  ],
                  'live_boundary': 'LIVE_VERIFIED требует real connected-consumer upgrade/fresh-session proof: framework instruction layer должен обновиться автоматически, consumer-owned invariants/router сохраниться, а fresh executor обязан восстановить effective contract из provider truth без chat-memory authority. Unit/CI и self-host merge подтверждают implementation, но не downstream live delivery.',
                  'live_evidence': [],
              },
              {
                  'id': 'SESSION_CONTINUITY',
                  'status': 'LIVE_NOT_VERIFIED',
                  'execution_mode': 'CORE',
                  'owner_claim_ru': 'ADWF предоставляет provider-neutral WORK_UNTIL_NATURAL_BOUNDARY, public-safe durable SessionContinuityCheckpoint, provider-durable Runtime Ledger readback/reconciliation и Project Pack continuity binding без превращения checkpoint или chat/session memory в work authority.',
                  'entrypoints': ['.adwf/scripts/github_runtime_sync.py'],
                  'production_paths': [
                      '.adwf/lib/session_continuity.py',
                      '.adwf/lib/github_runtime_store.py',
                      '.adwf/lib/session_consumer_proof.py',
                      '.adwf/schemas/session-continuity-checkpoint.schema.json',
                      '.adwf/instructions/CORE.md',
                      '.adwf/lib/project_packs.py',
                  ],
                  'verification': [
                      '.adwf/tests/test_session_continuity.py',
                      '.adwf/tests/test_session_continuity_persistence.py',
                      '.adwf/tests/test_session_delivery.py',
                      '.adwf/tests/test_session_consumer_proof.py',
                  ],
                  'live_boundary': 'LIVE_NOT_VERIFIED: SESSION_CORE/PERSIST/DELIVERY/CONSUMER_PROOF implementation, exact-head gates and self-host provider resume evidence существуют, но #139 дополнительно требует independently evidenced handover между двумя executor sessions и real connected-consumer proof без duplicate writer или stale mutation. До этих downstream proofs LIVE_VERIFIED запрещён.',
                  'live_evidence': [],
              },
          ]

          for entry in entries:
              for rel in entry['entrypoints'] + entry['production_paths'] + entry['verification']:
                  if not (root / rel).is_file():
                      raise SystemExit(f'MISSING_DECLARED_PATH:{entry["id"]}:{rel}')
          truth['capabilities'].extend(entries)
          capability_path.write_text(json.dumps(truth, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Canonical generated projections
        shell: bash
        run: |
          set -euo pipefail
          python .adwf/scripts/docs_freshness.py --write --reviewed-at 2026-08-17T21:21:00Z --valid-until 2026-11-17T21:21:00Z
          python .adwf/scripts/generate_manifest.py
      - name: Verify truth and framework
        shell: bash
        run: |
          set -euo pipefail
          python .adwf/scripts/validate_capabilities.py
          python .adwf/scripts/validate_framework.py
          python .adwf/scripts/validate_docs.py
          python .adwf/scripts/generate_manifest.py --check
          python -m unittest discover -s .adwf/tests -p 'test_roadmap_truth.py'
          python -m unittest discover -s .adwf/tests -p 'test_consumer_ci.py'
          python -m unittest discover -s .adwf/tests -p 'test_consumer_instructions.py'
          python -m unittest discover -s .adwf/tests -p 'test_session_*.py'
          python .adwf/adwf.py self-test
      - name: Enforce bounded final tree
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          expected = {
              '.adwf/capability-traceability.json',
              '.adwf/docs-registry.json',
              '.adwf/roadmap.json',
              'MANIFEST.json',
              'SHA256SUMS.txt',
          }
          actual = set(subprocess.check_output(['git','diff','--name-only', '43d0774325d4f2f37ec5e71add1d1acacd82a23f'], text=True).splitlines())
          if actual != expected:
              raise SystemExit('UNEXPECTED_FINAL_DIFF:' + ','.join(sorted(actual)))
          PY
      - name: Commit canonical result and self-clean
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m '[SESSION_TRUTH-001] Reconcile Roadmap and Capability Truth'
          git push origin HEAD:helper/session-truth-001-materialize
