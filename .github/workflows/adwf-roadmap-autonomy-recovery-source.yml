name: ROADMAP_AUTONOMY-001 Recovery + Source Authority

on:
  push:
    branches:
      - helper/ROADMAP_AUTONOMY-001-recovery-source-a1
    paths:
      - .adwf-recovery-trigger-roadmap-autonomy-source-a1

permissions:
  contents: write
  actions: read
  checks: read
  issues: read
  pull-requests: read
  statuses: read

concurrency:
  group: adwf-control-${{ github.repository }}
  cancel-in-progress: false

jobs:
  recover-and-claim:
    if: github.ref == 'refs/heads/helper/ROADMAP_AUTONOMY-001-recovery-source-a1'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12.10"
      - name: Recover terminal registry and claim Roadmap source authority
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: python
        run: |
          from pathlib import Path
          import base64, hashlib, os, re, sys
          root = Path.cwd()
          sys.path.insert(0, str(root / ".adwf"))

          from lib.assurance_builder import build_assurance_snapshot
          from lib.cost_guard import evaluate_provider
          from lib.github_lease_store import GitHubLeaseStore
          from lib.github_provider import GitHubClient
          from lib.github_rulesets import verify_rulesets, verify_runtime_anchor_ruleset
          from lib.health import doctor
          from lib.policy_runtime import evaluate_with_effective_policy
          from lib.provider_contracts import ProviderContractError
          from lib.strict_json import loads as strict_loads
          from lib.trusted_context import compile_trusted_context

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]
          expected_main = "d61d5f83ec5afdfedfe628c7d385907a5ec90203"
          expected_revision = 16
          incident_comment_id = 5381303507
          old_lease_id = "894b72a4-eba5-43bf-9713-ffcf602cdf82"
          guard_lease_id = "a46aa2fc-0d3f-43d3-b958-cf09a0c11566"
          new_lease_id = "66d7dc09-6ad8-40d7-8d62-a9d90f5891b2"
          new_branch = "adwf/roadmap-autonomy-001-a1"
          trigger_path = ".adwf-recovery-trigger-roadmap-autonomy-source-a1"
          trigger_blob = "c3313195d822f32c8c035cd14181da45b54883ed"
          trigger_sha256 = "1b6b1fe347e5c75ae4fbb07b3b84764f5924403c30a10f1a5ab8b37fe8c872b4"
          resources = [{"kind":"provider","scope":"global","shared":True,"global":True}]

          cfg = strict_loads((root / ".adwf/config.json").read_text(encoding="utf-8"))
          policy = cfg.get("policy") or {}
          orch = cfg.get("orchestration") or {}
          cost = cfg.get("cost") or {}
          if policy.get("fail_mode") != "CLOSED" or policy.get("active_autonomy") != "A2" or policy.get("max_autonomous_risk") != "R1":
              raise SystemExit("RECOVERY_POLICY_DRIFT")
          if orch.get("max_parallel_writers") != 1 or cost.get("mode") != "FREE_ONLY" or cost.get("monetary_budget") != 0:
              raise SystemExit("RECOVERY_GOVERNANCE_DRIFT")

          client = GitHubClient(repo, token)
          store = GitHubLeaseStore(client)

          def current_main():
              value = str((client.branch("main").get("commit") or {}).get("sha") or "")
              if re.fullmatch(r"[0-9a-f]{40}", value) is None:
                  raise SystemExit("RECOVERY_MAIN_INVALID")
              return value

          def verify_rules():
              rows = client.rulesets()
              if verify_rulesets(rows, expected_integration_id=15368).get("readback_verified") is not True:
                  raise SystemExit("RECOVERY_MAIN_RULESET_NOT_VERIFIED")
              if verify_runtime_anchor_ruleset(rows).get("readback_verified") is not True:
                  raise SystemExit("RECOVERY_ANCHOR_RULESET_NOT_VERIFIED")
              named = {str(x.get("name") or ""): x for x in rows}
              for name in ("ADWF protected main", "ADWF immutable runtime anchors"):
                  rs = named.get(name) or {}
                  if rs.get("enforcement") != "active" or (rs.get("bypass_actors") or []) != []:
                      raise SystemExit("RECOVERY_RULESET_DRIFT:" + name)
                  if rs.get("current_user_can_bypass") not in (None, "never", False):
                      raise SystemExit("RECOVERY_BYPASS_DRIFT:" + name)

          def authorize(action):
              provider_registry = strict_loads((root / ".adwf/providers.json").read_text(encoding="utf-8"))
              capability = str(cost.get("default_ci_capability") or "")
              cost_decision = evaluate_provider(provider_registry, {
                  "provider": capability, "mandatory_ci": True, "automated": True,
                  "projected_cost": 0, "projected_units": 0,
                  "repository_visibility": "PUBLIC", "runner_class": "standard",
              }, canonical_provider="github")
              if cost_decision.get("result") != "ALLOW" or float(cost_decision.get("projected_cost_usd") or 0) != 0:
                  raise SystemExit("RECOVERY_COST_NOT_ALLOWED")
              categories = (doctor(root).get("categories") or {})
              assurance = build_assurance_snapshot(
                  root, subject_sha=expected_main,
                  health={
                      "package_integrity": str((categories.get("package_integrity") or {}).get("status") or "NOT_VERIFIED"),
                      "config_health": str((categories.get("config_health") or {}).get("status") or "NOT_VERIFIED"),
                      "control_plane_health": "HEALTHY",
                      "product_health": "NOT_VERIFIED",
                  },
                  gates={}, required_gates=[], evidence_records=[], evidence_refs=[],
                  provider_readback={
                      "provider":"github","subject_sha":expected_main,"repository_visibility":"PUBLIC",
                      "runner":"NOT_VERIFIED","larger_runner":False,"facts_readback_verified":True,
                      "readback_verified":True,"purpose":"ROADMAP_AUTONOMY_RECOVERY_" + action.upper(),
                  },
                  cost=cost_decision, ttl_minutes=5,
              )
              context = compile_trusted_context(
                  root, action=action, risk="R1", work_type="recovery",
                  request={"request_id":"roadmap-autonomy-001:" + action + ":" + expected_main,
                           "subject_sha":expected_main,"preview_digest":None},
                  assurance_snapshot=assurance,
                  provider_readback=assurance["provider"],
              )
              decision = evaluate_with_effective_policy(root, context)
              if decision.result != "ALLOW":
                  raise SystemExit("RECOVERY_POLICY_NOT_ALLOW:" + decision.result + ":" + ",".join(decision.reason_codes))

          if current_main() != expected_main:
              raise SystemExit("RECOVERY_MAIN_DRIFT")
          verify_rules()

          trigger = client.get(f"/repos/{repo}/contents/{trigger_path}?ref={os.environ['GITHUB_SHA']}")
          if str(trigger.get("sha") or "") != trigger_blob:
              raise SystemExit("RECOVERY_TRIGGER_BLOB_DRIFT")
          if hashlib.sha256(base64.b64decode(str(trigger.get("content") or ""))).hexdigest() != trigger_sha256:
              raise SystemExit("RECOVERY_TRIGGER_DIGEST_DRIFT")

          issue = client.get(f"/repos/{repo}/issues/265")
          if issue.get("state") != "open" or "ROADMAP_AUTONOMY-001" not in str(issue.get("title") or ""):
              raise SystemExit("RECOVERY_ISSUE_DRIFT")
          if [p for p in client.pulls() if p.get("state") == "open"]:
              raise SystemExit("RECOVERY_OPEN_PR_CONFLICT")
          try:
              client.git_ref(new_branch)
              raise SystemExit("RECOVERY_SOURCE_BRANCH_EXISTS")
          except ProviderContractError as exc:
              if str(exc) != "PROVIDER_HTTP_404":
                  raise

          incident = client.get(f"/repos/{repo}/issues/comments/{incident_comment_id}")
          body = str(incident.get("body") or "")
          for fragment in ("c4dbe1fa3c26fcc9ef11bd342b1da8b0fa72b813",
                           "a8bb05ad7be4bc91fbc327cea81a0879acd47a15",
                           "38db1b61369a638f76ad9a027a9f69eb5db3655e",
                           "MUST NOT be converted into an authorization claim"):
              if fragment not in body:
                  raise SystemExit("RECOVERY_INCIDENT_EVIDENCE_DRIFT")

          registry, anchor16 = store.read(expected_main_sha=expected_main, policy_max_parallel_writers=1)
          if registry.get("revision") != expected_revision or registry.get("observed_main_sha") != expected_main:
              raise SystemExit("RECOVERY_REVISION16_DRIFT")
          if any(x.get("status") == "ACTIVE" for x in registry.get("leases") or []):
              raise SystemExit("RECOVERY_ACTIVE_WRITER_PRESENT")
          old = [x for x in registry.get("leases") or [] if x.get("lease_id") == old_lease_id]
          if len(old) != 1 or old[0].get("status") != "RELEASED" or old[0].get("provider_reconciliation_ref") != "github:commit:" + expected_main:
              raise SystemExit("RECOVERY_OLD_LEASE_NOT_TERMINAL")

          authorize("claim")
          state17, guard, anchor17 = store.acquire(
              expected_main_sha=expected_main, policy_max_parallel_writers=1,
              issue_id="265", roadmap_id="ROADMAP_AUTONOMY-001",
              worker_id="adwf-runtime:roadmap-autonomy-001-recovery-a1",
              base_sha=expected_main, branch="adwf/roadmap-autonomy-001-recovery-guard-a1",
              resources=resources, ttl_minutes=15, lease_id=guard_lease_id,
          )
          if state17.get("revision") != 17 or guard.get("status") != "ACTIVE":
              raise SystemExit("RECOVERY_GUARD_ACQUIRE_FAILED")

          authorize("cleanup")
          state18, anchor18 = store.release(
              expected_main_sha=expected_main, policy_max_parallel_writers=1,
              lease_id=guard_lease_id, worker_id="adwf-runtime:roadmap-autonomy-001-recovery-a1",
              provider_reconciled=True,
              provider_reconciliation_ref="github:issue:20:comment:5381303507:lease-revision:16",
          )
          if state18.get("revision") != 18:
              raise SystemExit("RECOVERY_GUARD_RELEASE_FAILED")

          authorize("claim")
          state19, lease, anchor19 = store.acquire(
              expected_main_sha=expected_main, policy_max_parallel_writers=1,
              issue_id="265", roadmap_id="ROADMAP_AUTONOMY-001",
              worker_id="adwf-runtime:roadmap-autonomy-001-source-a1",
              base_sha=expected_main, branch=new_branch, resources=resources,
              ttl_minutes=120, lease_id=new_lease_id,
          )
          final, final_anchor = store.read(expected_main_sha=expected_main, policy_max_parallel_writers=1)
          active = [x for x in final.get("leases") or [] if x.get("status") == "ACTIVE"]
          if state19.get("revision") != 19 or len(active) != 1 or active[0].get("lease_id") != new_lease_id or final_anchor != anchor19:
              raise SystemExit("RECOVERY_SOURCE_AUTHORITY_READBACK_FAILED")
          if current_main() != expected_main:
              raise SystemExit("RECOVERY_FINAL_MAIN_DRIFT")

          print("ROADMAP_AUTONOMY_RECOVERY_SOURCE=PASS")
          print("FINAL_REVISION=19")
          print("SOURCE_LEASE_ID=" + new_lease_id)
          print("SOURCE_BRANCH=" + new_branch)
          print("MAIN_SHA=" + expected_main)
