name: ADWF Provider Readback Diagnostic

on:
  push:
    branches:
      - agent/local-mirror-provider-incident-20260817-a1

permissions:
  contents: read
  pull-requests: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Compare PR-files and exact Git tree readback
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE_SHA: a41a366fc940ebc96f8d58cf8a83ea7fdaaf2416
          HEAD_SHA: 9028935f99155303347322099509804188073a58
        shell: python
        run: |
          import json, os, time, urllib.error, urllib.request
          token=os.environ['GITHUB_TOKEN']; repo=os.environ['REPO']; base=os.environ['BASE_SHA']; head=os.environ['HEAD_SHA']
          headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'adwf-provider-diagnostic'}
          def get(path):
              req=urllib.request.Request('https://api.github.com'+path,headers=headers)
              started=time.monotonic()
              try:
                  with urllib.request.urlopen(req,timeout=20) as response:
                      body=json.loads(response.read().decode()); return response.status,round(time.monotonic()-started,3),body
              except urllib.error.HTTPError as exc:
                  return exc.code,round(time.monotonic()-started,3),json.loads(exc.read().decode() or '{}')
              except Exception as exc:
                  return type(exc).__name__,round(time.monotonic()-started,3),{}
          for pr in (124,126):
              status,elapsed,body=get(f'/repos/{repo}/pulls/{pr}/files?per_page=100')
              print(json.dumps({'endpoint':'pull_files','pr':pr,'status':status,'elapsed_s':elapsed,'count':len(body) if isinstance(body,list) else None,'message':body.get('message') if isinstance(body,dict) else None}))
          commits={}
          for label,sha in [('base',base),('head',head)]:
              status,elapsed,body=get(f'/repos/{repo}/git/commits/{sha}')
              tree=((body.get('tree') or {}).get('sha')) if isinstance(body,dict) else None
              print(json.dumps({'endpoint':'git_commit','label':label,'status':status,'elapsed_s':elapsed,'sha':body.get('sha') if isinstance(body,dict) else None,'tree':tree}))
              if status!=200 or not tree: raise SystemExit(2)
              commits[label]=tree
          trees={}
          for label,tree in commits.items():
              status,elapsed,body=get(f'/repos/{repo}/git/trees/{tree}?recursive=1')
              entries=body.get('tree') if isinstance(body,dict) else None
              print(json.dumps({'endpoint':'git_tree','label':label,'status':status,'elapsed_s':elapsed,'tree':body.get('sha') if isinstance(body,dict) else None,'truncated':body.get('truncated') if isinstance(body,dict) else None,'entries':len(entries) if isinstance(entries,list) else None}))
              if status!=200 or body.get('sha')!=tree or body.get('truncated') is not False or not isinstance(entries,list): raise SystemExit(3)
              trees[label]={x['path']:(x.get('type'),x.get('mode'),x.get('sha')) for x in entries if x.get('type')!='tree'}
          changed=sorted(path for path in set(trees['base'])|set(trees['head']) if trees['base'].get(path)!=trees['head'].get(path))
          print(json.dumps({'endpoint':'exact_tree_diff','count':len(changed),'paths':changed},sort_keys=True))
          if len(changed)!=12: raise SystemExit(4)
