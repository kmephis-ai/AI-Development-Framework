name: ADWF EDGEREF-001 Exact Transport Repair V2

on:
  push:
    branches:
      - agent/materialize-edgeref001-81da2e96

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: agent/materialize-edgeref001-81da2e96
          fetch-depth: 1
      - name: Repair localized interval if needed
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          path = Path('.transport/edgeref001/chunk.000')
          remote = path.read_text(encoding='utf-8')
          target = '355bc238155fcaa8033a75f22e8e006bd1eb6678a612379160e4270174c22ac6'
          if len(remote) == 18000:
              digest = hashlib.sha256(remote.encode()).hexdigest()
              assert digest == target, digest
              print('ALREADY_REPAIRED=' + digest)
              raise SystemExit(0)
          assert len(remote) == 17999, len(remote)
          assert hashlib.sha256(remote.encode()).hexdigest() == 'f0c931a8d84ac7202eebb723d2529452fe6eadf09fbca9904468cdd7b25ce8dd'
          segment = ''
          assert len(segment) == 512
          repaired = remote[:1536] + segment + remote[2047:]
          assert len(repaired) == 18000
          digest = hashlib.sha256(repaired.encode()).hexdigest()
          assert digest == target, digest
          path.write_text(repaired, encoding='utf-8')
          print('REPAIRED=' + digest)
          PY
          if git diff --quiet -- .transport/edgeref001/chunk.000; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .transport/edgeref001/chunk.000
          git commit -m "EDGEREF-001: repair exact transport byte"
          git push origin HEAD:agent/materialize-edgeref001-81da2e96
