name: Materialize CONSUMER_GATE-001

on:
  push:
    branches:
      - agent/materialize-consumer-gate-001-20260817-a1

permissions:
  contents: write

env:
  BASE_SHA: 320531f5b18d4371dec1d52bd0b6528293362d8d
  FEATURE_BRANCH: agent/consumer-gate-001-native-gate-binding
  PATCH_SHA256: aa10e89824f027c10a9dc6c106df91310173f8227ddc8fe95307c40cdc568728

jobs:
  verify-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout transport payload
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: transport
          persist-credentials: false

      - name: Checkout exact canonical base
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.BASE_SHA }}
          fetch-depth: 0
          path: repo
          persist-credentials: true

      - name: Reconstruct and verify exact patch
        shell: bash
        run: |
          set -euo pipefail
          cat transport/.transport/cgate.part00 transport/.transport/cgate.part01 transport/.transport/cgate.part02 transport/.transport/cgate.part03 > /tmp/cgate.b64
          base64 -d /tmp/cgate.b64 > /tmp/cgate.patch.gz
          gzip -dc /tmp/cgate.patch.gz > /tmp/cgate.patch
          echo "${PATCH_SHA256}  /tmp/cgate.patch" | sha256sum -c -
          cd repo
          test "$(git rev-parse HEAD)" = "${BASE_SHA}"
          git diff --quiet
          git apply --check /tmp/cgate.patch
          git apply /tmp/cgate.patch
          git diff --check

      - name: Focused consumer gate and lifecycle tests
        working-directory: repo
        run: |
          set -euo pipefail
          python .adwf/tests/test_consumer_gates.py
          python .adwf/tests/test_consumer_installation.py
          python .adwf/tests/test_consumer_operational.py
          python .adwf/scripts/validate_capabilities.py
          python .adwf/scripts/validate_traceability.py
          python .adwf/scripts/docs_freshness.py
          python .adwf/scripts/generate_manifest.py --check

      - name: Exact BASE trust classification
        working-directory: repo
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ADWF Automation"
          git config user.email "actions@users.noreply.github.com"
          git add .
          git commit -m "feat: bind consumer native gates to exact provider evidence"
          HEAD_SHA="$(git rev-parse HEAD)"
          PYTHONPATH=.adwf python - <<'PY'
          import json, subprocess
          from pathlib import Path
          from lib.trust import classify_git_diff
          base='320531f5b18d4371dec1d52bd0b6528293362d8d'
          head=subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip()
          result=classify_git_diff(Path('.'), base, head)
          print(json.dumps(result, indent=2, ensure_ascii=False))
          assert result['result']=='ALLOW', result
          assert result['authorization_mode']=='STANDING_OWNER_POLICY', result
          assert result['human_required'] is False, result
          assert result['manual_required_files']==[], result
          assert result['weakening']==[], result
          assert result['reason_codes']==[], result
          PY

      - name: Authoritative ADWF self-test
        working-directory: repo
        run: python .adwf/adwf.py self-test

      - name: Publish immutable writer candidate
        working-directory: repo
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "${BASE_SHA}"
          git fsck --full --no-dangling
          git push origin "HEAD:refs/heads/${FEATURE_BRANCH}"
          echo "candidate_sha=$(git rev-parse HEAD)"
          echo "candidate_tree=$(git rev-parse HEAD^{tree})"
