name: ADWF PR

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
permissions:
  contents: write
env:
  PYTHONDONTWRITEBYTECODE: "1"
concurrency:
  group: adwf-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  fast-feedback:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12.10"
      - name: TEMP FND-001 owner-bound final materialization
        if: ${{ contains(github.event.pull_request.body, format('Owner-Attestation: `{0}`', github.event.pull_request.head.sha)) }}
        env:
          GH_TOKEN: ${{ github.token }}
          ADWF_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          ADWF_HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          git show "${ADWF_BASE_SHA}:.github/workflows/adwf-pr.yml" > .github/workflows/adwf-pr.yml
          python .adwf/scripts/docs_freshness.py --write
          python .adwf/scripts/generate_manifest.py
          python .adwf/scripts/validate_capabilities.py
          python .adwf/scripts/validate_framework.py
          python .adwf/scripts/validate_docs.py
          python .adwf/scripts/generate_manifest.py --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/adwf-pr.yml .adwf/docs-registry.json MANIFEST.json SHA256SUMS.txt
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "FND-001 materialization: no generated changes"
            exit 0
          fi
          git commit -m "FND-001: materialize canonical generated projections"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:"refs/heads/${ADWF_HEAD_BRANCH}"
          echo "FND-001 materialization: pushed final generated commit; current run is superseded"
          exit 0
      - name: Route change impact first
        id: impact
        run: python .adwf/scripts/impact_router.py --base "${{ github.event.pull_request.base.sha }}" --head "${{ github.event.pull_request.head.sha }}"
      - name: Universal safety guard
        env:
          ADWF_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          ADWF_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python .adwf/scripts/validate_ci.py
          python .adwf/adwf.py provider-check --input .adwf/requests/github-public-standard.json
          python .adwf/scripts/validate_pr.py --event "$GITHUB_EVENT_PATH" --base-sha "$ADWF_BASE_SHA" --head-sha "$ADWF_HEAD_SHA"
      - name: Framework structural/contracts gate
        if: steps.impact.outputs.full_framework == 'true'
        run: |
          python .adwf/scripts/validate_framework.py
          python .adwf/scripts/validate_pipeline_ir.py
          python .adwf/adwf.py doctor --scope package_integrity
          python .adwf/adwf.py doctor --scope config_health
          python .adwf/adwf.py self-test
      - name: Executable documentation contracts
        if: steps.impact.outputs.docs == 'true' || steps.impact.outputs.full_framework == 'true'
        run: python .adwf/scripts/validate_docs.py
      - name: Provider contract suite
        if: steps.impact.outputs.provider == 'true'
        run: python -m unittest discover -s .adwf/tests -p 'test_provider*.py' -q
      - name: Relevant project PR gates
        run: python .adwf/scripts/run_project_gates.py --phase pr
      - name: Exact-revision Playwright preview
        if: steps.impact.outputs.preview == 'true'
        run: python .adwf/scripts/run_preview.py --install-playwright
