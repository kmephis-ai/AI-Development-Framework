name: TEMP SKILL-001B Materialize

on:
  push:
    branches:
      - agent/skill-001b-managed-content

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Verify and apply exact local payload
        shell: bash
        env:
          BASE_SHA: c52e0863493bb8e9977dd0495e7585e2d29163a7
          PAYLOAD_SHA256: b0be9995d489d41e1611e25e22371790de8f1a564e15f9ebd67e7d0e8a37cbac
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD "${BASE_SHA}")" = "${BASE_SHA}"
          printf '%s  %s\n' 'fc872b0dee637c6af5ef2c251ffdb77f2e3f20bca2c3225b4214c4b6b946cd4f' '.adwf-runtime-materialize/skill001b.patch.001' | sha256sum --check --strict
          printf '%s  %s\n' '026d5a27eba6042832a597faa86d371d77d9fd58903746a0b824d261841e5f73' '.adwf-runtime-materialize/skill001b.patch.002a' | sha256sum --check --strict
          printf '%s  %s\n' '572574c07a07875027283d6175fcb8e0f5b2ee703af6c2b89c4803fa5d6b6074' '.adwf-runtime-materialize/skill001b.patch.002b' | sha256sum --check --strict
          printf '%s  %s\n' '2738af2cc16e51f4c27ce9cf24e2d3a8a474c9052f140562ca0dd2037b9bf8f1' '.adwf-runtime-materialize/skill001b.patch.002c' | sha256sum --check --strict
          printf '%s  %s\n' '9cfc6a9396611d0152ff661383b0114d3f8d6adee32e2efa2fff501b6a8f7dbc' '.adwf-runtime-materialize/skill001b.patch.002d' | sha256sum --check --strict
          printf '%s  %s\n' '9a5372e3d46391e7c070ad1f4a9f3b304c4ca21b15a94dd80a0f799bd00cce8d' '.adwf-runtime-materialize/skill001b.patch.003' | sha256sum --check --strict
          cat .adwf-runtime-materialize/skill001b.patch.001 \
              .adwf-runtime-materialize/skill001b.patch.002a \
              .adwf-runtime-materialize/skill001b.patch.002b \
              .adwf-runtime-materialize/skill001b.patch.002c \
              .adwf-runtime-materialize/skill001b.patch.002d \
              .adwf-runtime-materialize/skill001b.patch.003 > /tmp/skill001b.patch.b64
          printf '%s  %s\n' "${PAYLOAD_SHA256}" /tmp/skill001b.patch.b64 | sha256sum --check --strict
          base64 --decode /tmp/skill001b.patch.b64 | gzip --decompress > /tmp/skill001b.patch
          git apply --check /tmp/skill001b.patch
          git apply /tmp/skill001b.patch
          rm -rf .adwf-runtime-materialize
          rm -f .github/workflows/adwf-skill001b-materialize.yml

      - name: Verify final tree
        shell: bash
        run: |
          set -euo pipefail
          python .adwf/scripts/generate_skill_registry.py --check
          python .adwf/scripts/validate_skills.py
          python .adwf/scripts/eval_skills.py
          python .adwf/scripts/docs_freshness.py
          python .adwf/scripts/validate_docs.py
          python .adwf/scripts/generate_manifest.py --check
          python .adwf/scripts/validate_ci.py
          python .adwf/scripts/validate_capabilities.py
          python .adwf/scripts/validate_framework.py
          python .adwf/adwf.py self-test
          git diff --check
          test -z "$(git status --short | grep -E 'adwf-runtime-materialize|adwf-skill001b-materialize' || true)"

      - name: Commit exact feature tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          ! git diff --cached --name-only | grep -E '(^|/)adwf-runtime-materialize|adwf-skill001b-materialize'
          git commit -m "SKILL-001B: add managed routers and first process skills"
          git push origin HEAD:agent/skill-001b-managed-content
