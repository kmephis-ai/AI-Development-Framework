name: ADWF Session Core Materialize

on:
  push:
    branches:
      - agent/materialize-SESSION_CORE-001-20260818-a1

permissions:
  contents: write

env:
  EXPECTED_DOCS_REGISTRY_BLOB: 04a98be7d1474b322eb1428f45e0a58f6c97cfa6
  EXPECTED_SESSION_LIB_BLOB: 0864e46b4c55d3eeb28c43be7f92ee7bd68a0282
  EXPECTED_SESSION_TEST_BLOB: 67b4a25a0768d1a43fe899a07380cbcb0553988c
  EXPECTED_MANIFEST_BLOB: 85adbee9e3c1d997d279cec24b5dd4bb5fba636a
  EXPECTED_SUMS_BLOB: d7278692a843adebb621b344dcc24a4493af94f3

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12.10'

      - name: Materialize exact canonical projections
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/adwf-session-core-materialize.yml

          python .adwf/scripts/docs_freshness.py \
            --write \
            --reviewed-at 2026-08-17T21:21:00Z \
            --valid-until 2026-11-17T21:21:00Z
          python .adwf/scripts/generate_manifest.py

          python -m unittest discover -s .adwf/tests -p 'test_session_continuity.py'
          python .adwf/scripts/docs_freshness.py
          python .adwf/scripts/generate_manifest.py --check
          python .adwf/scripts/validate_managed_surface.py
          python .adwf/scripts/validate_docs.py
          python .adwf/scripts/validate_pipeline_ir.py
          python .adwf/adwf.py doctor --scope package_integrity
          python .adwf/adwf.py doctor --scope config_health
          git diff --check

          test "$(git hash-object .adwf/docs-registry.json)" = "${EXPECTED_DOCS_REGISTRY_BLOB}"
          test "$(git hash-object .adwf/lib/session_continuity.py)" = "${EXPECTED_SESSION_LIB_BLOB}"
          test "$(git hash-object .adwf/tests/test_session_continuity.py)" = "${EXPECTED_SESSION_TEST_BLOB}"
          test "$(git hash-object MANIFEST.json)" = "${EXPECTED_MANIFEST_BLOB}"
          test "$(git hash-object SHA256SUMS.txt)" = "${EXPECTED_SUMS_BLOB}"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m '[SESSION_CORE-001] Materialize exact canonical projections'
          git push origin HEAD:agent/materialize-SESSION_CORE-001-20260818-a1
