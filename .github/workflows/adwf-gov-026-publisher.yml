name: ADWF GOV-026 Publisher

on:
  push:
    branches:
      - agent/local-mirror-GOV-026-publisher-20260817-a

permissions:
  contents: write

env:
  WRITER_BRANCH: agent/GOV-026-bounded-recent-actions
  EXPECTED_BASE_SHA: 6ce5ed328577c7a1c64127732321cb1d634acd8a
  EXPECTED_TREE_SHA: d147ce7dcc4d21091e620987ee2238bfa75812aa
  EXPECTED_PATCH_GZ_SHA256: 5a9848b19c2aaee654e9174bf40a23fcb641479a3bf14334b0c65d6c33b6b235
  TRANSPORT_BRANCH: agent/local-mirror-GOV-026-publisher-20260817-a

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.WRITER_BRANCH }}
          fetch-depth: 0

      - name: Verify exact anchors and reconstruct patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_BASE_SHA}"
          remote_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          remote_writer="$(git ls-remote origin "refs/heads/${WRITER_BRANCH}" | awk '{print $1}')"
          test "${remote_main}" = "${EXPECTED_BASE_SHA}"
          test "${remote_writer}" = "${EXPECTED_BASE_SHA}"
          git fetch origin "${TRANSPORT_BRANCH}:refs/remotes/origin/gov-026-transport"
          git show "origin/gov-026-transport:.adwf-transport/gov-026/patch.b64" > /tmp/patch.b64
          base64 -d /tmp/patch.b64 > /tmp/gov-026.patch.gz
          echo "${EXPECTED_PATCH_GZ_SHA256}  /tmp/gov-026.patch.gz" | sha256sum -c -
          gzip -t /tmp/gov-026.patch.gz
          gzip -dc /tmp/gov-026.patch.gz > /tmp/gov-026.patch

      - name: Apply exact candidate and verify scope/tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ADWF Provider Materializer'
          git config user.email 'adwf-materializer@example.invalid'
          git am /tmp/gov-026.patch
          test "$(git rev-parse HEAD^{tree})" = "${EXPECTED_TREE_SHA}"
          cat > /tmp/expected-files <<'EOF'
          .adwf/docs-registry.json
          .adwf/lib/github_provider.py
          .adwf/scripts/github_metrics_collector.py
          .adwf/scripts/github_reconcile.py
          .adwf/tests/test_github_metrics_collector.py
          .adwf/tests/test_provider_http_mock.py
          MANIFEST.json
          SHA256SUMS.txt
          docs/governance/TRUST_AND_SELF_AUDIT.md
          EOF
          git diff --name-only "${EXPECTED_BASE_SHA}" HEAD | sort > /tmp/actual-files
          sort -o /tmp/expected-files /tmp/expected-files
          diff -u /tmp/expected-files /tmp/actual-files
          git diff --check "${EXPECTED_BASE_SHA}" HEAD
          echo "CANDIDATE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Verify exact BASE governance classification
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/.adwf"
          python - <<'PY'
          import json, os
          from lib.trust import classify_git_diff
          v = classify_git_diff('.', os.environ['EXPECTED_BASE_SHA'], os.environ['CANDIDATE_SHA'])
          print(json.dumps(v, ensure_ascii=False, sort_keys=True))
          assert v['result'] == 'HUMAN_REQUIRED', v
          assert v['authorization_mode'] == 'EXPLICIT_HUMAN_REQUIRED', v
          assert v['human_required'] is True, v
          assert v['required_risk'] == 'R4', v
          assert v['required_work_type'] == 'GOV', v
          assert v['feature_files'] == [], v
          assert v['inspection_unverified_files'] == [], v
          assert v['weakening'] == [], v
          assert sorted(v['manual_required_files']) == sorted([
              '.adwf/lib/github_provider.py',
              'docs/governance/TRUST_AND_SELF_AUDIT.md',
          ]), v
          assert v['standing_policy']['valid'] is True, v
          assert v['standing_policy']['status'] == 'ACTIVE', v
          assert v['standing_policy']['revision'] == 1, v
          PY

      - name: Focused regression and canonical checks
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/.adwf:$PWD/.adwf/tests"
          for p in \
            test_provider_http_mock.py \
            test_github_metrics_collector.py \
            test_metrics.py \
            test_reconciliation.py \
            test_trusted_controller.py; do
            python -m unittest discover -s .adwf/tests -p "$p"
          done
          python .adwf/scripts/validate_capabilities.py
          python .adwf/scripts/docs_freshness.py
          python .adwf/scripts/generate_manifest.py --check
          python .adwf/scripts/validate_managed_surface.py
          python .adwf/scripts/validate_docs.py
          python .adwf/scripts/validate_pipeline_ir.py
          python .adwf/scripts/validate_ci.py
          python .adwf/adwf.py doctor --scope package_integrity --json > /tmp/package.json
          python - <<'PY'
          import json
          value=json.load(open('/tmp/package.json'))
          assert value['categories']['package_integrity']['status']=='VERIFIED', value
          assert value['categories']['config_health']['status']=='VERIFIED', value
          PY

      - name: Full canonical self-test
        shell: bash
        run: |
          set -euo pipefail
          python .adwf/adwf.py self-test

      - name: CAS-like fast-forward publication
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^{tree})" = "${EXPECTED_TREE_SHA}"
          remote_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          remote_writer="$(git ls-remote origin "refs/heads/${WRITER_BRANCH}" | awk '{print $1}')"
          test "${remote_main}" = "${EXPECTED_BASE_SHA}"
          test "${remote_writer}" = "${EXPECTED_BASE_SHA}"
          git push origin "HEAD:refs/heads/${WRITER_BRANCH}"
