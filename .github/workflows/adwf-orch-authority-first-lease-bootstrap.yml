name: ORCH_AUTHORITY_BRIDGE-001 First Lease Bootstrap

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  acquire-first-lease:
    if: github.event.pull_request.head.ref == 'helper/ORCH_AUTHORITY_BRIDGE-001-first-lease-bootstrap-a1'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 5348021bc540ab33f4c42dc58d3ad629ea5abf1c
          persist-credentials: false
          fetch-depth: 1

      - name: Acquire exact provider-durable first lease
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_MAIN: 5348021bc540ab33f4c42dc58d3ad629ea5abf1c
          ISSUE_ID: '251'
          ROADMAP_ID: ORCH_AUTHORITY_BRIDGE-001
          RUN_ID: orch-authority-bridge-001-bootstrap-a1
          WORKER_ID: adwf-runtime:orch-authority-bridge-001-bootstrap-a1
          WORK_BRANCH: adwf/orch-authority-bridge-001-dae31fc6ccb7
        shell: python
        run: |
          from pathlib import Path
          import json, os, sys

          root = Path.cwd()
          sys.path.insert(0, str(root / '.adwf'))
          from lib.github_lease_store import GitHubLeaseStore
          from lib.github_provider import GitHubClient
          from lib.provider_contracts import ProviderContractError
          from lib.strict_json import loads as strict_loads

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GITHUB_TOKEN']
          expected_main = os.environ['EXPECTED_MAIN']
          issue_id = os.environ['ISSUE_ID']
          roadmap_id = os.environ['ROADMAP_ID']
          worker_id = os.environ['WORKER_ID']
          branch = os.environ['WORK_BRANCH']

          config = strict_loads((root / '.adwf/config.json').read_text(encoding='utf-8'))
          orchestration = config.get('orchestration') or {}
          if orchestration.get('max_parallel_writers') != 1:
              raise SystemExit('BOOTSTRAP_WRITER_CEILING_DRIFT')
          ttl = orchestration.get('lease_ttl_minutes')
          if not isinstance(ttl, int) or isinstance(ttl, bool) or not 1 <= ttl <= 240:
              raise SystemExit('BOOTSTRAP_TTL_POLICY_INVALID')

          client = GitHubClient(repo, token)
          try:
              existing_branch = client.git_ref(branch)
          except ProviderContractError as exc:
              if str(exc) != 'PROVIDER_HTTP_404':
                  raise
          else:
              raise SystemExit('BOOTSTRAP_WORK_BRANCH_ALREADY_EXISTS:' + str(existing_branch.get('ref')))

          store = GitHubLeaseStore(client)
          registry, anchor = store.read(expected_main_sha=expected_main, policy_max_parallel_writers=1)
          active = [x for x in registry.get('leases') or [] if x.get('status') == 'ACTIVE']
          if active:
              raise SystemExit('BOOTSTRAP_ACTIVE_WRITER_PRESENT')
          if registry.get('revision') != 0 or anchor is not None:
              raise SystemExit('BOOTSTRAP_EXPECTED_EMPTY_REGISTRY_DRIFT')

          resources = [{'kind':'provider','scope':'global','shared':True,'global':True}]
          persisted, lease, new_anchor = store.acquire(
              expected_main_sha=expected_main,
              policy_max_parallel_writers=1,
              issue_id=issue_id,
              roadmap_id=roadmap_id,
              worker_id=worker_id,
              base_sha=expected_main,
              branch=branch,
              resources=resources,
              ttl_minutes=ttl,
          )

          reread, reread_anchor = store.read(expected_main_sha=expected_main, policy_max_parallel_writers=1)
          matches = [x for x in reread.get('leases') or [] if x.get('status') == 'ACTIVE' and x.get('lease_id') == lease.get('lease_id')]
          if len(matches) != 1:
              raise SystemExit('BOOTSTRAP_LEASE_READBACK_MISSING')
          observed = matches[0]
          expected = {
              'issue_id': issue_id,
              'roadmap_id': roadmap_id,
              'worker_id': worker_id,
              'base_sha': expected_main,
              'branch': branch,
              'resources': resources,
          }
          for key, value in expected.items():
              if observed.get(key) != value:
                  raise SystemExit('BOOTSTRAP_LEASE_BINDING_MISMATCH:' + key)
          if reread_anchor != new_anchor or persisted.get('revision') != reread.get('revision'):
              raise SystemExit('BOOTSTRAP_LEASE_ANCHOR_READBACK_MISMATCH')

          created_branch = client.create_ref(branch, expected_main)
          branch_readback = client.git_ref(branch)
          branch_sha = str((branch_readback.get('object') or {}).get('sha') or '')
          if branch_sha != expected_main:
              raise SystemExit('BOOTSTRAP_WORK_BRANCH_READBACK_MISMATCH')

          print('BOOTSTRAP_FIRST_LEASE=PASS')
          print('LEASE_ID=' + str(lease['lease_id']))
          print('LEASE_REGISTRY_REVISION=' + str(reread['revision']))
          print('LEASE_ANCHOR=' + str(reread_anchor))
          print('WORK_BRANCH=' + branch)
          print('WORK_BRANCH_SHA=' + branch_sha)
