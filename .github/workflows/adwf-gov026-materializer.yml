name: ADWF GOV-026 Bounded Recent Runs Materializer

on:
  push:
    branches:
      - agent/materializer-GOV-026-20260817-a

permissions:
  contents: write

env:
  MAIN_SHA: ea0491fdd1399a804728167c7ef44a498b3635e1
  EXPECTED_TREE: b71832c641914bdbee2479e14af782861856fccb
  PATCH_SHA256: b3d9f8ab83aefe514b6daceae90a71ca00ea464d6832df28af9c3ba670e93eef
  TARGET_BRANCH: agent/GOV-026-bounded-recent-actions
  PATCH_GZ_B64: 

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.MAIN_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact base and apply certified patch
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          test "$(git rev-parse refs/remotes/origin/main)" = "$MAIN_SHA"
          printf '%s' "$PATCH_GZ_B64" | base64 -d | gzip -d > "$RUNNER_TEMP/gov026.patch"
          test "$(sha256sum "$RUNNER_TEMP/gov026.patch" | awk '{print $1}')" = "$PATCH_SHA256"
          git apply --check "$RUNNER_TEMP/gov026.patch"
          git apply "$RUNNER_TEMP/gov026.patch"
          mapfile -t changed < <(git diff --name-only | LC_ALL=C sort)
          expected=(.adwf/docs-registry.json .adwf/lib/github_provider.py .adwf/scripts/github_metrics_collector.py .adwf/scripts/github_reconcile.py .adwf/tests/test_github_provider_recent_runs.py MANIFEST.json SHA256SUMS.txt docs/architecture/CI_CD_ARCHITECTURE.md)
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | LC_ALL=C sort)
          test "${#changed[@]}" -eq "${#expected_sorted[@]}"
          for i in "${!expected_sorted[@]}"; do test "${changed[$i]}" = "${expected_sorted[$i]}"; done
          git add "${expected[@]}"
          test "$(git write-tree)" = "$EXPECTED_TREE"
          git diff --cached --check

      - name: Verify canonical generated artifacts are reproducible
        shell: bash
        run: |
          set -euo pipefail
          python .adwf/scripts/docs_freshness.py --write --reviewed-at 2026-08-17T17:00:00Z --valid-until 2026-11-17T17:00:00Z
          python .adwf/scripts/generate_manifest.py
          test -z "$(git diff --name-only)"
          python .adwf/scripts/docs_freshness.py
          python .adwf/scripts/generate_manifest.py --check

      - name: Run focused pagination and trusted-controller regressions
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/.adwf${PYTHONPATH:+:$PYTHONPATH}"
          python .adwf/tests/test_github_provider_recent_runs.py
          python .adwf/tests/test_provider_http_mock.py
          python .adwf/tests/test_metrics.py
          python .adwf/tests/test_trusted_controller.py
          python .adwf/tests/test_standing_owner_authorization.py
          python .adwf/tests/test_v16_remediation.py

      - name: Run canonical validators and full self-test
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/.adwf${PYTHONPATH:+:$PYTHONPATH}"
          python .adwf/scripts/docs_freshness.py
          python .adwf/scripts/validate_capabilities.py
          python .adwf/scripts/validate_managed_surface.py
          python .adwf/scripts/validate_docs.py
          python .adwf/scripts/validate_pipeline_ir.py
          python .adwf/scripts/validate_ci.py
          python .adwf/scripts/validate_framework.py
          python .adwf/scripts/generate_manifest.py --check
          python .adwf/adwf.py self-test

      - name: Seal exact GOV-026 feature commit
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git diff --name-only)"
          git config user.name 'ADWF Autonomous Writer'
          git config user.email 'adwf-writer@example.invalid'
          git commit -m 'fix(GOV-026): bound recent Actions inventory for trusted reconciliation'
          test "$(git rev-parse HEAD^)" = "$MAIN_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          test -z "$(git status --porcelain)"
          echo "candidate_commit=$(git rev-parse HEAD)"
          echo "candidate_tree=$(git rev-parse HEAD^{tree})"

      - name: Publish feature ref without force
        shell: bash
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin "HEAD:refs/heads/$TARGET_BRANCH"
