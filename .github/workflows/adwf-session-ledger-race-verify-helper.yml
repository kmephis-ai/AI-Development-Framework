name: ADWF SESSION Ledger Race Verify Helper

on:
  pull_request:
    branches:
      - helper/session-ledger-race-verify-base-20260819-a1
    paths:
      - .adwf-evidence/session-ledger-race-verify.trigger

permissions:
  contents: write

env:
  TARGET_BRANCH: agent/SESSION_LEDGER_RACE_001-runtime-ledger-singleton
  EXPECTED_HEAD: 8030a950641a1915835dc323421839e042bc80a3
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  verify-materialize:
    if: github.event.action == 'opened'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12.10'
          check-latest: false
      - name: Exact-head CAS and focused regressions
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          remote_head="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "$remote_head" = "$EXPECTED_HEAD"
          python .adwf/tests/test_session_continuity_persistence.py
          python .adwf/tests/test_session_continuity.py
      - name: Canonical projections and full validation
        shell: bash
        run: |
          set -euo pipefail
          python .adwf/scripts/docs_freshness.py --write
          python .adwf/scripts/generate_manifest.py
          python .adwf/scripts/docs_freshness.py
          python .adwf/scripts/generate_manifest.py --check
          python .adwf/scripts/validate_framework.py
          python .adwf/adwf.py self-test
      - name: Enforce generated-only post-test delta and publish same writer branch
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git status --porcelain=v1 | awk '{print $2}' | sort)"
          printf '%s\n' "$changed"
          if [ -z "$changed" ]; then
            echo 'NO_GENERATED_DELTA_REQUIRED'
            exit 0
          fi
          while IFS= read -r path; do
            case "$path" in
              .adwf/docs-registry.json|MANIFEST.json|SHA256SUMS.txt) ;;
              *) echo "UNAUTHORIZED_GENERATED_PATH:$path"; exit 1;;
            esac
          done <<< "$changed"
          remote_head="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "$remote_head" = "$EXPECTED_HEAD"
          git config user.name 'adwf-session-ledger-race'
          git config user.email 'adwf-session-ledger-race@users.noreply.github.com'
          git add .adwf/docs-registry.json MANIFEST.json SHA256SUMS.txt
          git commit -m '[SESSION_LEDGER_RACE_001] Sync canonical generated projections'
          git push origin "HEAD:${TARGET_BRANCH}"
