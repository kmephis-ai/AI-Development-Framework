name: ADWF UPGRADE Proof Connected Semantic Patch

on:
  pull_request:
    branches:
      - helper/upgrade-proof-connected-patch-base-20260819-a1
    types: [opened]

permissions:
  contents: write

env:
  MAIN_SHA: b10ab53e926b57c637c9c253cd43266e0fe1acfb
  TARGET_BRANCH: agent/UPGRADE_PROOF_CONNECTED-001-existing-installation
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONPATH: .adwf:.adwf/tests

jobs:
  patch-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: helper/upgrade-proof-connected-patch-base-20260819-a1
          fetch-depth: 1
          persist-credentials: false
      - name: Save patch script
        shell: bash
        run: cp helper/patch_upgrade_proof_connected.py "$RUNNER_TEMP/patch_upgrade_proof_connected.py"
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12.10'
          check-latest: false
      - name: Assert exact writer CAS
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$MAIN_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$MAIN_SHA"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$MAIN_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Materialize bounded semantic patch
        shell: bash
        run: |
          set -euo pipefail
          python "$RUNNER_TEMP/patch_upgrade_proof_connected.py"
          git diff --check
          git status --short
      - name: Enforce exact semantic scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only > "$RUNNER_TEMP/paths.txt"
          python - "$RUNNER_TEMP/paths.txt" <<'PY'
          import sys
          actual={x.strip() for x in open(sys.argv[1],encoding='utf-8') if x.strip()}
          expected={
            '.adwf/lib/consumer_installation.py',
            '.adwf/lib/consumer_upgrade_transaction.py',
            '.adwf/lib/external_consumer_upgrade_proof.py',
            '.adwf/schemas/external-consumer-upgrade-proof.schema.json',
            '.adwf/tests/test_consumer_upgrade_transaction.py',
            '.adwf/tests/test_external_consumer_upgrade_proof.py',
          }
          if actual != expected:
              raise SystemExit('UPGRADE_PROOF_CONNECTED_SCOPE_MISMATCH:'+','.join(sorted(actual)))
          print('semantic_scope=VERIFIED')
          PY
      - name: Focused external proof tests
        shell: bash
        run: python -m unittest discover -s .adwf/tests -p 'test_external_consumer_upgrade_proof.py' -v
      - name: Focused installation tests
        shell: bash
        run: python -m unittest discover -s .adwf/tests -p 'test_consumer_installation.py' -v
      - name: Focused upgrade transaction tests
        shell: bash
        run: python -m unittest discover -s .adwf/tests -p 'test_consumer_upgrade_transaction.py' -v
      - name: CAS publish semantic candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$MAIN_SHA"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$MAIN_SHA"
          git config user.name 'adwf-upgrade-proof-connected'
          git config user.email 'adwf-upgrade-proof-connected@users.noreply.github.com'
          git add .adwf/lib/consumer_installation.py .adwf/lib/consumer_upgrade_transaction.py .adwf/lib/external_consumer_upgrade_proof.py .adwf/schemas/external-consumer-upgrade-proof.schema.json .adwf/tests/test_consumer_upgrade_transaction.py .adwf/tests/test_external_consumer_upgrade_proof.py
          git commit -m '[UPGRADE_PROOF_CONNECTED-001] Support sealed installed-consumer upgrade proof'
          echo "candidate_sha=$(git rev-parse HEAD)"
          echo "candidate_tree=$(git rev-parse HEAD^{tree})"
          git push origin HEAD:refs/heads/$TARGET_BRANCH
