name: ADWF ORCH_RESUME-001 Lease Registry Readback

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  readback:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact canonical merge
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 5348021bc540ab33f4c42dc58d3ad629ea5abf1c
          persist-credentials: false
      - name: Read provider lease registry
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TARGET_SHA: 5348021bc540ab33f4c42dc58d3ad629ea5abf1c
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, sys
          sys.path.insert(0, '.adwf')
          from lib.github_provider import GitHubClient
          from lib.github_lease_store import GitHubLeaseStore

          store = GitHubLeaseStore(GitHubClient(repo=os.environ['REPOSITORY'], token=os.environ['GH_TOKEN']))
          state, anchor = store.read(expected_main_sha=os.environ['TARGET_SHA'], policy_max_parallel_writers=1)
          rows = []
          for lease in state['leases']:
              rows.append({k: lease.get(k) for k in ('lease_id','generation','issue_id','roadmap_id','worker_id','base_sha','branch','status','claimed_at','heartbeat_at','expires_at','released_at','provider_reconciliation_ref')})
          print('REGISTRY_REVISION=' + str(state['revision']))
          print('REGISTRY_OBSERVED_MAIN=' + str(state['observed_main_sha']))
          print('REGISTRY_ANCHOR=' + str(anchor))
          print('LEASES=' + json.dumps(rows, sort_keys=True))
          print('ACTIVE=' + json.dumps([r for r in rows if r['status'] == 'ACTIVE'], sort_keys=True))
          print('LEASE_REGISTRY_READBACK=PASS')
          PY
