name: ADWF Provider Materialize Consumer Projection

on:
  push:
    branches:
      - agent/materialize-consumer-proj-001-20260817-1704-c1

permissions:
  contents: write

env:
  MAIN_SHA: ea0491fdd1399a804728167c7ef44a498b3635e1
  FEATURE_SHA: 9028935f99155303347322099509804188073a58
  FEATURE_BRANCH: agent/CONSUMER_PROJ-001-connected-upgrade-proof
  EXPECTED_TREE: 3d9ed967a4be1659b5c6f1c36c176e6f1addda7e
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12.10"
      - name: CAS-read exact provider refs
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_MAIN="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          ACTUAL_FEATURE="$(git ls-remote origin "refs/heads/${FEATURE_BRANCH}" | awk '{print $1}')"
          test "${ACTUAL_MAIN}" = "${MAIN_SHA}"
          test "${ACTUAL_FEATURE}" = "${FEATURE_SHA}"
          git cat-file -e "${MAIN_SHA}^{commit}"
          git cat-file -e "${FEATURE_SHA}^{commit}"
      - name: Reconstruct bounded merge-sync candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ADWF Autonomous Writer"
          git config user.email "adwf-writer@example.invalid"
          git checkout -B materialize "${FEATURE_SHA}"
          set +e
          git merge --no-commit --no-ff "${MAIN_SHA}"
          MERGE_RC=$?
          set -e
          test "${MERGE_RC}" -eq 1
          mapfile -t UNMERGED < <(git diff --name-only --diff-filter=U)
          printf '%s\n' "${UNMERGED[@]}" > /tmp/unmerged.txt
          cat > /tmp/expected-unmerged.txt <<'EOF'
.adwf/docs-registry.json
MANIFEST.json
SHA256SUMS.txt
EOF
          diff -u /tmp/expected-unmerged.txt /tmp/unmerged.txt
          git checkout --theirs -- .adwf/docs-registry.json MANIFEST.json SHA256SUMS.txt
          export PYTHONPATH="$PWD/.adwf${PYTHONPATH:+:$PYTHONPATH}"
          python .adwf/scripts/docs_freshness.py --write --reviewed-at 2026-08-17T16:04:49Z --valid-until 2026-11-17T16:04:49Z
          python .adwf/scripts/generate_manifest.py
          git add .adwf/docs-registry.json MANIFEST.json SHA256SUMS.txt
          test -z "$(git diff --name-only --diff-filter=U)"
          mapfile -t CHANGED < <(git diff --name-only "${MAIN_SHA}" | LC_ALL=C sort)
          printf '%s\n' "${CHANGED[@]}" > /tmp/changed.txt
          cat > /tmp/expected-changed.txt <<'EOF'
.adwf/capability-traceability.json
.adwf/docs-registry.json
.adwf/lib/consumer_installation.py
.adwf/lib/consumer_upgrade_projection.py
.adwf/lib/consumer_upgrade_transaction.py
.adwf/scripts/apply_consumer_upgrade.py
.adwf/tests/consumer_upgrade_fixture.py
.adwf/tests/test_consumer_upgrade_connected.py
MANIFEST.json
SHA256SUMS.txt
docs/governance/CONSUMER_FRAMEWORK_UPGRADE_TRANSACTION.md
docs/governance/CONSUMER_INSTALLATION_RECORD.md
EOF
          LC_ALL=C sort -o /tmp/expected-changed.txt /tmp/expected-changed.txt
          diff -u /tmp/expected-changed.txt /tmp/changed.txt
          git diff --check "${MAIN_SHA}"
      - name: Verify focused connected-upgrade contract
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/.adwf${PYTHONPATH:+:$PYTHONPATH}"
          python -m unittest discover -s .adwf/tests -p 'test_consumer_upgrade_connected.py' -q
          python -m unittest discover -s .adwf/tests -p 'test_consumer_installation.py' -q
          python -m unittest discover -s .adwf/tests -p 'test_consumer_upgrade_core.py' -q
          python -m unittest discover -s .adwf/tests -p 'test_consumer_upgrade_adversarial.py' -q
          python -m unittest discover -s .adwf/tests -p 'test_consumer_upgrade_transaction.py' -q
          python -m unittest discover -s .adwf/tests -p 'test_consumer_upgrade_transaction_adversarial.py' -q
          python -m unittest discover -s .adwf/tests -p 'test_external_consumer_upgrade_proof.py' -q
          python -m unittest discover -s .adwf/tests -p 'test_trusted_controller.py' -q
          python -m unittest discover -s .adwf/tests -p 'test_standing_owner_authorization.py' -q
          python -m unittest discover -s .adwf/tests -p 'test_v16_remediation.py' -q
          python -m unittest discover -s .adwf/tests -p 'test_capability_live_evidence.py' -q
          python .adwf/scripts/validate_capabilities.py
          python .adwf/scripts/docs_freshness.py
          python .adwf/scripts/generate_manifest.py --check
          python .adwf/scripts/validate_managed_surface.py
          python .adwf/scripts/validate_docs.py
          python .adwf/scripts/validate_pipeline_ir.py
          python .adwf/scripts/validate_ci.py
          python .adwf/adwf.py doctor --scope package_integrity
          python .adwf/adwf.py doctor --scope config_health
      - name: Commit exact candidate and verify tree
        shell: bash
        run: |
          set -euo pipefail
          git commit -m "CONSUMER_PROJ-001: merge-sync certified GOV-025 main"
          test "$(git rev-parse HEAD^1)" = "${FEATURE_SHA}"
          test "$(git rev-parse HEAD^2)" = "${MAIN_SHA}"
          ACTUAL_TREE="$(git rev-parse HEAD^{tree})"
          test "${ACTUAL_TREE}" = "${EXPECTED_TREE}"
          echo "candidate_sha=$(git rev-parse HEAD)"
          echo "candidate_tree=${ACTUAL_TREE}"
      - name: Final CAS and normal fast-forward publication
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_MAIN="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          ACTUAL_FEATURE="$(git ls-remote origin "refs/heads/${FEATURE_BRANCH}" | awk '{print $1}')"
          test "${ACTUAL_MAIN}" = "${MAIN_SHA}"
          test "${ACTUAL_FEATURE}" = "${FEATURE_SHA}"
          git merge-base --is-ancestor "${FEATURE_SHA}" HEAD
          git push origin "HEAD:refs/heads/${FEATURE_BRANCH}"
