name: ADWF Provider Stage Consumer Projection Candidate

on:
  push:
    branches:
      - agent/materialize-consumer-proj-001-20260817-1704-c1

permissions:
  contents: write

env:
  MAIN_SHA: ea0491fdd1399a804728167c7ef44a498b3635e1
  FEATURE_SHA: 9028935f99155303347322099509804188073a58
  FEATURE_BRANCH: agent/CONSUMER_PROJ-001-connected-upgrade-proof
  STAGE_BRANCH: agent/provider-publish-CONSUMER_PROJ-001-resume-20260817-a1
  EXPECTED_TREE: 3d9ed967a4be1659b5c6f1c36c176e6f1addda7e
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  stage-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12.10"
      - name: CAS-read exact provider refs
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_MAIN="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          ACTUAL_FEATURE="$(git ls-remote origin "refs/heads/${FEATURE_BRANCH}" | awk '{print $1}')"
          ACTUAL_STAGE="$(git ls-remote origin "refs/heads/${STAGE_BRANCH}" | awk '{print $1}')"
          test "${ACTUAL_MAIN}" = "${MAIN_SHA}"
          test "${ACTUAL_FEATURE}" = "${FEATURE_SHA}"
          test "${ACTUAL_STAGE}" = "${FEATURE_SHA}"
          git fetch --no-tags origin "refs/heads/main:refs/remotes/origin/exact-main" "refs/heads/${FEATURE_BRANCH}:refs/remotes/origin/exact-feature"
      - name: Reconstruct exact tested tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ADWF Autonomous Writer"
          git config user.email "adwf-writer@example.invalid"
          git checkout -B materialize "${FEATURE_SHA}"
          set +e
          git merge --no-commit --no-ff "${MAIN_SHA}"
          MERGE_RC=$?
          set -e
          test "${MERGE_RC}" -eq 1
          git diff --name-only --diff-filter=U | LC_ALL=C sort > /tmp/unmerged.txt
          printf '%s\n' '.adwf/docs-registry.json' 'MANIFEST.json' 'SHA256SUMS.txt' | LC_ALL=C sort > /tmp/expected-unmerged.txt
          diff -u /tmp/expected-unmerged.txt /tmp/unmerged.txt
          git checkout --theirs -- .adwf/docs-registry.json MANIFEST.json SHA256SUMS.txt
          export PYTHONPATH="$PWD/.adwf${PYTHONPATH:+:$PYTHONPATH}"
          python .adwf/scripts/docs_freshness.py --write --reviewed-at 2026-08-17T16:04:49Z --valid-until 2026-11-17T16:04:49Z
          python .adwf/scripts/generate_manifest.py
          git add .adwf/docs-registry.json MANIFEST.json SHA256SUMS.txt
          test -z "$(git diff --name-only --diff-filter=U)"
          git diff --name-only "${MAIN_SHA}" | LC_ALL=C sort > /tmp/changed.txt
          printf '%s\n' '.adwf/capability-traceability.json' '.adwf/docs-registry.json' '.adwf/lib/consumer_installation.py' '.adwf/lib/consumer_upgrade_projection.py' '.adwf/lib/consumer_upgrade_transaction.py' '.adwf/scripts/apply_consumer_upgrade.py' '.adwf/tests/consumer_upgrade_fixture.py' '.adwf/tests/test_consumer_upgrade_connected.py' 'MANIFEST.json' 'SHA256SUMS.txt' 'docs/governance/CONSUMER_FRAMEWORK_UPGRADE_TRANSACTION.md' 'docs/governance/CONSUMER_INSTALLATION_RECORD.md' | LC_ALL=C sort > /tmp/expected-changed.txt
          diff -u /tmp/expected-changed.txt /tmp/changed.txt
          git diff --check "${MAIN_SHA}"
          git commit -m "CONSUMER_PROJ-001: merge-sync certified GOV-025 main"
          test "$(git rev-parse HEAD^1)" = "${FEATURE_SHA}"
          test "$(git rev-parse HEAD^2)" = "${MAIN_SHA}"
          test "$(git rev-parse HEAD^{tree})" = "${EXPECTED_TREE}"
          echo "candidate_sha=$(git rev-parse HEAD)"
      - name: Final CAS and stage candidate object
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_MAIN="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          ACTUAL_FEATURE="$(git ls-remote origin "refs/heads/${FEATURE_BRANCH}" | awk '{print $1}')"
          ACTUAL_STAGE="$(git ls-remote origin "refs/heads/${STAGE_BRANCH}" | awk '{print $1}')"
          test "${ACTUAL_MAIN}" = "${MAIN_SHA}"
          test "${ACTUAL_FEATURE}" = "${FEATURE_SHA}"
          test "${ACTUAL_STAGE}" = "${FEATURE_SHA}"
          git merge-base --is-ancestor "${FEATURE_SHA}" HEAD
          git push origin "HEAD:refs/heads/${STAGE_BRANCH}"
