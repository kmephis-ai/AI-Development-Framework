name: Materialize reconciled CONSUMER_PROV-001

on:
  push:
    branches:
      - agent/materialize-CONSUMER_PROV-001-reconcile-20260817-b

permissions:
  contents: write

env:
  BASE_SHA: 367422a8542883ed6a3575859248856f393c3f31
  EXPECTED_TREE: e62c9d1de3dd59914a2a711ae340461bc41eb52f
  WRITER_BRANCH: agent/CONSUMER_PROV-001-durable-upgrade-rebind

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Decode reconciled patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .adwf-transport/reconcile.patch.gz.b64 | gzip -dc > /tmp/reconcile.patch
          test -s /tmp/reconcile.patch

      - name: Verify exact writer head and materialize candidate
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "${BASE_SHA}"
          remote_sha="$(git ls-remote origin "refs/heads/${WRITER_BRANCH}" | awk '{print $1}')"
          test "${remote_sha}" = "${BASE_SHA}"
          git apply --check /tmp/reconcile.patch
          git apply --index /tmp/reconcile.patch
          test "$(git write-tree)" = "${EXPECTED_TREE}"

      - name: Verify reconciled candidate
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile .adwf/lib/consumer_installation.py .adwf/lib/consumer_upgrade_transaction.py .adwf/scripts/plan_consumer_upgrade.py .adwf/scripts/apply_consumer_upgrade.py
          python .adwf/tests/test_consumer_upgrade_core.py
          python .adwf/tests/test_consumer_upgrade_adversarial.py
          python .adwf/tests/test_consumer_upgrade_transaction.py
          python .adwf/tests/test_consumer_upgrade_transaction_adversarial.py
          python .adwf/tests/test_consumer_installation.py
          PYTHONPATH=.adwf:.adwf/tests python .adwf/tests/test_external_consumer_upgrade_proof.py
          python .adwf/scripts/docs_freshness.py
          python .adwf/scripts/generate_manifest.py --check
          python .adwf/scripts/validate_framework.py
          python .adwf/adwf.py self-test

      - name: CAS publish writer candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git write-tree)" = "${EXPECTED_TREE}"
          remote_sha="$(git ls-remote origin "refs/heads/${WRITER_BRANCH}" | awk '{print $1}')"
          test "${remote_sha}" = "${BASE_SHA}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(consumer): validate durable proof before fresh-session upgrade authority"
          candidate_sha="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^{tree})" = "${EXPECTED_TREE}"
          git push origin "HEAD:refs/heads/${WRITER_BRANCH}"
          printf 'candidate_sha=%s\ncandidate_tree=%s\n' "$candidate_sha" "$EXPECTED_TREE" >> "$GITHUB_STEP_SUMMARY"
