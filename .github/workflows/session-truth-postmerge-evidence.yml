name: SESSION_TRUTH Postmerge Evidence

on:
  push:
    branches:
      - helper/session-truth-001-postmerge-evidence

permissions:
  contents: write
  actions: read

env:
  TARGET_SHA: "aea2327c9bea12a4c2eb455187ae81ea02804636"
  TARGET_BRANCH: "main"
  EVIDENCE_PATH: ".adwf-evidence/session-truth-001-postmerge.json"

jobs:
  readback:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 2
          ref: helper/session-truth-001-postmerge-evidence
      - name: Fail closed on helper provenance
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD "$TARGET_SHA")" = "$TARGET_SHA"
          test "$(git diff --name-only "$TARGET_SHA" HEAD)" = ".github/workflows/session-truth-postmerge-evidence.yml"
      - name: Read exact postmerge workflow evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, time, urllib.parse, urllib.request
          from pathlib import Path

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GITHUB_TOKEN']
          target_sha = os.environ['TARGET_SHA']
          target_branch = os.environ['TARGET_BRANCH']
          evidence_path = Path(os.environ['EVIDENCE_PATH'])
          api = 'https://api.github.com'

          def get(path):
              req = urllib.request.Request(
                  api + path,
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'User-Agent': 'adwf-session-truth-evidence',
                  },
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)

          wanted = {'ADWF Main', 'ADWF Platform Smoke'}
          selected = None
          for _ in range(36):
              query = urllib.parse.urlencode({'head_sha': target_sha, 'event': 'push', 'per_page': 100})
              payload = get(f'/repos/{repo}/actions/runs?{query}')
              matches = {}
              for run in payload.get('workflow_runs', []):
                  if run.get('name') not in wanted:
                      continue
                  if run.get('head_sha') != target_sha or run.get('head_branch') != target_branch or run.get('event') != 'push':
                      continue
                  current = matches.get(run['name'])
                  if current is None or int(run['id']) > int(current['id']):
                      matches[run['name']] = run
              if wanted <= set(matches) and all(matches[name].get('status') == 'completed' for name in wanted):
                  selected = matches
                  break
              time.sleep(5)
          if selected is None:
              raise SystemExit('POSTMERGE_REQUIRED_RUNS_NOT_COMPLETED')

          evidence = {
              'schema_version': 1,
              'role': 'SESSION_TRUTH_POSTMERGE_PROVIDER_EVIDENCE',
              'repository': repo,
              'target_branch': target_branch,
              'target_sha': target_sha,
              'runs': {},
          }
          for name in sorted(wanted):
              run = selected[name]
              jobs_payload = get(f"/repos/{repo}/actions/runs/{run['id']}/jobs?per_page=100")
              jobs = [
                  {
                      'id': int(job['id']),
                      'name': job['name'],
                      'status': job['status'],
                      'conclusion': job['conclusion'],
                  }
                  for job in jobs_payload.get('jobs', [])
              ]
              if run.get('conclusion') != 'success':
                  raise SystemExit(f"POSTMERGE_RUN_FAILED:{name}:{run.get('conclusion')}")
              if not jobs or any(job['status'] != 'completed' or job['conclusion'] != 'success' for job in jobs):
                  raise SystemExit(f'POSTMERGE_JOB_FAILED:{name}')
              if name == 'ADWF Platform Smoke' and len(jobs) < 2:
                  raise SystemExit('POSTMERGE_PLATFORM_MATRIX_INCOMPLETE')
              evidence['runs'][name] = {
                  'id': int(run['id']),
                  'status': run['status'],
                  'conclusion': run['conclusion'],
                  'head_sha': run['head_sha'],
                  'head_branch': run['head_branch'],
                  'event': run['event'],
                  'jobs': jobs,
              }

          evidence_path.parent.mkdir(parents=True, exist_ok=True)
          evidence_path.write_text(json.dumps(evidence, ensure_ascii=False, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY
      - name: Self-clean and publish bounded evidence
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/session-truth-postmerge-evidence.yml
          test "$(git diff --name-only "$TARGET_SHA")" = "$EVIDENCE_PATH"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'evidence: SESSION_TRUTH-001 postmerge provider readback'
          git push origin HEAD:helper/session-truth-001-postmerge-evidence
