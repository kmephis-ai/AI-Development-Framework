name: ADWF Consumer Control Diagnostic

on:
  push:
    branches:
      - agent/diag-consumer-control-001-20260817-a1

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: daea37c1af3e03afced20c9bb8d61e89d95f7e8e
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12.4"
      - name: Run diagnostic matrix
        shell: bash
        run: |
          set -u
          : > /tmp/diagnostics.txt
          run_one() {
            name="$1"; shift
            echo "===== ${name} =====" | tee -a /tmp/diagnostics.txt
            set +e
            "$@" >> /tmp/diagnostics.txt 2>&1
            rc=$?
            set -e
            echo "RC=${rc}" | tee -a /tmp/diagnostics.txt
            echo | tee -a /tmp/diagnostics.txt
          }
          set -e
          run_one validate_ci python .adwf/scripts/validate_ci.py
          run_one validate_pipeline_ir python .adwf/scripts/validate_pipeline_ir.py
          run_one validate_framework python .adwf/scripts/validate_framework.py
          run_one validate_docs python .adwf/scripts/validate_docs.py
          run_one validate_traceability python .adwf/scripts/validate_traceability.py
          run_one validate_capabilities python .adwf/scripts/validate_capabilities.py
          run_one manifest_check python .adwf/scripts/generate_manifest.py --check
          run_one doctor_package python .adwf/adwf.py doctor --scope package_integrity
          run_one doctor_config python .adwf/adwf.py doctor --scope config_health
          cat /tmp/diagnostics.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: consumer-control-diagnostics-daea37c
          path: /tmp/diagnostics.txt
          retention-days: 1
          if-no-files-found: error
