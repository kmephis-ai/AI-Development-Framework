name: ROADMAP AI 2026 Ruleset Readback

on:
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: read

jobs:
  readback:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      EXPECTED_MAIN_SHA: 81a3e358b2271710bcb132dfd00990f34f3fbee3
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Read exact main and repository rulesets
        shell: python
        run: |
          import json, os, urllib.request
          repo = os.environ['GITHUB_REPOSITORY']
          headers = {
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          }
          def get(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)
          branch = get(f'https://api.github.com/repos/{repo}/branches/main')
          main_sha = str((branch.get('commit') or {}).get('sha') or '')
          print('MAIN_SHA=' + main_sha)
          if main_sha != os.environ['EXPECTED_MAIN_SHA']:
              raise SystemExit('MAIN_SHA_DRIFT')
          rows = get(f'https://api.github.com/repos/{repo}/rulesets?per_page=100')
          details = []
          for row in rows:
              rid = row.get('id')
              if not isinstance(rid, int):
                  raise SystemExit('RULESET_ID_INVALID')
              item = get(f'https://api.github.com/repos/{repo}/rulesets/{rid}')
              details.append({
                  'id': item.get('id'), 'name': item.get('name'), 'target': item.get('target'),
                  'enforcement': item.get('enforcement'), 'bypass_actors': item.get('bypass_actors'),
                  'conditions': item.get('conditions'), 'rules': item.get('rules'),
              })
          details.sort(key=lambda x: x['id'])
          print('RULESET_READBACK=' + json.dumps(details, sort_keys=True, separators=(',', ':')))
          if not details:
              raise SystemExit('RULESETS_NOT_VERIFIED')
