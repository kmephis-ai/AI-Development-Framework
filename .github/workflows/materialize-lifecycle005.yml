name: Materialize LIFECYCLE-005 exact candidate

on:
  push:
    branches:
      - agent/materialize-lifecycle005-20260816-a1

permissions:
  contents: write

env:
  BASE_SHA: d597b45ab8fd48d3d37ede9999b959264c7013b6
  EXPECTED_TREE: 8c8f949a10876db9f7672b780503e2bd554d6bbe
  EXPECTED_PATCH_SHA256: 80384fa399ba458ad1e056576f730bd72ba9d158572c47e30253d4131554c147
  EXPECTED_GZIP_SHA256: ed4b2cb186f3098f3a39438895a793f55f09a0297f470e9bdfcf9bd7279189c9
  EXPECTED_B64_SHA256: 7491541ff28d6a4098806f754223449546118c411a7174c05f12a14a6643f13d
  FEATURE_BRANCH: agent/lifecycle-005-consumer-profile
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12.10"

      - name: Reconstruct exact patch and verify BASE
        shell: bash
        run: |
          set -euo pipefail
          test "$(find .transport/lifecycle005 -maxdepth 1 -type f -name '*.b64part' | wc -l)" -eq 11
          cat .transport/lifecycle005/*.b64part > /tmp/lifecycle005.b64
          test "$(sha256sum /tmp/lifecycle005.b64 | awk '{print $1}')" = "$EXPECTED_B64_SHA256"
          base64 -d /tmp/lifecycle005.b64 > /tmp/lifecycle005.patch.gz
          test "$(sha256sum /tmp/lifecycle005.patch.gz | awk '{print $1}')" = "$EXPECTED_GZIP_SHA256"
          gzip -dc /tmp/lifecycle005.patch.gz > /tmp/lifecycle005.patch
          test "$(sha256sum /tmp/lifecycle005.patch | awk '{print $1}')" = "$EXPECTED_PATCH_SHA256"
          git fetch --force origin main:refs/remotes/origin/main
          test "$(git rev-parse refs/remotes/origin/main)" = "$BASE_SHA"
          git cat-file -e "${BASE_SHA}^{commit}"

      - name: Build immutable candidate outside transport tree
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/lifecycle005-candidate "$BASE_SHA"
          git -C /tmp/lifecycle005-candidate apply --index --binary /tmp/lifecycle005.patch
          git -C /tmp/lifecycle005-candidate diff --cached --check
          cat > /tmp/expected-files.txt <<'EOF'
          .adwf/adwf.py
          .adwf/capability-traceability.json
          .adwf/decision-requirement-traceability.json
          .adwf/docs-registry.json
          .adwf/lib/consumer_profile.py
          .adwf/lib/github_bootstrap.py
          .adwf/lib/health.py
          .adwf/lib/pack_materializer.py
          .adwf/lib/project_execution.py
          .adwf/roadmap.json
          .adwf/schemas/consumer-profile.schema.json
          .adwf/scripts/github_bootstrap.py
          .adwf/scripts/run_preview.py
          .adwf/scripts/run_project_gates.py
          .adwf/tests/test_consumer_profile.py
          .adwf/tests/test_project_execution_safety.py
          .adwf/tests/test_project_pack_sdk.py
          .adwf/tests/test_v16_remediation.py
          MANIFEST.json
          SHA256SUMS.txt
          docs/governance/CONSUMER_PROFILE_CONTRACT.md
          docs/governance/MANAGED_SURFACE_CONTRACT.md
          docs/governance/PROJECT_PACK_SDK.md
          docs/governance/PROJECT_RUNTIME_SAFETY.md
          EOF
          git -C /tmp/lifecycle005-candidate diff --cached --name-only | LC_ALL=C sort > /tmp/actual-files.txt
          LC_ALL=C sort -o /tmp/expected-files.txt /tmp/expected-files.txt
          diff -u /tmp/expected-files.txt /tmp/actual-files.txt
          test "$(wc -l < /tmp/actual-files.txt)" -eq 24
          test "$(git -C /tmp/lifecycle005-candidate write-tree)" = "$EXPECTED_TREE"
          git -C /tmp/lifecycle005-candidate config user.name "ADWF LIFECYCLE-005 Materializer"
          git -C /tmp/lifecycle005-candidate config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C /tmp/lifecycle005-candidate commit -m "LIFECYCLE-005: add consumer profile overlay bootstrap"
          test "$(git -C /tmp/lifecycle005-candidate rev-parse HEAD^)" = "$BASE_SHA"
          test "$(git -C /tmp/lifecycle005-candidate rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          test "$(git -C /tmp/lifecycle005-candidate diff --binary "$BASE_SHA" HEAD | sha256sum | awk '{print $1}')" = "$EXPECTED_PATCH_SHA256"
          echo "CANDIDATE_SHA=$(git -C /tmp/lifecycle005-candidate rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Classify exact diff with exact BASE policy
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/lifecycle005-base "$BASE_SHA"
          python - <<'PY'
          import json, os, sys
          sys.path.insert(0, '/tmp/lifecycle005-base/.adwf')
          from lib.trust import classify_git_diff
          result = classify_git_diff('/tmp/lifecycle005-candidate', os.environ['BASE_SHA'], os.environ['CANDIDATE_SHA'])
          print(json.dumps(result, ensure_ascii=False, sort_keys=True))
          assert result.get('result') == 'HUMAN_REQUIRED', result
          assert result.get('authorization_mode') == 'EXPLICIT_HUMAN_REQUIRED', result
          assert result.get('human_required') is True, result
          assert result.get('required_risk') == 'R4', result
          assert result.get('manual_required_files') == ['.adwf/lib/github_bootstrap.py', '.adwf/scripts/github_bootstrap.py'], result
          assert result.get('inspection_unverified_files') == [], result
          reasons = set(result.get('reason_codes') or [])
          assert {'GATE_WEAKENING_DETECTED', 'STANDING_POLICY_RESERVED_SURFACE'}.issubset(reasons), result
          assert result.get('weakening'), result
          PY

      - name: Focused lifecycle and runtime tests
        shell: bash
        working-directory: /tmp/lifecycle005-candidate
        run: |
          set -euo pipefail
          python .adwf/tests/test_consumer_profile.py
          python .adwf/tests/test_project_pack_sdk.py
          python .adwf/tests/test_project_execution_safety.py
          python .adwf/tests/test_managed_surface.py
          python .adwf/tests/test_managed_surface_transaction.py
          python .adwf/tests/test_managed_surface_detach_transaction.py
          python .adwf/tests/test_p0_safety_evidence.py
          python .adwf/tests/test_trusted_controller.py
          python .adwf/tests/test_v16_remediation.py

      - name: Canonical validators and full self-test
        shell: bash
        working-directory: /tmp/lifecycle005-candidate
        run: |
          set -euo pipefail
          python .adwf/scripts/validate_traceability.py
          python .adwf/scripts/validate_capabilities.py
          python .adwf/scripts/validate_project_packs.py
          python .adwf/scripts/validate_managed_surface.py
          python .adwf/scripts/docs_freshness.py
          python .adwf/scripts/generate_manifest.py --check
          python .adwf/scripts/validate_framework.py
          python .adwf/scripts/validate_docs.py
          python .adwf/scripts/validate_ci.py
          python .adwf/scripts/validate_pipeline_ir.py
          python .adwf/adwf.py self-test
          git diff --check "$BASE_SHA" HEAD
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          test "$(git diff --binary "$BASE_SHA" HEAD | sha256sum | awk '{print $1}')" = "$EXPECTED_PATCH_SHA256"

      - name: CAS recheck and atomically publish feature ref
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --force origin main:refs/remotes/origin/main
          test "$(git rev-parse refs/remotes/origin/main)" = "$BASE_SHA"
          remote_feature="$(git ls-remote origin "refs/heads/${FEATURE_BRANCH}" | awk '{print $1}')"
          test "$remote_feature" = "$BASE_SHA"
          auth="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git -C /tmp/lifecycle005-candidate -c "http.extraheader=AUTHORIZATION: basic ${auth}" push origin "${CANDIDATE_SHA}:refs/heads/${FEATURE_BRANCH}"
