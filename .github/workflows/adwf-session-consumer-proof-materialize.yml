name: ADWF Session Consumer Proof Materializer

on:
  push:
    branches:
      - agent/materialize-session-consumer-proof-001-20260818-c1

permissions:
  contents: write

env:
  SOURCE_SHA: f47ddb223377bbcfc69103411cf95ab4ac72fbd2

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Materialize canonical docs and integrity projections
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "${SOURCE_SHA}" HEAD
          CHANGED="$(git diff --name-only "${SOURCE_SHA}" HEAD)"
          test "${CHANGED}" = ".github/workflows/adwf-session-consumer-proof-materialize.yml" || {
            echo "unexpected helper diff from exact source: ${CHANGED}" >&2
            exit 1
          }
          rm .github/workflows/adwf-session-consumer-proof-materialize.yml
          python .adwf/scripts/docs_freshness.py --write \
            --reviewed-at 2026-08-17T21:21:00Z \
            --valid-until 2026-11-17T21:21:00Z
          python .adwf/scripts/docs_freshness.py
          python .adwf/scripts/generate_manifest.py
          python .adwf/scripts/generate_manifest.py --check
          python .adwf/scripts/validate_framework.py
          python .adwf/adwf.py self-test
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .adwf/docs-registry.json MANIFEST.json SHA256SUMS.txt .github/workflows/adwf-session-consumer-proof-materialize.yml
          git diff --cached --check
          git commit -m "[SESSION_CONSUMER_PROOF-001] Refresh canonical docs projections"
          git push origin HEAD:agent/materialize-session-consumer-proof-001-20260818-c1
