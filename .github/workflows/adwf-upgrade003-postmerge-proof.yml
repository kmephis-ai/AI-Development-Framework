name: ADWF UPGRADE-003 Post-Merge External Consumer Proof

on:
  push:
    branches:
      - agent/postmerge-upgrade003-b2b9c764

permissions:
  contents: read
  checks: write

env:
  SOURCE_SHA: 91056fc9153b3b3275a99c64adaf245122073bca
  SOURCE_TREE: 1d62da5aa55e8fb66402394b0eca85fcaa357e57
  MERGE_SHA: b2b9c76471c35458306f0dc54cf5be0c744e1787
  MERGE_TREE: c43c973f16b9cabc0115c1fa4830761f4d51a098
  CONSUMER_SHA: 00659d0e423e4baf222b056e732b576887200891
  CONSUMER_TREE: c47ddccf2b13f50fc171f005ef3197fce20b25c5

jobs:
  exact-merge-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13'
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: kmephis-ai/PrihRashOnline-v2
          ref: 00659d0e423e4baf222b056e732b576887200891
          path: external-consumer
          fetch-depth: 1
          persist-credentials: false

      - name: Bind exact merge and source revisions
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main "${SOURCE_SHA}" "${MERGE_SHA}"
          test "$(git rev-parse origin/main)" = "${MERGE_SHA}"
          test "$(git rev-parse ${MERGE_SHA}^{tree})" = "${MERGE_TREE}"
          test "$(git rev-parse ${SOURCE_SHA}^{tree})" = "${SOURCE_TREE}"
          git worktree add --detach /tmp/adwf-source "${SOURCE_SHA}"
          git worktree add --detach /tmp/adwf-merge "${MERGE_SHA}"
          test "$(git -C /tmp/adwf-source rev-parse HEAD)" = "${SOURCE_SHA}"
          test "$(git -C /tmp/adwf-merge rev-parse HEAD)" = "${MERGE_SHA}"
          test "$(git -C /tmp/adwf-merge rev-parse HEAD^{tree})" = "${MERGE_TREE}"
          test "$(git -C external-consumer rev-parse HEAD)" = "${CONSUMER_SHA}"
          test "$(git -C external-consumer rev-parse HEAD^{tree})" = "${CONSUMER_TREE}"
          test -z "$(git -C external-consumer status --porcelain=v1 --untracked-files=all)"
          test ! -e external-consumer/.adwf

      - name: Execute exact merge-SHA external consumer proof
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python /tmp/adwf-merge/.adwf/scripts/run_external_consumer_upgrade_proof.py \
            --consumer-root "$GITHUB_WORKSPACE/external-consumer" \
            --consumer-repository kmephis-ai/PrihRashOnline-v2 \
            --consumer-sha "${CONSUMER_SHA}" \
            --consumer-tree "${CONSUMER_TREE}" \
            --source-root /tmp/adwf-source \
            --source-sha "${SOURCE_SHA}" \
            --source-tree "${SOURCE_TREE}" \
            --target-root /tmp/adwf-merge \
            --target-sha "${MERGE_SHA}" \
            --target-tree "${MERGE_TREE}" \
            --product-name PrihRashOnline-v2 \
            --default-branch main \
            --repository-visibility PUBLIC \
            --provider-run-id "${GITHUB_RUN_ID}" > /tmp/external-proof.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/external-proof.json',encoding='utf-8'))
          assert p['status']=='PASS'
          assert p['consumer']['sha']=='00659d0e423e4baf222b056e732b576887200891'
          assert p['consumer']['tree']=='c47ddccf2b13f50fc171f005ef3197fce20b25c5'
          assert p['framework']['source_sha']=='91056fc9153b3b3275a99c64adaf245122073bca'
          assert p['framework']['target_sha']=='b2b9c76471c35458306f0dc54cf5be0c744e1787'
          assert p['framework']['target_tree']=='c43c973f16b9cabc0115c1fa4830761f4d51a098'
          assert p['transitions']=={'adoption':'COMMITTED','upgrade_b':'COMMITTED','rollback_a':'ROLLED_BACK','retry_b':'COMMITTED'}
          assert p['external_source_unchanged'] is True
          assert p['write_back_performed'] is False
          print('REPORT_SHA256='+p['report_sha256'])
          PY
          test "$(git -C external-consumer rev-parse HEAD)" = "${CONSUMER_SHA}"
          test "$(git -C external-consumer rev-parse HEAD^{tree})" = "${CONSUMER_TREE}"
          test -z "$(git -C external-consumer status --porcelain=v1 --untracked-files=all)"
          test ! -e external-consumer/.adwf

      - name: Publish exact merge-SHA proof check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request
          proof=json.load(open('/tmp/external-proof.json',encoding='utf-8'))
          payload={
            'name':'adwf/external-consumer-upgrade-proof',
            'head_sha':os.environ['MERGE_SHA'],
            'status':'completed','conclusion':'success',
            'output':{
              'title':'ADWF external consumer upgrade proof — exact merge SHA',
              'summary':'PASS: exact merge SHA completed read-only PrihRash disposable A→B→A→B with byte-preservation.',
              'text':('consumer='+proof['consumer']['sha']+' tree='+proof['consumer']['tree']+'\n'
                      'source='+proof['framework']['source_sha']+' target='+proof['framework']['target_sha']+'\n'
                      'report_sha256='+proof['report_sha256'])
            }
          }
          req=urllib.request.Request(
            'https://api.github.com/repos/kmephis-ai/AI-Development-Framework/check-runs',
            data=json.dumps(payload).encode(),method='POST',
            headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'})
          with urllib.request.urlopen(req,timeout=30) as r:
            body=json.load(r)
          assert body['head_sha']==os.environ['MERGE_SHA']
          assert body['conclusion']=='success'
          print('PROOF_CHECK_ID='+str(body['id']))
          PY
