name: ADWF EDGEREF-001 Exact Transport Repair

on:
  push:
    branches:
      - agent/materialize-edgeref001-81da2e96

permissions:
  contents: write

concurrency:
  group: adwf-edgeref001-transport-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.event.head_commit.message == 'EDGEREF-001: exact repair of transport chunk'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: agent/materialize-edgeref001-81da2e96
          fetch-depth: 1
      - name: Repair only the localized 1536..2048 interval
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path

          path = Path('.transport/edgeref001/chunk.000')
          remote = path.read_text(encoding='utf-8')
          assert len(remote) == 17999, len(remote)
          assert hashlib.sha256(remote.encode()).hexdigest() == 'f0c931a8d84ac7202eebb723d2529452fe6eadf09fbca9904468cdd7b25ce8dd'
          expected_segment = ''
          assert len(expected_segment) == 512
          assert hashlib.sha256(expected_segment.encode()).hexdigest() == '78dd674adb746a902a0617dcdabdf7d19f57c53b650a78c10c4109066961131c'
          repaired = remote[:1536] + expected_segment + remote[2047:]
          assert len(repaired) == 18000, len(repaired)
          digest = hashlib.sha256(repaired.encode()).hexdigest()
          assert digest == '355bc238155fcaa8033a75f22e8e006bd1eb6678a612379160e4270174c22ac6', digest
          path.write_text(repaired, encoding='utf-8')
          print('REPAIRED_CHUNK000_SHA256=' + digest)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .transport/edgeref001/chunk.000
          git commit -m "EDGEREF-001: repair exact transport byte"
          git push origin HEAD:agent/materialize-edgeref001-81da2e96
