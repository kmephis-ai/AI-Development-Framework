name: ADWF GOV-020 Provider Certification

on:
  push:
    branches:
      - agent/materialize-gov020-20260816-a26b88ce

permissions:
  contents: write
  actions: read

env:
  EXPECTED_BASE: 4df1c8da93e85ac26e3382ffe4b3ee990d771d54
  EXPECTED_TREE: 30eba7388febb753defe6590267ca768435bda60
  EXPECTED_PATCH_SHA256: 8699faa1135a06c7181b9c549603ffebbd3d4df2fc6ca44c99b91e7ec63c5113
  TARGET_BRANCH: agent/gov-020-provider-log-redirect-boundary
  HISTORICAL_JOB_ID: '95152646575'

jobs:
  certify-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.13'
      - name: Reconstruct exact candidate and verify immutable binding
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main "${TARGET_BRANCH}"
          test "$(git rev-parse origin/main)" = "${EXPECTED_BASE}"
          test "$(git rev-parse "origin/${TARGET_BRANCH}")" = "${EXPECTED_BASE}"
          git reset --hard "${EXPECTED_BASE}"
          cat > /tmp/candidate.patch.gz.b64 <<'B64'
          
          B64
          base64 -d /tmp/candidate.patch.gz.b64 > /tmp/candidate.patch.gz
          gzip -dc /tmp/candidate.patch.gz > /tmp/candidate.patch
          test "$(sha256sum /tmp/candidate.patch | awk '{print $1}')" = "${EXPECTED_PATCH_SHA256}"
          git apply --check /tmp/candidate.patch
          git apply /tmp/candidate.patch
          mapfile -t files < <(git diff --name-only | sort)
          expected=(
            .adwf/docs-registry.json
            .adwf/lib/http_transport.py
            .adwf/scripts/collect_preview_attestation.py
            .adwf/tests/test_provider_http_mock.py
            .adwf/tests/test_trusted_controller.py
            MANIFEST.json
            SHA256SUMS.txt
          )
          test "${#files[@]}" -eq "${#expected[@]}"
          for i in "${!expected[@]}"; do test "${files[$i]}" = "${expected[$i]}"; done
          git add -A
          test "$(git write-tree)" = "${EXPECTED_TREE}"
          git config user.email 'adwf-provider@example.invalid'
          git config user.name 'ADWF Provider Certification'
          git commit -m 'GOV-020: harden provider redirect credential boundary'
          echo "CANDIDATE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Focused redirect and trusted-controller tests
        run: |
          set -euo pipefail
          python .adwf/tests/test_provider_http_mock.py
          python .adwf/tests/test_trusted_controller.py
          python .adwf/scripts/docs_freshness.py
          python .adwf/scripts/generate_manifest.py --check
          python .adwf/scripts/validate_framework.py
      - name: Real GitHub signed job-log redirect readback
        env:
          ADWF_GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, os, sys
          sys.path.insert(0, '.adwf')
          from lib.github_provider import GitHubClient
          data = GitHubClient(os.environ['GITHUB_REPOSITORY'], os.environ['ADWF_GITHUB_TOKEN']).job_logs(int(os.environ['HISTORICAL_JOB_ID']))
          if not data:
              raise SystemExit('EMPTY_JOB_LOG_READBACK')
          print('REAL_JOB_LOG_READBACK=PASS')
          print('REAL_JOB_LOG_BYTES=' + str(len(data)))
          print('REAL_JOB_LOG_SHA256=' + hashlib.sha256(data).hexdigest())
          PY
      - name: Full self-test and exact BASE trust classification
        run: |
          set -euo pipefail
          python .adwf/adwf.py self-test
          test -z "$(git status --porcelain)"
          git worktree add --detach /tmp/adwf-base "${EXPECTED_BASE}"
          PYTHONPATH=/tmp/adwf-base/.adwf python - <<'PY'
          import json, os, sys
          sys.path.insert(0, '/tmp/adwf-base/.adwf')
          from lib.trust import classify_git_diff
          result=classify_git_diff(os.environ['GITHUB_WORKSPACE'],os.environ['EXPECTED_BASE'],os.environ['CANDIDATE_SHA'])
          print(json.dumps(result,sort_keys=True))
          assert result['result']=='ALLOW'
          assert result['authorization_mode']=='STANDING_OWNER_POLICY'
          assert result['human_required'] is False
          assert result['manual_required_files']==[]
          assert result['weakening']==[]
          assert result['reason_codes']==[]
          assert result['feature_files']==[]
          PY
      - name: Final CAS and atomic writer publication
        run: |
          set -euo pipefail
          git fetch origin main "${TARGET_BRANCH}"
          test "$(git rev-parse origin/main)" = "${EXPECTED_BASE}"
          test "$(git rev-parse "origin/${TARGET_BRANCH}")" = "${EXPECTED_BASE}"
          test "$(git rev-parse HEAD^{tree})" = "${EXPECTED_TREE}"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
