name: GOV-034 Stage-3 Test Repair V7 Recovery Retry4

on:
  push:
    branches:
      - agent/local-mirror-gov034-stage2-20260829-a2

permissions:
  contents: write
  issues: read
  pull-requests: read

concurrency:
  group: gov034-stage3-test-repair-v7-${{ github.repository }}
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  repair-stage3-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact pre-repair PR HEAD
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 39800c71282954333087c26b55f3ec5ff8ee9506
          path: candidate
          fetch-depth: 2
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12.10"
          check-latest: false

      - name: Build exact repair candidate and focused test
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import ast, hashlib
          p=Path('candidate/.adwf/tests/test_provider_ops_gateway.py'); raw=p.read_bytes()
          blob=lambda b: hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          if blob(raw)!='edd2db96e4add36c4f2f5d11891679fb43056a85': raise SystemExit('V7_CANDIDATE_BASE_BLOB_DRIFT')
          old=b'    def process(self, *, client=None, store=None, freshness=None, body=None):\n        client = client or Client()\n        client.main = MAIN\n        if client.branch_sha == HEAD:\n            client.branch_sha = MAIN\n'
          new=b'    def process(self, *, client=None, store=None, freshness=None, body=None):\n        if client is None:\n            client = Client()\n            client.branch_sha = MAIN\n        client.main = MAIN\n'
          if raw.count(old)!=1: raise SystemExit('V7_CANDIDATE_OLD_SNIPPET_COUNT')
          fixed=raw.replace(old,new)
          if blob(fixed)!='ce268e7611745ff16f8ce0b31630c79b129d0348' or hashlib.sha256(fixed).hexdigest()!='533c7f30b6366ac94d58cfe665370339d2a34fb2f2bef4cb8000329c487711c9': raise SystemExit('V7_CANDIDATE_FIXED_IDENTITY')
          ast.parse(fixed.decode()); p.write_bytes(fixed); print('V7_CANDIDATE_BYTES_PASS')
          PY
          cd candidate/.adwf/tests
          env -i PATH="$PATH" HOME="$HOME" LANG=C.UTF-8 LC_ALL=C.UTF-8 PYTHONDONTWRITEBYTECODE=1 python -m unittest -v test_provider_ops_gateway.ProviderOpsLeaseReleaseUnchangedTests

      - name: Checkout exact protected BASE
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: aad3aba5ccb5f37882b8d51e89ff2c66da6e2822
          path: trusted
          fetch-depth: 2
          persist-credentials: false

      - name: Disposable canonical projections and full self-test before lease mutation
        shell: bash
        run: |
          set -euo pipefail
          cleanenv=(env -i PATH="$PATH" HOME="$HOME" LANG=C.UTF-8 LC_ALL=C.UTF-8 PYTHONDONTWRITEBYTECODE=1)
          "${cleanenv[@]}" python -I trusted/.adwf/scripts/docs_freshness.py --root "$PWD/candidate" --write
          "${cleanenv[@]}" python -I trusted/.adwf/scripts/generate_manifest.py --root "$PWD/candidate"
          python - <<'PY'
          import subprocess
          got=set(subprocess.check_output(['git','-C','candidate','diff','--name-only'],text=True).splitlines())
          want={'.adwf/tests/test_provider_ops_gateway.py','.adwf/docs-registry.json','MANIFEST.json','SHA256SUMS.txt'}
          if got!=want: raise SystemExit('V7_DISPOSABLE_GENERATOR_UNEXPECTED_PATH:'+','.join(sorted(got)))
          PY
          sha256sum candidate/.adwf/docs-registry.json candidate/MANIFEST.json candidate/SHA256SUMS.txt > /tmp/v7-proj.before
          "${cleanenv[@]}" python -I trusted/.adwf/scripts/docs_freshness.py --root "$PWD/candidate" --write
          "${cleanenv[@]}" python -I trusted/.adwf/scripts/generate_manifest.py --root "$PWD/candidate"
          sha256sum candidate/.adwf/docs-registry.json candidate/MANIFEST.json candidate/SHA256SUMS.txt > /tmp/v7-proj.after
          cmp /tmp/v7-proj.before /tmp/v7-proj.after
          cd candidate
          "${cleanenv[@]}" python .adwf/adwf.py self-test

      - name: Materialize exact V7 trusted controller from verified parent transport
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL 'https://raw.githubusercontent.com/kmephis-ai/AI-Development-Framework/2764f0a1f4ccd4809fcffb3b58b8c81ac9be4b9a/.github/workflows/adwf-local-mirror-bootstrap.yml' -o /tmp/parent.yml
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, re, zlib
          text=Path('/tmp/parent.yml').read_text()
          m=re.search(r'^\s*V7_CONTROLLER_ZB64:\s*(\S+)\s*$',text,re.M)
          if not m: raise SystemExit('V7_PARENT_CONTROLLER_MISSING')
          raw=zlib.decompress(base64.b64decode(m.group(1),validate=True))
          if hashlib.sha256(raw).hexdigest()!='d247e3ea377c4a7f999cafb9d7439e1ad4ba6eb3635cf697bacaeb275cea145e': raise SystemExit('V7_PARENT_CONTROLLER_DIGEST')
          s=raw.decode()
          repl=[(
          "transport_first = '63757bd5f68ee5b0f8463057ad22a1c22a798ab7'\ntransport_parent = '6f633c6410b0c96122b1893bf116f8c0bd58aa46'\n",
          "transport_first = '63757bd5f68ee5b0f8463057ad22a1c22a798ab7'\ntransport_second = '6f633c6410b0c96122b1893bf116f8c0bd58aa46'\ntransport_parent = '2764f0a1f4ccd4809fcffb3b58b8c81ac9be4b9a'\n"),(
          "    _require_workflow_only_child(transport_first, transport_root, 'FIRST')\n    _require_workflow_only_child(transport_parent, transport_first, 'SECOND')\n    _require_workflow_only_child(transport_sha, transport_parent, 'THIRD')\n",
          "    _require_workflow_only_child(transport_first, transport_root, 'FIRST')\n    _require_workflow_only_child(transport_second, transport_first, 'SECOND')\n    _require_workflow_only_child(transport_parent, transport_second, 'THIRD')\n    _require_workflow_only_child(transport_sha, transport_parent, 'FOURTH')\n"),(
          "    'transport_first': transport_first,\n    'transport_parent': transport_parent,\n",
          "    'transport_first': transport_first,\n    'transport_second': transport_second,\n    'transport_parent': transport_parent,\n")]
          for old,new in repl:
              if s.count(old)!=1: raise SystemExit('V7_CONTROLLER_PATCH_SHAPE')
              s=s.replace(old,new)
          out=s.encode()
          if hashlib.sha256(out).hexdigest()!='6565c981dd89bafc02512ebc2339c31e91da1fbd59b68cae3cd949478db2698d': raise SystemExit('V7_CONTROLLER_DIGEST_MISMATCH')
          Path('v7_controller.py').write_bytes(out); print('V7_CONTROLLER_BYTES_PASS')
          PY

      - name: Rebind stale writer and publish exact test-harness-only child
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd trusted
          python ../v7_controller.py
