name: GOV-029 Canonical Materializer Helper

on:
  push:
    branches:
      - helper/local-mirror-gov029-candidate-20260820-a1

permissions:
  contents: write

env:
  SOURCE_SHA: f81be1ba655ba864b7bbb59025f3062a44ff3cfc

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Materialize exact candidate projections
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "${SOURCE_SHA}^{commit}"
          rm -rf /tmp/gov029-source
          git worktree add --detach /tmp/gov029-source "${SOURCE_SHA}"
          python /tmp/gov029-source/.adwf/scripts/docs_freshness.py --root /tmp/gov029-source --write
          python /tmp/gov029-source/.adwf/scripts/generate_manifest.py --root /tmp/gov029-source
          python /tmp/gov029-source/.adwf/scripts/docs_freshness.py --root /tmp/gov029-source
          python /tmp/gov029-source/.adwf/scripts/generate_manifest.py --root /tmp/gov029-source --check
          cp /tmp/gov029-source/.adwf/docs-registry.json .adwf/docs-registry.json
          cp /tmp/gov029-source/MANIFEST.json MANIFEST.json
          cp /tmp/gov029-source/SHA256SUMS.txt SHA256SUMS.txt
          git add .adwf/docs-registry.json MANIFEST.json SHA256SUMS.txt
          if git diff --cached --quiet; then
            echo "Canonical projections already materialized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: materialize GOV-029 canonical projections"
          git push origin HEAD:helper/local-mirror-gov029-candidate-20260820-a1
