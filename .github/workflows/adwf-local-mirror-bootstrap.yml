name: ADWF Local Git Mirror Bootstrap

on:
  push:
    branches:
      - agent/local-mirror-SKIP-PREVIEW-001-adwf-20260818-a1

permissions:
  contents: read
  statuses: write

env:
  SOURCE_SHA: 50a59a81c955703c51299a5a25846b1d20eaff3d
  SOURCE_BRANCH: main
  MIRROR_ARTIFACT_NAME: skip-preview-adwf-50a59a81-a1

jobs:
  build-bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build exact-source bundle
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "${SOURCE_SHA}^{commit}"
          git branch -f adwf-source "${SOURCE_SHA}"
          mkdir -p mirror-artifact
          git bundle create mirror-artifact/repository.bundle refs/heads/adwf-source --tags
          git bundle verify mirror-artifact/repository.bundle
          BUNDLE_SHA256="$(sha256sum mirror-artifact/repository.bundle | awk '{print $1}')"
          BUNDLE_BYTES="$(wc -c < mirror-artifact/repository.bundle | tr -d ' ')"
          printf '%s  %s\n' "${BUNDLE_SHA256}" "repository.bundle" > mirror-artifact/SHA256SUMS.txt
          cat > mirror-artifact/manifest.json <<JSON
          {
            "schema_version": 1,
            "source_repository": "${GITHUB_REPOSITORY}",
            "source_branch": "${SOURCE_BRANCH}",
            "source_sha": "${SOURCE_SHA}",
            "transport_sha": "${GITHUB_SHA}",
            "bundle_sha256": "${BUNDLE_SHA256}",
            "bundle_bytes": ${BUNDLE_BYTES},
            "bundle_ref": "refs/heads/adwf-source"
          }
          JSON

      - name: Upload bundle artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ env.MIRROR_ARTIFACT_NAME }}
          path: mirror-artifact/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Publish connector-readable run id
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          payload="$(jq -n --arg description "run_id=${GITHUB_RUN_ID}" --arg target_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" '{state:"success",context:"adwf-local-mirror-bootstrap",description:$description,target_url:$target_url}')"
          curl -fsS \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "${payload}" >/dev/null
