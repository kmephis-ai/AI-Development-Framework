name: ADWF Projection Regenerator

on:
  push:
    branches:
      - agent/local-mirror-session-consumer-proof-001-20260818-b1

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Regenerate exact-source integrity projections and self-clean
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "8ca93ada1915aca4eca18d55fc5e20ec29ef5e63" || {
            echo "unexpected helper base" >&2
            exit 1
          }
          rm .github/workflows/adwf-local-mirror-bootstrap.yml
          python .adwf/scripts/generate_manifest.py
          python .adwf/scripts/generate_manifest.py --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MANIFEST.json SHA256SUMS.txt .github/workflows/adwf-local-mirror-bootstrap.yml
          git diff --cached --check
          git commit -m "[SESSION_CONSUMER_PROOF-001] Regenerate integrity projections"
          git push origin HEAD:agent/local-mirror-session-consumer-proof-001-20260818-b1
