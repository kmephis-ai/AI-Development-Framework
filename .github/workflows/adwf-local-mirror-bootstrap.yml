name: GOV-034 Stage-3 Test Repair V7 Recovery

on:
  push:
    branches:
      - agent/local-mirror-gov034-stage2-20260829-a2

permissions:
  contents: write
  issues: read
  pull-requests: read

concurrency:
  group: gov034-stage3-test-repair-v7-${{ github.repository }}
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  repair-stage3-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact pre-repair PR HEAD as disposable test candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 39800c71282954333087c26b55f3ec5ff8ee9506
          path: candidate
          fetch-depth: 2
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12.10"
          check-latest: false

      - name: Build exact V7 test-only candidate and verify byte identity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PYV7PATCH'
          from pathlib import Path
          import ast, hashlib
          path = Path('candidate/.adwf/tests/test_provider_ops_gateway.py')
          raw = path.read_bytes()
          def git_blob(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          if git_blob(raw) != 'edd2db96e4add36c4f2f5d11891679fb43056a85':
              raise SystemExit('V7_CANDIDATE_BASE_BLOB_DRIFT')
          old = '    def process(self, *, client=None, store=None, freshness=None, body=None):\n        client = client or Client()\n        client.main = MAIN\n        if client.branch_sha == HEAD:\n            client.branch_sha = MAIN\n'.encode('utf-8')
          new = '    def process(self, *, client=None, store=None, freshness=None, body=None):\n        if client is None:\n            client = Client()\n            client.branch_sha = MAIN\n        client.main = MAIN\n'.encode('utf-8')
          if raw.count(old) != 1:
              raise SystemExit('V7_CANDIDATE_OLD_SNIPPET_COUNT')
          fixed = raw.replace(old, new)
          if git_blob(fixed) != 'ce268e7611745ff16f8ce0b31630c79b129d0348':
              raise SystemExit('V7_CANDIDATE_FIXED_BLOB_MISMATCH')
          if hashlib.sha256(fixed).hexdigest() != '533c7f30b6366ac94d58cfe665370339d2a34fb2f2bef4cb8000329c487711c9':
              raise SystemExit('V7_CANDIDATE_FIXED_SHA256_MISMATCH')
          ast.parse(fixed.decode('utf-8'), filename=str(path))
          path.write_bytes(fixed)
          print('V7_CANDIDATE_BYTES_PASS')
          PYV7PATCH

      - name: Focused Stage-3 lease-release tests before lease mutation
        shell: bash
        run: |
          set -euo pipefail
          cd candidate/.adwf/tests
          env -i PATH="$PATH" HOME="$HOME" LANG=C.UTF-8 LC_ALL=C.UTF-8 PYTHONDONTWRITEBYTECODE=1 python -m unittest -v test_provider_ops_gateway.ProviderOpsLeaseReleaseUnchangedTests

      - name: Full ADWF self-test before lease mutation
        shell: bash
        run: |
          set -euo pipefail
          cd candidate
          env -i PATH="$PATH" HOME="$HOME" LANG=C.UTF-8 LC_ALL=C.UTF-8 PYTHONDONTWRITEBYTECODE=1 python .adwf/adwf.py self-test

      - name: Checkout exact trusted protected BASE
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: aad3aba5ccb5f37882b8d51e89ff2c66da6e2822
          path: trusted
          fetch-depth: 2
          persist-credentials: false

      - name: Materialize exact V7 trusted controller
        shell: bash
        env:
          V7_CONTROLLER_ZB64: 
        run: |
          set -euo pipefail
          python - <<'PYV7CONTROLLER'
          from pathlib import Path
          import base64, hashlib, os, zlib
          raw = zlib.decompress(base64.b64decode(os.environ['V7_CONTROLLER_ZB64'], validate=True))
          if hashlib.sha256(raw).hexdigest() != '6cbbdf24e236f7b437508ccea3cf61a322a97852c9b5e1859cafafa5aecf39e1':
              raise SystemExit('V7_CONTROLLER_DIGEST_MISMATCH')
          Path('v7_controller.py').write_bytes(raw)
          print('V7_CONTROLLER_BYTES_PASS')
          PYV7CONTROLLER

      - name: Rebind stale writer and publish exact test-harness-only child
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd trusted
          python ../v7_controller.py
