name: ADWF Local Git Mirror Fallback

on:
  push:
    branches:
      - agent/local-mirror-ROADMAP_AUTONOMY-001-20260822-a1

permissions:
  contents: write

env:
  SOURCE_SHA: bfaefcc2bccf18ab7e080d4f840e6e4c3f3d311c
  SOURCE_BRANCH: adwf/roadmap-autonomy-001-a1

jobs:
  build-chunks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Build exact-source Base64 chunks
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "${SOURCE_SHA}^{commit}"
          git branch -f adwf-source "${SOURCE_SHA}"
          rm -rf mirror
          mkdir -p mirror/chunks
          git bundle create /tmp/repository.bundle refs/heads/adwf-source --tags
          git bundle verify /tmp/repository.bundle
          BUNDLE_SHA256="$(sha256sum /tmp/repository.bundle | awk '{print $1}')"
          BUNDLE_BYTES="$(wc -c < /tmp/repository.bundle | tr -d ' ')"
          base64 -w0 /tmp/repository.bundle > /tmp/repository.bundle.b64
          split -b 45000 -d -a 4 --additional-suffix=.b64part /tmp/repository.bundle.b64 mirror/chunks/part-
          PARTS="$(find mirror/chunks -type f -name 'part-*.b64part' | wc -l | tr -d ' ')"
          cat > mirror/manifest.json <<JSON
          {
            "schema_version": 1,
            "source_repository": "${GITHUB_REPOSITORY}",
            "source_branch": "${SOURCE_BRANCH}",
            "source_sha": "${SOURCE_SHA}",
            "transport_sha": "${GITHUB_SHA}",
            "bundle_sha256": "${BUNDLE_SHA256}",
            "bundle_bytes": ${BUNDLE_BYTES},
            "chunk_bytes": 45000,
            "parts": ${PARTS},
            "bundle_ref": "refs/heads/adwf-source"
          }
          JSON

      - name: Refresh docs digests and deterministic package projections
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/adwf-source-worktree
          git worktree add --detach /tmp/adwf-source-worktree "${SOURCE_SHA}"
          python - <<'PY'
          from pathlib import Path
          import json, sys
          root = Path('/tmp/adwf-source-worktree')
          sys.path.insert(0, str(root / '.adwf'))
          from lib.docs_freshness import source_digest
          from lib.strict_json import loads as strict_loads
          path = root / '.adwf/docs-registry.json'
          registry = strict_loads(path.read_text(encoding='utf-8'))
          for item in registry.get('documents', []):
              item['source_digest'] = source_digest(root, item.get('watched', []))
          path.write_text(json.dumps(registry, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          python /tmp/adwf-source-worktree/.adwf/scripts/generate_manifest.py --root /tmp/adwf-source-worktree
          mkdir -p mirror/generated
          cp /tmp/adwf-source-worktree/.adwf/docs-registry.json mirror/generated/docs-registry.json
          cp /tmp/adwf-source-worktree/MANIFEST.json mirror/generated/MANIFEST.json
          cp /tmp/adwf-source-worktree/SHA256SUMS.txt mirror/generated/SHA256SUMS.txt
          git worktree remove --force /tmp/adwf-source-worktree

      - name: Publish chunks and generated projections on disposable branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mirror
          git commit -m "chore: publish refreshed docs and deterministic projections [mirror-output]"
          git push origin HEAD:${GITHUB_REF_NAME}
