name: ADWF ROADMAP-REALIGN-001 Disposable Materializer

on:
  push:
    branches:
      - helper/roadmap-realign-001-materialize-20260820-a1

permissions:
  contents: write

env:
  SOURCE_SHA: 7060a26d57ba9d6bb02d7b1bcc1b457ea6d34abd

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: helper/roadmap-realign-001-materialize-20260820-a1
          fetch-depth: 0

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12.10'
          check-latest: false

      - name: Materialize bounded Roadmap DAG and canonical projections
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git merge-base "$SOURCE_SHA" HEAD)" = "$SOURCE_SHA"
          rm .github/workflows/adwf-roadmap-realign-materialize.yml

          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('.adwf/roadmap.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          goals = [g for g in data.get('goals', []) if g.get('id') == 'FOUNDATION-ENGINEERING-OS']
          if len(goals) != 1:
              raise SystemExit('FOUNDATION_GOAL_NOT_UNIQUE')
          tasks = goals[0].get('tasks')
          if not isinstance(tasks, list):
              raise SystemExit('FOUNDATION_TASKS_INVALID')
          ids = [str(t.get('roadmap_id')) for t in tasks if isinstance(t, dict)]
          if len(ids) != len(set(ids)):
              raise SystemExit('ROADMAP_ID_DUPLICATE_PREEXISTING')
          expected_absent = {'DELIVERY_SHA_IDENTITY-001', 'ORCH-001', 'MULTIWRITER-001', 'PPCF-001'}
          present = expected_absent.intersection(ids)
          if present:
              raise SystemExit('ROADMAP_TARGET_ALREADY_PRESENT:' + ','.join(sorted(present)))
          session = [t for t in tasks if t.get('roadmap_id') == 'SESSION_CONTINUITY-001']
          if len(session) != 1 or session[0].get('dependencies') != ['CONSUMER_GATE_RETRY-001']:
              raise SystemExit('SESSION_CONTINUITY_BASELINE_DRIFT')
          tasks.extend([
              {
                  'roadmap_id': 'DELIVERY_SHA_IDENTITY-001',
                  'title_ru': 'Exact merged delivery revision continuity through PROMOTE/OBSERVE',
                  'dependencies': ['SESSION_CONTINUITY-001'],
                  'product_impact': False,
              },
              {
                  'roadmap_id': 'ORCH-001',
                  'title_ru': 'Durable autonomous development orchestration + Human-by-Exception',
                  'dependencies': ['DELIVERY_SHA_IDENTITY-001'],
                  'product_impact': False,
              },
              {
                  'roadmap_id': 'MULTIWRITER-001',
                  'title_ru': 'Conflict-domain safe multi-writer orchestration',
                  'dependencies': ['ORCH-001'],
                  'product_impact': False,
              },
              {
                  'roadmap_id': 'PPCF-001',
                  'title_ru': 'Provider & Plugin Capability Framework',
                  'dependencies': ['SESSION_CONTINUITY-001'],
                  'product_impact': False,
              },
          ])
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

          python .adwf/scripts/docs_freshness.py --write
          python .adwf/scripts/generate_manifest.py
          python .adwf/scripts/validate_framework.py
          python .adwf/scripts/validate_docs.py
          python .adwf/adwf.py self-test
          git diff --check "$SOURCE_SHA"

          git diff --name-only "$SOURCE_SHA" | sort > /tmp/actual-final-paths
          printf '%s\n' '.adwf/docs-registry.json' '.adwf/roadmap.json' 'MANIFEST.json' 'SHA256SUMS.txt' | sort > /tmp/expected-final-paths
          diff -u /tmp/expected-final-paths /tmp/actual-final-paths

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --name-only | sort > /tmp/actual-staged-paths
          printf '%s\n' '.adwf/docs-registry.json' '.adwf/roadmap.json' '.github/workflows/adwf-roadmap-realign-materialize.yml' 'MANIFEST.json' 'SHA256SUMS.txt' | sort > /tmp/expected-staged-paths
          diff -u /tmp/expected-staged-paths /tmp/actual-staged-paths
          git commit -m "[ROADMAP-REALIGN-001] Materialize P0 autonomy DAG [helper-output]"
          git push origin HEAD:${GITHUB_REF_NAME}
