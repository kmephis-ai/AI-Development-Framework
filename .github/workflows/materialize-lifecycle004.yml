name: Materialize LIFECYCLE-004 exact candidate

on:
  push:
    branches:
      - agent/materialize-lifecycle004-20260816-a1

permissions:
  contents: write

env:
  BASE_SHA: fd31d61563f7ee6f26632f7f2b30645025cf17d8
  EXPECTED_TREE: 6deb470e6b86f813581bff4208c8a8a5bd152264
  EXPECTED_PATCH_SHA256: ade6b5559d104c398d4b0115bd0bcd3bc7b18396bd9ab1813f9a3eaba2c9e80d
  EXPECTED_B64_SHA256: 02415f57525c76068898a3da923145097836e5c7cb00c3e752d0f30739d2167f
  FEATURE_BRANCH: agent/lifecycle-004-adoption-resume-repair
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12.10"

      - name: Reconstruct exact patch and verify BASE
        shell: bash
        run: |
          set -euo pipefail
          test "$(find .transport/lifecycle004 -maxdepth 1 -type f -name '*.part' | wc -l)" -eq 3
          cat .transport/lifecycle004/*.part > /tmp/lifecycle004.patch.gz.b64
          test "$(sha256sum /tmp/lifecycle004.patch.gz.b64 | awk '{print $1}')" = "$EXPECTED_B64_SHA256"
          base64 -d /tmp/lifecycle004.patch.gz.b64 | gzip -dc > /tmp/lifecycle004.patch
          test "$(sha256sum /tmp/lifecycle004.patch | awk '{print $1}')" = "$EXPECTED_PATCH_SHA256"
          git fetch --force origin main:refs/remotes/origin/main
          test "$(git rev-parse refs/remotes/origin/main)" = "$BASE_SHA"
          git cat-file -e "${BASE_SHA}^{commit}"

      - name: Build immutable candidate outside transport tree
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/lifecycle004-candidate "$BASE_SHA"
          git -C /tmp/lifecycle004-candidate apply --index --binary /tmp/lifecycle004.patch
          git -C /tmp/lifecycle004-candidate diff --cached --check
          cat > /tmp/expected-files.txt <<'EOF'
          .adwf/decision-requirement-traceability.json
          .adwf/docs-registry.json
          .adwf/lib/managed_surface_transaction.py
          .adwf/roadmap.json
          .adwf/tests/test_managed_surface_transaction.py
          MANIFEST.json
          SHA256SUMS.txt
          docs/governance/MANAGED_SURFACE_CONTRACT.md
          EOF
          git -C /tmp/lifecycle004-candidate diff --cached --name-only | LC_ALL=C sort > /tmp/actual-files.txt
          LC_ALL=C sort -o /tmp/expected-files.txt /tmp/expected-files.txt
          diff -u /tmp/expected-files.txt /tmp/actual-files.txt
          test "$(wc -l < /tmp/actual-files.txt)" -eq 8
          test "$(git -C /tmp/lifecycle004-candidate write-tree)" = "$EXPECTED_TREE"
          git -C /tmp/lifecycle004-candidate config user.name "ADWF LIFECYCLE-004 Materializer"
          git -C /tmp/lifecycle004-candidate config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C /tmp/lifecycle004-candidate commit -m "LIFECYCLE-004: restore adoption retry semantics"
          test "$(git -C /tmp/lifecycle004-candidate rev-parse HEAD^)" = "$BASE_SHA"
          test "$(git -C /tmp/lifecycle004-candidate rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          test "$(git -C /tmp/lifecycle004-candidate diff --binary "$BASE_SHA" HEAD | sha256sum | awk '{print $1}')" = "$EXPECTED_PATCH_SHA256"
          echo "CANDIDATE_SHA=$(git -C /tmp/lifecycle004-candidate rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Classify final diff with exact BASE policy
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/lifecycle004-base "$BASE_SHA"
          python - <<'PY'
          import json, os, sys
          sys.path.insert(0, '/tmp/lifecycle004-base/.adwf')
          from lib.trust import classify_git_diff
          result = classify_git_diff('/tmp/lifecycle004-candidate', os.environ['BASE_SHA'], os.environ['CANDIDATE_SHA'])
          print(json.dumps(result, ensure_ascii=False, sort_keys=True))
          assert result.get('result') == 'ALLOW', result
          assert result.get('authorization_mode') == 'STANDING_OWNER_POLICY', result
          assert result.get('human_required') is False, result
          assert result.get('manual_required_files') == [], result
          assert result.get('weakening') == [], result
          assert result.get('reason_codes') == [], result
          PY

      - name: Focused lifecycle regression tests
        shell: bash
        working-directory: /tmp/lifecycle004-candidate
        run: |
          set -euo pipefail
          python .adwf/tests/test_managed_surface_transaction.py
          python .adwf/tests/test_managed_surface_detach_transaction.py
          python .adwf/tests/test_managed_surface.py

      - name: Canonical validators and full self-test
        shell: bash
        working-directory: /tmp/lifecycle004-candidate
        run: |
          set -euo pipefail
          python .adwf/scripts/validate_traceability.py
          python .adwf/scripts/validate_capabilities.py
          python .adwf/scripts/docs_freshness.py
          python .adwf/scripts/generate_manifest.py --check
          python .adwf/scripts/validate_managed_surface.py
          python .adwf/scripts/validate_docs.py
          python .adwf/scripts/validate_ci.py
          python .adwf/scripts/validate_framework.py
          python .adwf/adwf.py self-test
          git diff --check "$BASE_SHA" HEAD
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          test "$(git diff --binary "$BASE_SHA" HEAD | sha256sum | awk '{print $1}')" = "$EXPECTED_PATCH_SHA256"

      - name: CAS recheck and atomically publish feature ref
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --force origin main:refs/remotes/origin/main
          test "$(git rev-parse refs/remotes/origin/main)" = "$BASE_SHA"
          remote_feature="$(git ls-remote origin "refs/heads/${FEATURE_BRANCH}" | awk '{print $1}')"
          test "$remote_feature" = "$BASE_SHA"
          auth="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git -C /tmp/lifecycle004-candidate -c "http.extraheader=AUTHORIZATION: basic ${auth}" push origin "${CANDIDATE_SHA}:refs/heads/${FEATURE_BRANCH}"
