name: CONSUMER_GATE_RETRY-001 Verify Diagnostics A4

on:
  push:
    branches:
      - helper/CONSUMER_GATE_RETRY-001-verifydiag-20260819-a4

permissions:
  contents: write

env:
  SOURCE_SHA: 86d943b03a1fc591b5b533d1ac211da93dc70694
  OUTPUT_BRANCH: helper/CONSUMER_GATE_RETRY-001-verifydiag-output-20260819-a4

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Reconstruct exact six-file candidate snapshot
        id: prep
        shell: bash
        run: |
          set -euo pipefail
          rm -rf materializer-diagnostics
          rm -f .github/workflows/consumer-gate-retry-001-verifydiag.yml
          printf '%s\n' .adwf/lib/consumer_gates.py .adwf/roadmap.json .adwf/tests/test_consumer_ci.py .adwf/tests/test_consumer_gates.py MANIFEST.json SHA256SUMS.txt | sort > /tmp/expected.txt
          git diff --name-only "$SOURCE_SHA" | sort > /tmp/actual.txt
          diff -u /tmp/expected.txt /tmp/actual.txt
          python .adwf/tests/test_consumer_gates.py -q
          python .adwf/tests/test_consumer_ci.py -q

      - name: Manifest check
        id: manifest
        run: python .adwf/scripts/generate_manifest.py --check

      - name: CI validation
        id: ci
        run: python .adwf/scripts/validate_ci.py

      - name: Pipeline IR validation
        id: pipeline
        run: python .adwf/scripts/validate_pipeline_ir.py

      - name: Capability validation
        id: capabilities
        run: python .adwf/scripts/validate_capabilities.py

      - name: Traceability validation
        id: traceability
        run: python .adwf/scripts/validate_traceability.py

      - name: Documentation validation
        id: docs
        run: python .adwf/scripts/validate_docs.py

      - name: Framework structural validation
        id: framework
        run: python .adwf/scripts/validate_framework.py

      - name: Package integrity doctor
        id: package
        run: python .adwf/adwf.py doctor --scope package_integrity

      - name: Config health doctor
        id: config
        run: python .adwf/adwf.py doctor --scope config_health

      - name: ADWF self-test
        id: selftest
        run: python .adwf/adwf.py self-test

      - name: Publish verification outcomes
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verify-diagnostics
          cat > verify-diagnostics/outcome.json <<JSON
          {
            "source_sha": "${SOURCE_SHA}",
            "prep": "${{ steps.prep.outcome }}",
            "manifest": "${{ steps.manifest.outcome }}",
            "ci": "${{ steps.ci.outcome }}",
            "pipeline": "${{ steps.pipeline.outcome }}",
            "capabilities": "${{ steps.capabilities.outcome }}",
            "traceability": "${{ steps.traceability.outcome }}",
            "docs": "${{ steps.docs.outcome }}",
            "framework": "${{ steps.framework.outcome }}",
            "package": "${{ steps.package.outcome }}",
            "config": "${{ steps.config.outcome }}",
            "selftest": "${{ steps.selftest.outcome }}"
          }
          JSON
          git config user.name "adwf-verify-diagnostic"
          git config user.email "adwf-verify-diagnostic@users.noreply.github.com"
          git add -A
          git commit -m "[CONSUMER_GATE_RETRY-001] Verification diagnostic snapshot"
          git push origin "HEAD:refs/heads/${OUTPUT_BRANCH}"