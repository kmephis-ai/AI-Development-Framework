name: Инженерная задача ADWF
description: Один Roadmap ID, один Issue, одна проверяемая цель
title: "[ROADMAP-ID] "
labels: ["roadmap:needs-spec"]
body:
  - type: markdown
    attributes:
      value: "Основной поясняющий текст — по-русски. До прохождения Issue Quality Gate задача не станет READY."
  - type: input
    id: roadmap_id
    attributes:
      label: Roadmap ID
      description: Уникальный ID из единственной канонической дорожной карты.
      placeholder: WB-042
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Цель
      description: Один проверяемый результат, без скрытого расширения scope.
    validations:
      required: true
  - type: textarea
    id: value
    attributes:
      label: Зачем это владельцу или продукту
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Что входит в работу
    validations:
      required: true
  - type: textarea
    id: out_of_scope
    attributes:
      label: Что точно не входит
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Критерии приёмки
      description: Наблюдаемые и однозначные результаты.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: План проверки и evidence
      description: Команды, runtime smoke, Golden Paths и срок действия evidence.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Зависимости
      description: Roadmap ID зависимостей либо NONE.
    validations:
      required: true
  - type: dropdown
    id: dependencies_resolved
    attributes:
      label: Зависимости проверены
      description: YES допустимо только после фактической проверки всех Roadmap ID.
      options: ["NO", "YES"]
    validations:
      required: true
  - type: input
    id: conflict_domain
    attributes:
      label: Контур конфликта
      placeholder: controller-security
    validations:
      required: true
  - type: dropdown
    id: work_type
    attributes:
      label: Тип работы
      options: [feature, bug, recovery, verification, governance, docs, migration]
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Приоритет
      options: [P0, P1, P2, P3]
    validations:
      required: true
  - type: input
    id: roadmap_order
    attributes:
      label: Порядок в Roadmap
      description: Неотрицательное целое число из канонической Roadmap.
      placeholder: "42"
    validations:
      required: true
  - type: dropdown
    id: risk
    attributes:
      label: Риск
      options: [R0, R1, R2, R3, R4]
    validations:
      required: true
  - type: dropdown
    id: product_impact
    attributes:
      label: Влияет на реальный продукт
      options: ["YES", "NO"]
    validations:
      required: true
  - type: dropdown
    id: human_required
    attributes:
      label: Требуется решение владельца
      options: ["NO", "YES"]
    validations:
      required: true
